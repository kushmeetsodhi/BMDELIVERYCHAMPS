<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BM Loading</title>
<script src="config.js?v=bc5ba8ced9"></script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  :root{
    --brand:#0E1466; --brand-ink:#FFFFFF; --brand-soft:#C9CDF2;
    --bg:#F3F4F8; --card:#FFFFFF; --ink:#151826; --sub:#5A6075; --faint:#8B91A3; --line:#E2E5EC;
    --field:#FFFFFF;
    --green:#16794A; --green-bg:#E3F4EA;
    --red:#B42323; --red-bg:#FDE2E2;
    --amber:#8A5300; --amber-bg:#FFF1D6;
    --blue:#1B2A8F; --blue-bg:#E3E7FB;
    --shadow:0 1px 2px rgba(20,20,43,0.06), 0 1px 3px rgba(20,20,43,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#151A4D; --brand-soft:#A9AECB;
      --bg:#0F1222; --card:#1A1E33; --ink:#ECEEF7; --sub:#A9AECB; --faint:#7D83A3; --line:#2E3350; --field:#12152A;
      --green:#4ADE80; --green-bg:#16301F; --red:#F87171; --red-bg:#3A1C1C;
      --amber:#FBBF24; --amber-bg:#33290F; --blue:#9DB2FF; --blue-bg:#1E2650;
      --shadow:0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --brand:#151A4D; --brand-soft:#A9AECB;
    --bg:#0F1222; --card:#1A1E33; --ink:#ECEEF7; --sub:#A9AECB; --faint:#7D83A3; --line:#2E3350; --field:#12152A;
    --green:#4ADE80; --green-bg:#16301F; --red:#F87171; --red-bg:#3A1C1C;
    --amber:#FBBF24; --amber-bg:#33290F; --blue:#9DB2FF; --blue-bg:#1E2650;
    --shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
        background:var(--bg); color:var(--ink); font-size:15px; }
  button{ font:inherit; }

  .top{ position:sticky; top:0; z-index:20; background:var(--brand); color:var(--brand-ink);
        padding:calc(14px + env(safe-area-inset-top)) 16px 14px; }
  .top-row{ display:flex; align-items:center; gap:10px; }
  .top h1{ margin:0; font-size:20px; font-weight:700; flex:1; }
  .top .sub{ font-size:13px; color:var(--brand-soft); margin-top:3px; }
  .icon-btn{ width:42px; height:42px; border-radius:21px; border:0; background:rgba(255,255,255,0.13);
             color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; flex:none; }
  .days{ display:flex; gap:8px; margin-top:12px; }
  .day{ flex:1; padding:9px 0; text-align:center; border-radius:10px; background:rgba(255,255,255,0.10);
        color:var(--brand-soft); font-weight:600; font-size:13.5px; border:0; cursor:pointer; }
  .day.on{ background:#fff; color:#0E1466; }
  .prog{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-top:12px; }
  .prog div{ background:rgba(255,255,255,0.10); border-radius:10px; padding:7px 4px; text-align:center; }
  .prog b{ display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .prog span{ font-size:11px; color:var(--brand-soft); }

  .page{ padding:14px 14px 120px; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--card); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .card.done{ border-left:5px solid var(--green); }
  .row{ display:flex; align-items:center; gap:10px; }
  .grow{ flex:1; min-width:0; }
  .shop{ font-weight:700; font-size:16px; }
  .meta{ font-size:13px; color:var(--sub); }
  .seq{ width:34px; height:34px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center;
        font-weight:800; flex:none; }
  .pill{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .p-ok{ background:var(--green-bg); color:var(--green); } .p-mid{ background:var(--amber-bg); color:var(--amber); }
  .p-blue{ background:var(--blue-bg); color:var(--blue); }
  .instr{ background:var(--amber-bg); color:var(--amber); border-radius:10px; padding:8px 10px; font-size:13.5px; font-weight:600; }
  .note{ font-size:12.5px; color:var(--sub); }
  .err{ background:var(--red-bg); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .okmsg{ background:var(--green-bg); color:var(--green); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .sec{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin:6px 2px 0; }
  .empty{ text-align:center; color:var(--sub); padding:30px 10px; }
  .spin{ text-align:center; color:var(--sub); padding:40px 0; }

  label.f{ display:block; font-size:13px; font-weight:600; color:var(--sub); margin:12px 0 6px; }
  input{ width:100%; height:50px; border-radius:10px; border:1px solid var(--line); background:var(--field);
         color:var(--ink); padding:0 12px; font-size:18px; font-weight:600; }
  input[type="text"].plain, input[type="password"]{ font-weight:400; font-size:16px; }
  .counts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .counts label{ display:block; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .units{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--sub); }
  .units b{ font-size:16px; color:var(--ink); }

  .btn{ width:100%; height:52px; border-radius:12px; border:0; background:var(--brand); color:#fff; font-weight:700;
        font-size:16px; cursor:pointer; }
  :root[data-theme="dark"] .btn{ background:#3B4BC8; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{ background:#3B4BC8; } }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.go{ background:var(--green); color:#fff; }
  :root[data-theme="dark"] .btn.go{ background:#1F9D5B; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.go{ background:#1F9D5B; } }
  .btn.undo{ background:var(--green-bg); color:var(--green); }
  .btn.sm{ width:auto; height:38px; padding:0 14px; font-size:13.5px; border-radius:19px; }
  .btn[disabled]{ opacity:.55; }

  .items{ margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  .seals{ margin-top:8px; }
  .seals label{ display:block; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .seals .sg{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .shortb{ display:inline-block; margin-top:3px; padding:1px 8px; border-radius:10px; background:#fde8e6; color:#b3261e; font-size:12px; font-weight:700; }
  .qedit{ border:0; background:transparent; color:var(--blue); font-weight:700; font-size:13px; padding:6px 4px; }
  .qs{ display:grid; grid-template-columns:64px 1fr 64px; gap:10px; align-items:center; margin-top:14px; }
  .qs button{ height:56px; border-radius:14px; border:1.5px solid var(--blue); background:transparent; color:var(--blue); font-size:28px; font-weight:700; }
  .qs b{ text-align:center; font-size:34px; }
  .it{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .it:last-child{ border-bottom:0; }
  .it .nm{ flex:1; min-width:0; font-size:14px; }
  .it .nm small{ display:block; color:var(--sub); font-size:12px; }
  .it.d .nm{ color:var(--faint); text-decoration:line-through; }
  .tick{ width:78px; height:40px; border-radius:20px; border:1.5px solid var(--blue); background:transparent; color:var(--blue);
         font-weight:700; font-size:13.5px; cursor:pointer; flex:none; }
  .tick.on{ background:var(--green); border-color:var(--green); color:#fff; }
  .link{ background:none; border:0; color:var(--blue); font-weight:700; font-size:13.5px; padding:6px 0; cursor:pointer; }

  .foot{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line);
         padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .foot-in{ max-width:560px; margin:0 auto; }
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; }
  .login .card{ width:100%; max-width:380px; padding:26px 20px; }
  input.act{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); }
  input[readonly]{ caret-color:transparent; }
  body.kp-open .page{ padding-bottom:330px; }
  body.kp-open .foot{ display:none; }
  .kp{ position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--card); border-top:1px solid var(--line);
       box-shadow:0 -6px 20px rgba(0,0,0,.18); padding:8px 10px calc(10px + env(safe-area-inset-bottom)); }
  .kp-in{ max-width:560px; margin:0 auto; }
  .kp-top{ display:flex; align-items:center; gap:10px; padding:2px 4px 8px; font-size:14px; color:var(--sub); }
  .kp-top b{ color:var(--ink); }
  .kp-done{ height:36px; padding:0 18px; border-radius:18px; border:0; background:var(--brand); color:#fff; font-weight:700; }
  .kp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kp .k{ height:56px; border-radius:12px; border:0; background:var(--bg); color:var(--ink); font-size:24px; font-weight:700; }
  .kp .k:active{ background:var(--blue-bg); }
  .kp .k.alt{ color:var(--sub); }
  .kp .k.go{ background:var(--blue-bg); color:var(--blue); font-size:17px; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--card); border-radius:12px; padding:4px; box-shadow:var(--shadow); }
  .seg button{ height:42px; border-radius:9px; border:0; background:transparent; color:var(--sub); font-weight:600; cursor:pointer; }
  .seg button.on{ background:var(--brand); color:#fff; }
  .chips{ display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .chip{ flex:none; min-width:44px; height:36px; padding:0 10px; border-radius:18px; border:0; background:rgba(255,255,255,0.12);
         color:var(--brand-soft); font-weight:700; font-size:14px; }
  .chip.ok{ background:rgba(74,222,128,0.28); color:#fff; }
  .chip.cur{ background:#fff; color:#0E1466; }
  .pn{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .avatar{ width:46px; height:46px; border-radius:23px; background:var(--blue-bg); color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; flex:none; }
  .seg3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; background:var(--bg); border-radius:12px; padding:4px; }
  .seg3 button{ height:44px; border-radius:9px; border:0; background:transparent; color:var(--sub); font-weight:600; cursor:pointer; }
  .seg3 button.on{ background:var(--brand); color:#fff; }
  .vbtn{ background:rgba(255,255,255,0.16); color:#fff; border:0; border-radius:12px; padding:3px 10px; font:inherit; font-weight:700; cursor:pointer; }
  .vbtn.chg{ background:var(--amber-bg); color:var(--amber); }
  .modal{ position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:18px; }
  .modal .box{ width:100%; max-width:380px; background:var(--card); border-radius:16px; padding:18px; }
  .cam{ position:fixed; inset:0; z-index:9999; background:#000; display:flex; flex-direction:column; }
  .cam video{ flex:1; width:100%; min-height:0; object-fit:cover; background:#000; }
  .cam.flash video{ opacity:.35; }
  .cam-msg{ position:absolute; top:40%; left:0; right:0; text-align:center; color:#fff; font-size:15px; padding:0 20px; }
  .cam-bar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px calc(16px + env(safe-area-inset-bottom)); background:#000; }
  .cam-shoot{ width:72px; height:72px; border-radius:50%; border:5px solid #fff; background:#ffffff40; padding:0; }
  .cam-shoot:active{ transform:scale(.92); }
  .cam-done{ background:none; border:1.5px solid #fff; color:#fff; border-radius:9px; padding:10px 18px; font-size:15px; font-weight:700; }
  .cam-n{ color:#fff; font-size:15px; min-width:72px; text-align:right; }
  .spot{ display:inline-block; margin-top:10px; padding:6px 12px; border-radius:10px; background:var(--blue-bg); color:var(--blue); font-weight:800; font-size:15px; }
  .chip.bad{ background:#ffd9d6; color:#b3261e; }
  .fm-c.red{ border-color:var(--red); background:#fff1f0; color:#b3261e; }
  .scanb{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:48px; margin-top:12px; border-radius:12px; background:var(--blue-bg); color:var(--blue); font-weight:700; cursor:pointer; }
  .fm-row{ display:flex; align-items:center; gap:10px; padding:4px 0; }
  .fm-n{ width:28px; text-align:center; color:var(--sub); font-weight:700; font-size:14px; flex:none; }
  .fm-c{ flex:1; height:50px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-size:24px; font-weight:700; letter-spacing:.08em; text-align:left; padding:0 14px; }
  .fm-c.act{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); }
  .fm-c.emp{ color:var(--faint); font-weight:500; }
  .fm-x{ width:40px; height:40px; border:0; border-radius:20px; background:transparent; color:var(--sub); font-size:20px; flex:none; }
  body.mk-open .page{ padding-bottom:330px; }
  .ph .th.stg{ outline:2px dashed var(--blue); }
  .subm{ width:100%; margin-top:10px; }
  .ph{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .ph .th{ position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; background:var(--bg); flex:none; }
  .ph .th img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ph .th.up img{ opacity:.45; }
  .ph .th.bad{ outline:2px solid var(--red); }
  .ph .th .x{ position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:11px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:22px; padding:0; }
  .ph .th .st{ position:absolute; left:0; right:0; bottom:0; font-size:10px; text-align:center; background:rgba(0,0,0,.6); color:#fff; padding:1px 0; }
  .ph .add{ display:inline-flex; align-items:center; gap:6px; height:44px; padding:0 14px; border-radius:22px; background:var(--blue-bg); color:var(--blue); font-weight:700; font-size:13.5px; cursor:pointer; }
  .ph .add.dis{ opacity:.5; pointer-events:none; }
  .plan{ margin:8px 2px 0; }
  .plan-t{ display:flex; align-items:center; gap:10px; font-size:17px; }
  .p-late{ background:var(--red-bg); color:var(--red); }
  .toast.good{ background:var(--green); }
  .toast{ position:fixed; left:14px; right:14px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:40; background:var(--red); color:#fff;
          border-radius:12px; padding:11px 13px; font-weight:600; font-size:14px; max-width:532px; margin:0 auto; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var BM_HOSTED = !!window.BM_EXEC_URL;
var state = { token:'', name:'', loginName:'', view:'login', date:'', routes:null, route:null, code:'',
              error:'', loading:false, busy:false, open:{}, toast:'', cur:0,
              mode:(function(){ try { return localStorage.getItem('bm_ld_mode') === 'one' ? 'one' : 'list'; } catch (e) { return 'list'; } })() };

/******************** THEME ********************/
function theme(){ try { return localStorage.getItem('bm_ld_theme') || ''; } catch (e) { return ''; } }
function applyTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(t){ try { if (t) localStorage.setItem('bm_ld_theme', t); else localStorage.removeItem('bm_ld_theme'); } catch (e) {} applyTheme(t); render(); }
applyTheme(theme());

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayStr(){ return state.date || ''; }   // empty: the server picks the delivery day now being loaded
function shiftDay(day, n){ var d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function clock12(t){
  var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return '';
  var hr = Number(m[1]);
  return ((hr % 12) || 12) + ':' + m[2] + (hr < 12 ? ' AM' : ' PM');
}
function dayLabel(day){
  var d = new Date(day + 'T12:00:00');
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
}
function store(){ try { return window.localStorage; } catch (e) { return null; } }
function tel(p){ return String(p || '').replace(/[^\d+]/g, ''); }

/******************** SERVER ********************/
function api(action, payload){
  return new Promise(function(resolve){
    if (!BM_HOSTED) { resolve({ success:false, error:'This page has no server address set.' }); return; }
    var data = { action: action, token: state.token };
    for (var k in (payload || {})) if (payload.hasOwnProperty(k)) data[k] = payload[k];
    fetch(window.BM_EXEC_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(data), redirect:'follow', credentials:'omit', cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var r;
        try { r = JSON.parse(t); } catch (e) { r = { success:false, error:'The server sent a page instead of an answer.' }; }
        if (r && r.expired) logout('Please sign in again.');
        resolve(r);
      })
      .catch(function(){ resolve({ success:false, error:'No connection. Check your internet and try again.', offline:true }); });
  });
}

// Writes go one after another, so a quick run of taps lands in order.
var chain = Promise.resolve();
function send(action, payload){
  state.pending = (state.pending || 0) + 1;
  var p = chain.then(function(){ return api(action, payload); });
  chain = p.then(function(){ state.pending--; }, function(){ state.pending--; });
  return p;
}

// A copy of the last screens is kept on the phone, so a route opens at
// once and the fresh answer replaces it when it arrives.
function readCopy(key){ try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function writeCopy(key, data){
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data: data })); } catch (e) { pruneCopies(true); }
}
function pruneCopies(hard){
  try {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('bm_ld_route_') === 0) keys.push(k); }
    var all = keys.map(function(k){ var c = readCopy(k); return { k: k, at: c ? c.at : 0 }; }).sort(function(a, b){ return b.at - a.at; });
    all.slice(hard ? 2 : 14).forEach(function(x){ localStorage.removeItem(x.k); });
  } catch (e) {}
}
var copyTimer = 0;
function touchCopy(){
  if (copyTimer) return;
  copyTimer = setTimeout(function(){
    copyTimer = 0;
    if (state.token && state.route && state.shown) writeCopy('bm_ld_route_' + state.shown + '_' + state.code, JSON.parse(JSON.stringify(state.route, function(k, v){ return (k === 'thumb' || k === 'staged') ? undefined : v; })));
  }, 700);
}

function saveSession(){
  var s = store(); if (!s) return;
  try { s.setItem('bm_ld', JSON.stringify({ token: state.token, name: state.name, loginName: state.loginName })); } catch (e) {}
}
function logout(msg){
  if (state.token) api('ldLogout', {});
  state.token = ''; state.name = ''; state.routes = null; state.route = null; state.date = '';
  state.view = 'login'; state.error = msg || '';
  var s = store(); if (s) try { s.removeItem('bm_ld'); } catch (e) {}
  try { var del = []; for (var q = 0; q < localStorage.length; q++) { var kk = localStorage.key(q); if (kk && kk.indexOf('bm_ld_r') === 0) del.push(kk); } del.forEach(function(x){ localStorage.removeItem(x); }); } catch (e) {}
  render();
}
function toast(msg, good){
  state.toast = msg; state.toastGood = !!good; renderToast();
  clearTimeout(toast.t); toast.t = setTimeout(function(){ state.toast = ''; renderToast(); }, 4500);
}
function renderToast(){
  var el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = state.toast ? 'toast' + (state.toastGood ? ' good' : '') : ''; el.textContent = state.toast || '';
  el.style.display = state.toast ? '' : 'none';
}

/******************** LOADING DATA ********************/
function loadRoutes(quiet){
  var ck = 'bm_ld_routes_' + (dayStr() || 'now');
  if (!state.routes) {
    var c = readCopy(ck);
    if (c && c.data && Date.now() - c.at < 12 * 3600000) { state.routes = c.data; state.shown = c.data.day; }
  }
  if (!quiet) { state.loading = !state.routes; state.error = ''; render(); }
  api('ldRoutes', { date: dayStr() }).then(function(r){
    if (!state.token) return;
    state.loading = false;
    if (r && r.success) { state.routes = r; state.shown = r.day; writeCopy(ck, r); }
    else if (!quiet) state.error = (r && r.error) || 'Could not load the routes.';
    if (state.view === 'routes') render();
  });
}
function firstOpen(r){
  for (var k = 0; k < r.orders.length; k++) if (!r.orders[k].loaded) return k;
  return 0;
}
function openRoute(code){
  state.view = 'route'; state.code = code; state.route = null; state.error = ''; state.open = {};
  var c = readCopy('bm_ld_route_' + state.shown + '_' + code);
  var hadCopy = !!(c && c.data && c.data.success && Date.now() - c.at < 6 * 3600000);
  if (hadCopy) { state.route = adopt(c.data); state.cur = firstOpen(c.data); }
  render(); window.scrollTo(0, 0);
  if (hadCopy) fillItems();
  api('ldRoute', { date: state.shown, code: code }).then(function(r){
    if (state.code !== code || !state.token) return;
    if (r && r.success) {
      // Edits still on their way to the server (or being typed) win over this answer.
      if (!(hadCopy && ((state.pending || 0) > 0 || kp.i >= 0))) {
        state.route = adopt(r);
        if (!hadCopy || state.cur >= r.orders.length) state.cur = firstOpen(r);
      }
      touchCopy();
    } else if (!state.route) state.error = (r && r.error) || 'Could not open the route.';
    if (kp.i < 0) render();
    fillItems();
  });
}

// Orders whose items were not saved when the route was made: look them
// up in the background and fill them in as they arrive.
function fillItems(){
  var r = state.route, code = state.code;
  if (!r || state.filling === code) return;
  var need = r.orders.some(function(o){ return !o.items; });
  if (!need) return;
  state.filling = code; state.fillDone = false; if (kp.i < 0) render();
  api('ldItemsFill', { date: state.shown, code: code }).then(function(x){
    state.filling = ''; state.fillDone = true;
    if (state.code !== code || !state.route || !state.token) return;
    if (x && x.success) {
      state.route.orders.forEach(function(o, i){
        var its = x.items[o.invoiceNo];
        if (its && !o.items) {
          o.items = its.map(function(y){ return { p: y.p, v: y.v, q: y.q, pcs: y.pcs, d: false }; });
          o.itemsTotal = its.length; o.itemsDone = 0;
        }
      });
      touchCopy();
    }
    if (kp.i < 0) render(); else state.route.orders.forEach(function(o, i){ redrawOrder(i); });
  });
}
function reloadRoute(){
  var code = state.code;
  if ((state.pending || 0) > 0) { toast('Still saving. Try again in a moment.'); return; }
  api('ldRoute', { date: state.shown, code: code }).then(function(r){
    if (state.code !== code) return;
    if (r && r.success) { state.route = adopt(r); touchCopy(); render(); fillItems(); } else if (r) toast(r.error || 'Could not reload.');
  });
}

/******************** SMALL PIECES ********************/
function n0(v){ var n = parseInt(String(v || '').replace(/\D/g, ''), 10); return isFinite(n) ? n : 0; }
function adopt(r){
  (r.orders || []).forEach(function(o){
    o.photos = (o.photos || []).map(function(p){ return typeof p === 'string' ? { link: p } : p; });
  });
  return r;
}
function sumUp(r){
  var t = { orders: r.orders.length, loaded: 0, bags: 0, loose: 0 };
  r.orders.forEach(function(o){ t.bags += o.bags; t.loose += o.loose; if (o.loaded) t.loaded++; });
  t.units = t.bags + t.loose; r.totals = t; return t;
}
function sealList(o, n){
  var a = String(o.seal || '').split(','), out = [];
  for (var k = 0; k < a.length; k++) out.push(a[k].replace(/^\s+|\s+$/g, ''));
  while (out.length < n) out.push('');
  return out;
}
function sealCount(o){ return Math.max(1, o.bags || 0); }
function sealJoin(a){
  var b = a.slice(); while (b.length && !b[b.length - 1]) b.pop();
  return b.join(', ');
}
function orderAt(i){ return state.route && state.route.orders[i]; }
function finished(){ return state.route && state.route.state === 'done'; }

/******************** ACTIONS ********************/
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-a'), i = Number(el.getAttribute('data-i'));
  if (a === 'login') return doLogin();
  if (a === 'logout') { logout(''); return; }
  if (a === 'map-open') return fmOpen();
  if (a === 'fm-saveall') return fmSaveAll();
  if (a === 'fm-discard') return fmDiscard();
  if (a === 'ai-save') return aiSave();
  if (a === 'fm-line') { fm.buf = ''; fm.line = Number(el.getAttribute('data-v')); fm.pos = fmList().length; render(); return; }
  if (a === 'fm-batch') { fm.batch = el.getAttribute('data-v'); fm.buf = ''; fm.line = 1; render(); return fmLoad(); }
  if (a === 'fm-cell') { fm.buf = ''; fm.pos = Number(el.getAttribute('data-v')); render(); return; }
  if (a === 'fm-del') { var di = Number(el.getAttribute('data-v')); fmList().splice(di, 1); fm.unsure = {}; fm.buf = ''; fm.pos = fmList().length; fmSave(); render(); return; }
  if (a === 'settings') { state.view = 'settings'; render(); window.scrollTo(0, 0); aiCheck(); return; }
  if (a === 'back-routes') { state.view = 'routes'; render(); return; }
  if (a === 'theme') { setTheme(el.getAttribute('data-v')); return; }
  if (a === 'refresh') return loadRoutes(false);
  if (a === 'shift') { state.date = shiftDay(state.routes ? state.routes.day : state.shown, Number(el.getAttribute('data-v'))); state.routes = null; loadRoutes(false); return; }
  if (a === 'now') { if (state.date) { state.date = ''; state.routes = null; loadRoutes(false); } return; }

  if (a === 'reload') return reloadRoute();

  if (a === 'stage-send') return stageSend(i);

  if (a === 'photo-del') return photoDel(i, Number(el.getAttribute('data-k')));
  if (a === 'vehicle') return vehicleOpen();
  if (a === 'veh-cancel') return vehicleClose();
  if (a === 'veh-save') return vehicleSave();
  if (a === 'fill') { state.filling = ''; return fillItems(); }
  if (a === 'mode') {
    state.mode = el.getAttribute('data-v');

  if (a === 'next') { goOrder(state.cur + 1); return; }
  if (a === 'toggle') { state.open[i] = !state.open[i]; redrawOrder(i); return; }
  if (a === 'item') return doItem(i, Number(el.getAttribute('data-k')));
  if (a === 'qty') return qtyOpen(i, Number(el.getAttribute('data-k')));

  if (a === 'qty-up') { if (qm.n < orderAt(qm.i).items[qm.k].q) qm.n++; return qtyDraw(); }
  if (a === 'qty-cancel') { document.getElementById('qm').style.display = 'none'; return; }
  if (a === 'qty-save') return qtySave();
  if (a === 'items-all') return doItemsAll(i);
  if (a === 'loaded') return doLoaded(i);
  if (a === 'unload') return doUnload(i);
  if (a === 'finish') return doFinish(false);
  if (a === 'reopen') return doReopen();
});

function fmMaxLine(){ var m = 14; for (var k in fm.lines) if (fm.lines[k] && fm.lines[k].length && Number(k) + 1 > m) m = Number(k) + 1; return Math.max(m, fm.line); }

function fmSave(){

function fmWhere(n, exceptLine, exceptPos){
  for (var k in fm.lines) { var l = fm.lines[k] || [];
    for (var i = 0; i < l.length; i++) if (l[i] === n && !(Number(k) === exceptLine && i === exceptPos)) return { line: Number(k), pos: i + 1 }; }

}
// Cells that need a second look: not 5 digits, repeated, or doubtful to the reader.
function fmBad(){

    for (var i = 0; i < l.length; i++) {
      var key = k + ':' + i;

      if (!/^\d{5}$/.test(l[i])) { if (fm.draft || l[i]) bad[key] = 1; continue; }
      if (seen[l[i]]) { bad[key] = 1; bad[seen[l[i]]] = 1; } else seen[l[i]] = key;

function fmScanFile(file){

    api('ldMapScan', { date: fm.day, batch: fm.batch, base64: data.split(',')[1], mime: 'image/jpeg' }).then(function(r){
      fm.scanning = false;
      if (!r || !r.success) { toast((r && r.error) || 'Could not read the sheet. Check your internet.'); return render(); }
      fm.orig = fm.lines; fm.lines = {}; fm.unsure = {};

function fmDiscard(){ fm.draft = false; fm.unsure = {}; fm.buf = ''; fm.lines = fm.orig || {}; fm.line = 1; fm.pos = fmList().length; render(); }
function fmSaveAll(){

    scan = '<div class="card" style="margin-top:12px;"><div style="font-weight:800;">Read ' + Object.keys(fm.lines).length + ' lines, ' + tl + ' orders</div>' +
      '<div class="note" style="margin:4px 0 10px;">' + (nb ? nb + ' cell(s) in red need a look: tap one and retype it. ' : 'Nothing doubtful. ') + 'Nothing is saved until you tap Save all.</div>' +

// CSV import: line,row,order or date,batch,line,position,order (a header row is fine). Whatever is in the
// file replaces the map of the chosen loading.
function fmImport(text){
  var byLine = {}, bad = 0, rows = 0;
  String(text || '').split(/\r?\n/).forEach(function(ln){
    var c = ln.split(/[,;\t]/).map(function(x){ return x.replace(/^[\s"']+|[\s"']+$/g, ''); });
    // line,row,order  or  date,batch,line,position,order
    var o = c.length >= 5 ? 2 : 0;
    if (c.length < 3 || !/^\d+$/.test(c[o])) return;      // header or blank
    var line = Number(c[o]), row = Number(c[o + 1]), n = (c[o + 2] || '').replace(/\D/g, '');
    if (!(line >= 1 && line <= 60) || !(row >= 1) || n.length !== 5) { bad++; return; }
    (byLine[line] = byLine[line] || []).push({ row: row, n: n }); rows++;
  });
  var lines = {}, seen = {}, dups = [];
  Object.keys(byLine).forEach(function(k){
    lines[k] = byLine[k].sort(function(a, b){ return a.row - b.row; }).map(function(x){
      if (seen[x.n]) dups.push(x.n); seen[x.n] = 1; return x.n; });
  });
  if (!rows) { toast('No orders found in that file. Each row needs: line, row, order.'); return; }
  var msg = rows + ' orders on ' + Object.keys(lines).length + ' lines for ' + (fm.batch === 'evening' ? 'Evening' : 'Night') + ' loading.' +
    (bad ? '\n' + bad + ' bad row(s) were skipped.' : '') + (dups.length ? '\nOn the sheet twice: ' + dups.slice(0, 8).join(', ') + '.' : '') +
    '\nReplace the current map with this?';
  if (!window.confirm(msg)) return;
  Object.keys(fm.lines).forEach(function(k){ if (!lines[k]) lines[k] = []; });
  fm.lines = lines; fm.line = 1; fm.pos = (lines[1] || []).length; fm.buf = '';
  Object.keys(lines).forEach(function(k){
    send('ldMapSave', { date: fm.day, batch: fm.batch, line: Number(k), orders: lines[k] }).then(function(r){
      if (!r || !r.success) toast((r && r.error) || 'Line ' + k + ' not saved.');
    });
  });
  render(); toast('Map imported.', true);
}

  var f = t.files && t.files[0]; t.value = '';

function fmKey(k){
  if (k === 'done') { fm.buf = ''; fm.pos = fmList().length; render(); return; }
  if (k === 'nl') { fm.buf = ''; fm.line++; fm.pos = fmList().length; render(); window.scrollTo(0, 0); return; }
  var list = fmList();
  if (k === 'back') {
    if (fm.buf) fm.buf = fm.buf.slice(0, -1);
    else if (fm.pos > 0) { fm.pos--; list.splice(fm.pos, 1); fm.unsure = {}; fmSave(); }
    return render();
  }
  if (fm.buf.length >= 5) return;
  fm.buf += k;
  if (fm.buf.length === 5) {
    var dup = fmWhere(fm.buf, fm.line, fm.pos);
    if (dup) { toast(fm.buf + ' is already on line ' + dup.line + ', row ' + dup.pos + '.'); fm.buf = ''; return render(); }
    delete fm.unsure[fm.line + ':' + fm.pos]; list[fm.pos] = fm.buf; fm.buf = ''; fm.pos = Math.min(fm.pos + 1, list.length);
    fmSave();
  }

}

// The phone's full keyboard never opens. Tapping Bags, Loose CTN or Seal

var kp = { i: -1, f: '', s: 0, dirty: false };
var KP_LABEL = { bags: 'Bags', loose: 'Loose cartons', seal: 'Seal tag' };

function kpValue(o, f, s){ return f === 'seal' ? sealList(o, sealCount(o))[s || 0] || '' : String(o[f] || ''); }

function kpOpen(i, f, s){
  if (finished()) return;

  kp.i = i; kp.f = f; kp.s = s || 0;
  kpShow();

// Save what was typed once, when he moves on.
function kpCommit(){
  touchCopy();

}
function kpClose(){
  kpCommit();

function redrawHeadOnly(){ sumUp(state.route); redrawHead(); }
function kpKey(k){
  var o = orderAt(kp.i); if (!o) return;

    var nf = kp.f, ns = kp.s;
    if (kp.f === 'bags') nf = 'loose';
    else if (kp.f === 'loose') { nf = 'seal'; ns = 0; }
    else if (kp.s + 1 < sealCount(o)) ns = kp.s + 1;

    var wasBags = kp.f === 'bags';

    if (wasBags) { redrawOrder(kp.i); }
    kp.f = nf; kp.s = ns; kpShow(); kpMark();

  else if (/^\d$/.test(k) && cur.length < max) cur += k;
  if (kp.f === 'seal') { var sl = sealList(o, sealCount(o)); sl[kp.s] = cur; o.seal = sealJoin(sl); }
  else o[kp.f] = n0(cur);

  var el2 = kpInput(); if (el2) el2.value = kp.f === 'seal' ? cur : (o[kp.f] || '');

      '<button class="btn ghost" data-a="veh-cancel">Cancel</button><button class="btn" id="vm-save" data-a="veh-save">Save</button></div></div>';
  m.style.display = '';
  var inp = document.getElementById('vm-in');
  setTimeout(function(){ try { inp.focus(); inp.select(); } catch (e) {} }, 50);
}
function vehicleClose(){ var m = document.getElementById('vm'); if (m) m.style.display = 'none'; }
function vehicleSave(){
  var inp = document.getElementById('vm-in'), err = document.getElementById('vm-err');
  var v = String(inp.value || '').toUpperCase().replace(/[\s.]+/g, '');
  if (!/^[A-Z0-9-]{3,15}$/.test(v)) { err.textContent = 'Letters and digits only, for example 5524 or DL1LAN9343.'; err.style.display = ''; return; }
  if (v === state.route.vehicle) { vehicleClose(); return; }
  var btn = document.getElementById('vm-save'); btn.disabled = true; btn.textContent = 'Saving…';
  send('ldVehicle', { date: state.shown, code: state.code, vehicle: v, light: true }).then(function(r){
    if (r && r.success) {
      state.route.vehicle = r.vehicle || v;
      state.route.vehicleChanged = !!(state.route.vehiclePlanned && state.route.vehicle !== state.route.vehiclePlanned);
      vehicleClose(); redrawHead(); touchCopy();
      if (state.route.state === 'new') state.route.state = 'loading';
      toast('Vehicle set to ' + state.route.vehicle, true);
    } else { btn.disabled = false; btn.textContent = 'Save'; err.textContent = (r && r.error) || 'Not saved. Check your internet.'; err.style.display = ''; }
  });
}

/******************** PHOTOS ********************/
// Same size and quality as the DA app's proof photos.
function shrinkPhoto(file, cb, edge, q){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxEdge = edge || 1000, w = img.width, h = img.height;
      if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
      else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      var out = c.toDataURL('image/jpeg', q || 0.6); c.width = 1; c.height = 1;
      cb(out);
    };
    img.onerror = function(){ cb(''); };
    img.src = rd.result;
  };
  rd.onerror = function(){ cb(''); };
  rd.readAsDataURL(file);
}
// Photos are kept on the phone first. The loader takes one or two, looks
// at them, then taps Submit; only then do they go to the sheet.
function stageRoom(o){ return 4 - (o.photos || []).length - (o.staged || []).length; }
document.addEventListener('change', function(ev){
  var sc = ev.target; if (sc && sc.id === 'fm-scan') { var f0 = sc.files && sc.files[0]; sc.value = ''; return fmScanFile(f0); }
  var t = ev.target; if (!t || !t.getAttribute || t.getAttribute('data-photo') === null) return;
  var i = Number(t.getAttribute('data-photo')), o = orderAt(i), fs = [];
  for (var n = 0; t.files && n < t.files.length; n++) fs.push(t.files[n]);
  t.value = '';
  if (!o || !fs.length || finished()) return;
  if (fs.length > stageRoom(o)) { toast('Up to 4 photos for one order.'); fs = fs.slice(0, Math.max(0, stageRoom(o))); }
  fs.forEach(function(f){
    shrinkPhoto(f, function(data){
      if (!data) { toast('Could not read that photo. Try again.'); return; }
      if (stageRoom(o) < 1) return;
      (o.staged = o.staged || []).push({ thumb: data }); redrawOrder(i);
    });
  });
});
function camOK(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
var cam = { stream: null, el: null, i: -1 };
function camOpen(i){
  var o = orderAt(i); if (cam.el || !o || stageRoom(o) < 1 || finished()) return;
  kpClose();
  cam.i = i;
  var el = document.createElement('div'); el.id = 'cam'; el.className = 'cam';
  el.innerHTML = '<video id="cam-v" autoplay playsinline muted></video><div class="cam-msg" id="cam-msg">Starting camera…</div>' +
    '<div class="cam-bar"><button type="button" class="cam-done" id="cam-done">Done</button>' +
    '<button type="button" class="cam-shoot" id="cam-shoot" aria-label="Take photo"></button><span class="cam-n" id="cam-n"></span></div>';
  document.body.appendChild(el); cam.el = el; camCount();
  document.getElementById('cam-done').addEventListener('click', function(){ camClose(); });
  document.getElementById('cam-shoot').addEventListener('click', camShoot);
  navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } } }).then(function(s){
    if (!cam.el) { s.getTracks().forEach(function(t){ t.stop(); }); return; }
    cam.stream = s; var v = document.getElementById('cam-v'); v.srcObject = s;
    var pl = v.play && v.play(); if (pl && pl.catch) pl.catch(function(){});
    document.getElementById('cam-msg').textContent = '';
  }).catch(function(){
    camClose(); toast('The camera could not start. Allow the camera for this app and try again.');
  });
}
function camCount(){
  var o = orderAt(cam.i), n = document.getElementById('cam-n');
  if (n && o) n.textContent = ((o.staged || []).length + (o.photos || []).length) + ' / 4';
}
function camShoot(){
  var v = document.getElementById('cam-v'), o = orderAt(cam.i);
  if (!cam.stream || !v || !v.videoWidth || !o) return;
  if (stageRoom(o) < 1) return camClose();
  var maxEdge = 1000, w = v.videoWidth, h = v.videoHeight;
  if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
  else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(v, 0, 0, w, h);
  (o.staged = o.staged || []).push({ thumb: c.toDataURL('image/jpeg', 0.6) }); c.width = 1; c.height = 1;
  camCount();
  cam.el.classList.add('flash'); setTimeout(function(){ if (cam.el) cam.el.classList.remove('flash'); }, 150);
  if (stageRoom(o) < 1) camClose();
}
function camClose(){
  if (cam.stream) { cam.stream.getTracks().forEach(function(t){ t.stop(); }); cam.stream = null; }
  if (cam.el && cam.el.parentNode) cam.el.parentNode.removeChild(cam.el);
  cam.el = null;
  if (cam.i >= 0 && orderAt(cam.i)) redrawOrder(cam.i);
  cam.i = -1;
}
function stageSend(i){
  var o = orderAt(i); if (!o || !o.staged || !o.staged.length) return;
  var list = o.staged; o.staged = [];
  list.forEach(function(s){
    var p = { link: '', thumb: s.thumb, uploading: true, failed: false };
    o.photos.push(p); uploadPhoto(o, p, i, 1);
  });
  redrawOrder(i);
}
function uploadPhoto(o, p, i, tries){
  api('ldPhoto', { date: state.shown, code: state.code, invoiceNo: o.invoiceNo, base64: p.thumb.split(',')[1], mime: 'image/jpeg' }).then(function(r){
    if (r && r.success) { p.link = r.link; p.uploading = false; }
    else if (tries < 2 && (!r || r.offline)) { setTimeout(function(){ uploadPhoto(o, p, i, tries + 1); }, 2500); return; }
    else { p.uploading = false; p.failed = true; toast((r && r.error) || 'Photo not saved. Check your internet.'); }
    var idx = state.route ? state.route.orders.indexOf(o) : -1;
    if (idx > -1) redrawOrder(idx);
    touchCopy();
  });
}
function photoDel(i, k){
  var o = orderAt(i), p = o && o.photos[k]; if (!p) return;
  o.photos.splice(k, 1); redrawOrder(i);
  if (p.link) send('ldPhotoDel', { date: state.shown, code: state.code, invoiceNo: o.invoiceNo, link: p.link }).then(function(r){
    if (!r || !r.success) { toast((r && r.error) || 'Not removed. Check your internet.'); reloadRoute(); }
  });
}

function goOrder(i){
  if (i < 0 || i >= state.route.orders.length) return;
  state.cur = i; render(); window.scrollTo(0, 0);
}
// After Loaded in one-by-one view, on to the next order not yet loaded.
function advanceFrom(i){
  var os = state.route.orders, n = os.length;
  for (var k = 1; k <= n; k++) { var j = (i + k) % n; if (!os[j].loaded) { goOrder(j); return; } }
  render();
}

function doLoaded(i){
  kpClose();
  var o = orderAt(i);
  if (o.bags + o.loose < 1) { toast('Enter the bags or loose cartons first.'); return; }
  var filled = sealList(o, sealCount(o)).filter(function(x){ return x; }).length;
  if (o.bags > 0 && filled < o.bags && !window.confirm('Only ' + filled + ' of ' + o.bags + ' seal tags entered. Mark the order Loaded anyway?')) return;
  if (o.items && o.itemsDone < o.itemsTotal &&
      !window.confirm((o.itemsTotal - o.itemsDone) + ' item(s) are not ticked. Mark the order Loaded anyway?')) return;
  o.loaded = true; o.loadedAt = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  sumUp(state.route);
  if (state.mode === 'one') advanceFrom(i); else { redrawOrder(i); redrawHead(); }
  saveCounts(i, true).then(function(ok){
    if (!ok) { o.loaded = false; o.loadedAt = ''; sumUp(state.route); if (state.mode === 'one') { state.cur = i; render(); } else { redrawOrder(i); redrawHead(); } }
  });
}
function doUnload(i){
  var o = orderAt(i);
  o.loaded = false; o.loadedAt = '';
  sumUp(state.route); redrawOrder(i); redrawHead();
  saveCounts(i, false).then(function(ok){ if (!ok) { o.loaded = true; sumUp(state.route); redrawOrder(i); redrawHead(); } });
}

function doItem(i, k){
  var o = orderAt(i), it = o.items[k], on = !it.d;
  it.d = on; o.itemsDone += on ? 1 : -1;
  if (!on) delete it.lq;
  redrawOrder(i);
  send('ldItem', { date: state.shown, code: state.code, invoiceNo: o.invoiceNo, idx: k, done: on, light: true }).then(function(r){
    if (!r || !r.success) { toast((r && r.error) || 'Not saved. Check your internet.'); if (r && !r.offline) reloadRoute(); }
  });
}
var qm = { i: -1, k: -1, n: 0 };
function qtyOpen(i, k){
  var o = orderAt(i), it = o.items[k];
  qm = { i: i, k: k, n: it.lq !== undefined ? it.lq : it.q };
  var m = document.getElementById('qm');
  if (!m) { m = document.createElement('div'); m.id = 'qm'; document.body.appendChild(m); }
  m.className = 'modal'; m.style.display = '';
  qtyDraw();
}
function qtyDraw(){
  var it = orderAt(qm.i).items[qm.k], m = document.getElementById('qm');
  m.innerHTML = '<div class="box"><div style="font-weight:800; font-size:17px;">' + esc(it.p) + '</div>' +
    '<div class="note" style="margin-top:4px;">Ordered ' + it.q + '. How many were loaded?</div>' +
    '<div class="qs"><button data-a="qty-dn">−</button><b>' + qm.n + '</b><button data-a="qty-up">+</button></div>' +
    '<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">' +
    '<button class="btn ghost" data-a="qty-cancel">Cancel</button><button class="btn" data-a="qty-save">Save</button></div></div>';
}
function qtySave(){
  var o = orderAt(qm.i), it = o.items[qm.k], q = qm.n;
  document.getElementById('qm').style.display = 'none';
  if (!it.d) { it.d = true; o.itemsDone++; }
  if (q >= it.q) delete it.lq; else it.lq = q;
  o.short = o.items.filter(function(x){ return x.lq !== undefined; }).length;
  redrawOrder(qm.i);
  send('ldItem', { date: state.shown, code: state.code, invoiceNo: o.invoiceNo, idx: qm.k, done: true, qty: q, light: true }).then(function(r){
    if (!r || !r.success) { toast((r && r.error) || 'Not saved. Check your internet.'); if (r && !r.offline) reloadRoute(); }
  });
}
function doItemsAll(i){
  var o = orderAt(i), on = o.itemsDone < o.itemsTotal;
  o.items.forEach(function(x){ x.d = on; if (!on) delete x.lq; }); o.itemsDone = on ? o.itemsTotal : 0;
  redrawOrder(i);
  send('ldItem', { date: state.shown, code: state.code, invoiceNo: o.invoiceNo, idx: 'all', done: on, light: true }).then(function(r){
    if (!r || !r.success) { toast((r && r.error) || 'Not saved. Check your internet.'); if (r && !r.offline) reloadRoute(); }
  });
}

function doFinish(force){
  kpClose();
  var t = state.route.totals;
  if (!force && t.loaded < t.orders &&
      !window.confirm((t.orders - t.loaded) + ' order(s) are not marked Loaded. Finish loading anyway?')) return;
  if (!force && t.loaded === t.orders && !window.confirm('Finish loading ' + state.code + '? ' + t.bags + ' bags and ' + t.loose + ' loose cartons.')) return;
  send('ldFinish', { date: state.shown, code: state.code, force: true }).then(function(r){
    if (r && r.success) { state.route = r; state.error = ''; render(); window.scrollTo(0, 0); }
    else toast((r && r.error) || 'Could not finish the route.');
  });
}
function doReopen(){
  if (!window.confirm('Reopen ' + state.code + ' so orders can be changed?')) return;
  send('ldReopen', { date: state.shown, code: state.code }).then(function(r){
    if (r && r.success) { state.route = r; render(); }
    else toast((r && r.error) || 'Could not reopen the route.');
  });
}

function doLogin(){
  var n = ((document.getElementById('lg-name') || {}).value || '').trim();
  var p = (document.getElementById('lg-pin') || {}).value || '';
  state.loginName = n;
  if (!n || !p) { state.error = 'Enter your login name and PIN.'; render(); return; }
  state.busy = true; state.error = ''; render();
  api('ldLogin', { loginName: n, pin: p }).then(function(r){
    state.busy = false;
    if (r && r.success) {
      state.token = r.token; state.name = r.name; state.loginName = n;
      saveSession(); state.view = 'routes'; loadRoutes(false);
    } else { state.error = (r && r.error) || 'Could not sign in.'; render(); }
  });
}

/******************** START ********************/
(function(){
  var s = store(), saved = null;
  try { saved = s && JSON.parse(s.getItem('bm_ld') || 'null'); } catch (e) {}
  if (saved && saved.token) {
    state.token = saved.token; state.name = saved.name; state.loginName = saved.loginName || '';
    state.view = 'routes'; loadRoutes(false);
  } else render();
})();
</script>
<script>
/* PHOTO-POPUP: photo links open in a big popup inside the app, not another app. */
(function(){
  var box = null, hist = false;
  function fileId(u){ var m = String(u || '').match(/[-\w]{25,}/); return m ? m[0] : ''; }
  function isPhotoLink(a){
    var h = a.getAttribute('href') || '';
    if (!/drive\.google\.com|googleusercontent\.com/i.test(h)) return false;
    if (/\/maps|wa\.me|whatsapp/i.test(h)) return false;
    var txt = (a.textContent || '').toLowerCase();
    if (/pdf|manifest|sheet|doc\b/.test(txt)) return false;
    return !!a.querySelector('img') || /photo|view|screenshot|image|proof|signature|pod/.test(txt);
  }
  function close(fromPop){
    if (!box) return;
    box.remove(); box = null;
    if (hist && !fromPop) { hist = false; try { history.back(); } catch (e) {} }
    hist = false;
  }
  function open(href){
    var id = fileId(href); if (!id) return false;
    close(true);
    box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;');
    box.innerHTML =
      '<div style="position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;align-items:center;">' +
        '<a href="' + href.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener" data-lb-skip="1" style="color:#fff;font:600 13px system-ui;text-decoration:underline;opacity:.85;">Open original</a>' +
        '<button type="button" id="lb-x" style="background:#fff;color:#000;border:0;border-radius:20px;width:38px;height:38px;font:700 20px system-ui;cursor:pointer;">×</button>' +
      '</div>' +
      '<img alt="" style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;touch-action:pinch-zoom;" ' +
        'src="https://drive.google.com/thumbnail?id=' + id + '&sz=w1600">' +
      '<div id="lb-msg" style="color:#fff;font:13px system-ui;margin-top:10px;opacity:.8;">Tap outside the photo to close</div>';
    var img = box.querySelector('img');
    img.onerror = function(){ img.style.display = 'none'; box.querySelector('#lb-msg').textContent = 'Could not load the photo here. Use Open original.'; };
    box.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('[data-lb-skip]')) return;
      if (e.target === img) return;
      close();
    });
    document.body.appendChild(box);
    try { history.pushState({ lb: 1 }, ''); hist = true; } catch (e) {}
    return true;
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.hasAttribute('data-lb-skip') || !isPhotoLink(a)) return;
    if (open(a.getAttribute('href'))) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener('popstate', function(){ if (box) close(true); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
})();
</script>
<script>
// Keeps the app on the phone. Registered after load so it never
// slows the first screen down.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
