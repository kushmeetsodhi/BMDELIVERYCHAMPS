<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BM Supervisor</title>
<script src="config.js?v=a4b7ad8e7a"></script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  :root{
    --brand:#000066; --brand-ink:#FFFFFF;
    --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F8F9FC;
    --ink:#14142B; --ink-soft:#5A6072; --ink-faint:#8B91A3; --border:#E2E5EC;
    --green:#1E7F45; --green-bg:#E4F4EA;
    --red:#C13535; --red-bg:#FBE8E8;
    --amber:#B57614; --amber-bg:#FCF0D8;
    --blue:#2C5A99; --blue-bg:#E4ECF6;
    --grey-bg:#EDEFF3;
    --shadow:0 1px 2px rgba(20,20,43,0.06), 0 1px 3px rgba(20,20,43,0.04);
    --tabbar:62px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#20233F; --bg:#0E1017; --surface:#171A23; --surface-2:#12141C;
      --ink:#ECEEF4; --ink-soft:#98A0B3; --ink-faint:#6B7286; --border:#262B38;
      --green:#4ADE80; --green-bg:#16301F;
      --red:#F87171; --red-bg:#331A1A;
      --amber:#FBBF24; --amber-bg:#332A14;
      --blue:#7FA6E6; --blue-bg:#1A2436;
      --grey-bg:#222634; --shadow:0 1px 3px rgba(0,0,0,0.35);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px;
    padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));
  }

  /* ---------- login ---------- */
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; }
  .login-box{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px 22px; box-shadow:var(--shadow);
  }
  .login-box h1{ margin:0 0 4px; font-size:21px; }
  .login-box p{ margin:0 0 22px; color:var(--ink-soft); font-size:13.5px; }

  /* ---------- chrome ---------- */
  .top{
    position:sticky; top:0; z-index:20; background:var(--brand); color:var(--brand-ink);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .top h1{ margin:0; font-size:17px; font-weight:700; flex:1; }
  .top .sub{ font-size:11.5px; opacity:0.72; margin-top:2px; font-weight:400; }
  .top button{
    background:rgba(255,255,255,0.16); color:#fff; border:0; border-radius:8px;
    padding:7px 11px; font-size:12.5px; font-weight:600;
  }
  .back{
    background:rgba(255,255,255,0.12); color:#fff; border:0; border-radius:8px;
    width:32px; height:32px; font-size:17px; line-height:1;
  }
  .page{ padding:14px 14px 20px; }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    height:calc(var(--tabbar) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface); border-top:1px solid var(--border);
    display:flex;
  }
  .tabbar div{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; font-size:10.5px; color:var(--ink-faint); font-weight:600; position:relative;
  }
  .tabbar div.on{ color:var(--brand); }
  html[data-theme="dark"] .tabbar div.on, :root:not([data-theme="light"]) .tabbar div.on{ color:var(--ink); }
  .tabbar .ic{ font-size:19px; line-height:1; }
  .tabbar .dot{
    position:absolute; top:6px; right:50%; margin-right:-20px;
    background:var(--red); color:#fff; font-size:9.5px; font-weight:800;
    min-width:16px; height:16px; border-radius:9px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- bits ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .card.tap:active{ background:var(--surface-2); }
  .sec{ font-size:11.5px; font-weight:700; letter-spacing:0.055em; text-transform:uppercase;
        color:var(--ink-faint); margin:18px 2px 8px; }
  .sec:first-child{ margin-top:2px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row .grow{ flex:1; min-width:0; }
  .ttl{ font-weight:650; font-size:15px; }
  .mut{ color:var(--ink-soft); font-size:12.5px; }
  .fnt{ color:var(--ink-faint); font-size:11.5px; }
  .trunc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty{ text-align:center; padding:34px 16px; color:var(--ink-faint); font-size:13.5px; }
  .err{ background:var(--red-bg); color:var(--red); border-radius:10px; padding:11px 13px;
        font-size:13px; margin-bottom:10px; }
  .ok{ background:var(--green-bg); color:var(--green); border-radius:10px; padding:11px 13px;
       font-size:13px; margin-bottom:10px; }
  .spin{ text-align:center; padding:40px; color:var(--ink-faint); font-size:13.5px; }

  /* ---------- loading ---------- */
  /* The same loader as the control room, sized for a phone and sitting
     above the tab bar rather than over it. */
  .ldbox{ position:fixed; left:12px; right:12px; bottom:calc(var(--tabbar) + 12px);
          z-index:55; display:grid; gap:7px; pointer-events:none; }
  .ld{ background:var(--surface); border:1px solid var(--border); border-radius:11px;
       padding:9px 12px 11px; box-shadow:0 10px 26px -12px rgba(20,20,43,0.45);
       transition:opacity .35s, transform .35s; animation:ldIn .25s ease-out; }
  .ld.out{ opacity:0; transform:translateY(8px); }
  @keyframes ldIn{ from{ opacity:0; transform:translateY(8px); } }
  .ld .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px;
    /* Not the page header, which shares the class name. */
    position:static; background:none; color:inherit; padding:0; z-index:auto; }
  .ld .top b{ font-weight:600; color:var(--ink); }
  .ld .top span{ color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ld .top em{ font-weight:700; font-size:14px; font-style:normal; color:var(--ink); margin-right:5px; }
  .ld .trk{ height:5px; border-radius:3px; background:var(--grey-bg); margin-top:7px; overflow:hidden; }
  .ld .fill{ height:100%; border-radius:3px; background:var(--brand); width:0;
             transition:width .2s linear; position:relative; overflow:hidden; }
  .ld .fill::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform:translateX(-100%); animation:ldShine 1.2s infinite; }
  .ld.done .fill{ background:var(--green); } .ld.done .fill::after{ display:none; }
  .ld .sub{ color:var(--ink-faint); font-size:11.5px; margin-top:5px; min-height:15px; }
  @keyframes ldShine{ to{ transform:translateX(100%); } }

  .boot{ position:fixed; inset:0; z-index:70; background:var(--bg);
         display:flex; align-items:center; justify-content:center; padding:18px; }
  .boot .card{ width:100%; max-width:380px; background:var(--surface);
    border:1px solid var(--border); border-radius:15px; padding:22px 22px 18px;
    box-shadow:0 16px 40px -22px rgba(20,20,43,0.4); }
  .boot h2{ font-size:18px; margin:0 0 4px; color:var(--ink); }
  .boot .bsub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 18px; }
  .boot .big{ display:flex; align-items:baseline; justify-content:space-between; }
  .boot .big b{ font-size:38px; line-height:1; letter-spacing:-0.03em;
                font-variant-numeric:tabular-nums; color:var(--ink); }
  .boot .big span{ color:var(--ink-faint); font-size:13px; font-variant-numeric:tabular-nums; }
  .boot .trk{ height:7px; border-radius:4px; background:var(--grey-bg); margin:12px 0 17px; overflow:hidden; }
  .boot .fill{ height:100%; width:2%; border-radius:4px; background:var(--brand);
               transition:width .2s linear; position:relative; overflow:hidden; }
  .boot .fill::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform:translateX(-100%); animation:ldShine 1.2s infinite; }
  .boot ol{ list-style:none; margin:0; padding:0; display:grid; gap:9px; font-size:13.5px; }
  .boot li{ display:flex; align-items:center; gap:9px; color:var(--ink-faint); }
  .boot li i{ width:17px; height:17px; border-radius:50%; border:2px solid var(--border);
              flex:none; font-style:normal; }
  .boot li.now{ color:var(--ink); }
  .boot li.now i{ border-color:var(--brand); border-top-color:transparent; animation:spin .8s linear infinite; }
  .boot li.ok{ color:var(--ink-soft); } .boot li.ok i{ background:var(--green); border-color:var(--green); }
  .boot li.bad{ color:var(--red); } .boot li.bad i{ background:var(--red); border-color:var(--red); }
  .boot li small{ margin-left:auto; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .boot .note{ margin-top:16px; color:var(--ink-faint); font-size:11.5px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  [hidden]{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .ld, .ld .fill::after, .boot .fill::after, .boot li.now i{ animation:none !important; }
    .ld, .ld .fill, .boot .fill{ transition:none !important; }
  }


  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-weight:700; white-space:nowrap;
  }
  .b-ok{ background:var(--green-bg); color:var(--green); }
  .b-bad{ background:var(--red-bg); color:var(--red); }
  .b-warn{ background:var(--amber-bg); color:var(--amber); }
  .b-blue{ background:var(--blue-bg); color:var(--blue); }
  .b-grey{ background:var(--grey-bg); color:var(--ink-soft); }

  .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:4px; }
  .st{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 12px; box-shadow:var(--shadow);
  }
  .st.tap:active{ background:var(--surface-2); }
  .st .l{ font-size:11px; color:var(--ink-faint); font-weight:650; text-transform:uppercase;
          letter-spacing:0.04em; }
  .st .v{ font-size:23px; font-weight:750; margin-top:3px; line-height:1.1; }
  .st .s{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  .st.bad .v{ color:var(--red); }
  .st.warn .v{ color:var(--amber); }
  .st.good .v{ color:var(--green); }

  .alert{ border-left:4px solid var(--border); }
  .alert.lv-alert{ border-left-color:var(--red); background:var(--red-bg); }
  .alert.lv-warn{ border-left-color:var(--amber); background:var(--amber-bg); }
  .idle{ font-size:21px; font-weight:800; line-height:1; }
  .alert.lv-alert .idle{ color:var(--red); }
  .alert.lv-warn .idle{ color:var(--amber); }

  .bar{ height:6px; background:var(--grey-bg); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar i{ display:block; height:100%; background:var(--green); }
  .bar i.part{ background:var(--amber); }

  .btn{
    background:var(--brand); color:var(--brand-ink); border:0; border-radius:10px;
    padding:11px 15px; font-size:14px; font-weight:650; font-family:inherit;
  }
  html[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn{ background:#3B4BAE; color:#fff; }
  .btn:active{ opacity:0.85; }
  .btn.block{ display:block; width:100%; }
  .btn.sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--border); }
  .btn.red{ background:var(--red); color:#fff; }
  .btn[disabled]{ opacity:0.5; }
  .call{
    display:inline-flex; align-items:center; gap:5px; text-decoration:none;
    background:var(--green-bg); color:var(--green); border-radius:8px;
    padding:7px 11px; font-size:12.5px; font-weight:700;
  }
  .link{ color:var(--blue); text-decoration:none; font-size:12.5px; font-weight:650; }

  label.f{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-faint);
           text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 5px; }
  input,select,textarea{
    font-family:inherit; font-size:16px; padding:11px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink); width:100%;
  }
  textarea{ min-height:84px; resize:vertical; }
  .chips{ display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; }
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:650;
    background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);
  }
  .chip.on{ background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  html[data-theme="dark"] .chip.on, :root:not([data-theme="light"]) .chip.on{ background:#3B4BAE; border-color:#3B4BAE; color:#fff; }
  .thumb{ width:52px; height:52px; border-radius:9px; object-fit:cover; border:1px solid var(--border);
          background:var(--grey-bg); flex:0 0 auto; }
  .dk-q{ font-size:22px !important; letter-spacing:0.08em; font-weight:700; }
  .dk-types{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .dk-type{ padding:14px 6px; border-radius:11px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13.5px; font-weight:650; font-family:inherit; }
  .dk-type.on{ border-color:currentColor; }
  .dk-item{ padding:8px 0; border-bottom:1px solid var(--border); }
  .dk-item:last-child{ border-bottom:none; }
  .dk-n{ width:74px !important; text-align:center; font-size:17px !important; }
  .dk-shots{ display:flex; flex-wrap:wrap; gap:8px; }
  .dk-shot{ position:relative; width:76px; height:76px; }
  .dk-shot img{ width:76px; height:76px; object-fit:cover; border-radius:9px; border:1px solid var(--border); }
  .dk-x{ position:absolute; top:-7px; right:-7px; width:23px; height:23px; border-radius:50%; border:none;
    background:var(--red); color:#fff; font-size:15px; line-height:1; }
  .dk-up{ position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.6); color:#fff; border-radius:6px;
    font-size:12px; padding:0 5px; }
  .dk-up.bad{ background:var(--red); }
  .dk-job{ border-left:4px solid #3C4FD0; }
  .dk-types.four{ grid-template-columns:1fr 1fr; }
  .dk-place{ border-radius:12px; padding:14px 15px; margin-top:12px; border:2px solid; }
  .dk-place.rd{ background:var(--blue-bg); color:var(--blue); border-color:var(--blue); }
  .dk-place.cx{ background:var(--red-bg); color:var(--red); border-color:var(--red); }
  .dk-place.pend{ background:var(--amber-bg); color:var(--amber); border-color:var(--amber); }
  .dk-place-h{ font-size:20px; font-weight:800; letter-spacing:.2px; }
  .dk-place-s{ font-size:13px; margin-top:4px; font-weight:600; }
  .dk-place-w{ font-size:12px; margin-top:6px; opacity:.85; }
  .dk-link{ background:none; border:none; color:var(--brand); font-size:13px; font-weight:600;
    padding:10px 0 0; text-decoration:underline; font-family:inherit; cursor:pointer; }
  html[data-theme="dark"] .dk-link{ color:#9AA6FF; }
  .dk-xrow{ width:30px; height:30px; border-radius:50%; border:none; background:var(--red-bg); color:var(--red);
    font-size:17px; line-height:1; flex:none; }
  .dk-job.bad{ border-left-color:var(--red); background:var(--red-bg); }
  .dk-add{ width:76px; height:76px; border-radius:9px; border:1.5px dashed var(--border); background:var(--surface-2);
    color:var(--ink-soft); font-size:11.5px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; font-family:inherit; cursor:pointer; }
  .scam{ position:fixed; inset:0; z-index:9999; background:#000; display:flex; flex-direction:column; }
  .scam video{ flex:1; width:100%; min-height:0; object-fit:cover; }
  .scam.flash video{ opacity:.35; }
  .scam-bar{ display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px calc(18px + env(safe-area-inset-bottom)); }
  #scam-shoot{ width:72px; height:72px; border-radius:50%; border:5px solid #fff; background:#fff;
    box-shadow:inset 0 0 0 3px #000; }
  #scam-done{ background:none; border:1.5px solid #fff; color:#fff; border-radius:9px; padding:10px 16px;
    font-size:15px; min-width:72px; font-family:inherit; }
  #scam-n{ color:#fff; min-width:72px; text-align:right; }
  .thumb.noimg{ display:flex; align-items:center; justify-content:center; font-size:20px; opacity:0.5; }
  .pick{ width:20px; height:20px; }
  .seq{
    width:26px; height:26px; border-radius:7px; background:var(--grey-bg); color:var(--ink-soft);
    font-size:12px; font-weight:750; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .fd{ border-radius:12px; padding:13px 15px; margin-bottom:14px; border:2px solid; }
  .fd .fd-h{ font-weight:700; font-size:16px; }
  .fd .fd-l{ margin-top:4px; }
  .fd .fd-w{ margin-top:4px; font-size:12.5px; opacity:.85; }
  .fd .fd-area{ margin-top:6px; font-weight:600; font-size:13px; }
  .fd.rd{ background:var(--blue-bg); color:var(--blue); border-color:var(--blue); }
  .fd.cx{ background:var(--red-bg); color:var(--red); border-color:var(--red); }
  .fd.pend{ background:var(--amber-bg); color:var(--amber); border-color:var(--amber); }
  .fd.done{ background:var(--green-bg); color:var(--green); border-color:var(--green); }
</style>
</head>
<body>
<div id="app"><div class="spin">Loading&#8230;</div></div>
<div class="ldbox" id="ldbox" aria-live="polite"></div>
<div class="boot" id="boot" role="status" aria-live="polite" hidden>
  <div class="card">
    <h2>Opening your screen</h2>
    <p class="bsub">Reading today&#8217;s routes and failures.</p>
    <div class="big"><b id="bootPct">0%</b><span id="bootTime">0.0 s</span></div>
    <div class="trk"><div class="fill" id="bootFill"></div></div>
    <ol id="bootSteps"></ol>
    <p class="note" id="bootNote">The % is estimated from how long it took last time.</p>
  </div>
</div>

<script>
/********************************************************************
 * BM SUPERVISOR - mobile
 * Served from the Control Room project at ?app=supervisor. Built around
 * two questions: which deliveries failed, and which DA has stopped
 * moving. Carries no cash figures of any kind - the server strips them
 * for this role, and nothing here asks for them.
 ********************************************************************/
var state = {
  loadedAt: {},
  savedAt: {},
  token:'', name:'', roles:[],
  view:'home', date:'', loading:false, error:'', note:'',
  data:{},
  routeCode:null, routeData:null,
  failFilter:'',
  query:'', lookup:null,
  // Line items for the order on screen: loaded on tap, kept per order
  // so flicking back and forth does not refetch.
  items:{}, itemsFor:'', itemsLoading:false, itemsErr:'',
  flSel:{}, flMsg:'', flErr:'',
  qkText:'', qkOrders:null, qkSel:{}, qkMsg:'', qkErr:'',
  prodCode:'', prodQuery:'', prodData:null, prodErr:'',
  dk:{ q:'', data:null, type:'', qty:{}, note:'', photos:[], saving:false, list:null, pdfBusy:false, pdfLink:'',
       mode:'so', extra:[{ name:'', qty:'' }] },
  // Marks saved on this phone but not yet on the server: they wait for
  // their photos, then go, while the supervisor gets on with the next.
  dkQueue:[]
};

var TABS = [
  { id:'home',    label:'Alerts',   ic:'⚠' },
  { id:'fails',   label:'Failed',   ic:'✖' },
  { id:'routes',  label:'Routes',   ic:'\u{1F69B}' },
  { id:'lookup',  label:'Lookup',   ic:'\u{1F50D}' },
  { id:'product', label:'Product',  ic:'\u{1F6D2}' },
  { id:'floor',   label:'Floor',    ic:'\u{1F4E6}' },
  { id:'desk',    label:'Returns',  ic:'\u21A9' }
];

/******************** UTIL ********************/
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function today(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function cleanName(s){ return String(s == null ? '' : s).replace(/\s*\([^)]*\)\s*$/, '').trim(); }

// 135 -> "2h 15m". Minutes alone stop being readable past an hour, and
// an hour is exactly where these numbers start to matter.
function mins(n){
  var m = Math.max(0, Math.round(Number(n) || 0));
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60);
  return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
}
function badge(t, c){ return '<span class="badge ' + (c || statusCls(t)) + '">' + esc(t) + '</span>'; }
function statusCls(st){
  var s = String(st || '').toLowerCase();
  if (s === 'delivered' || s === 'trip ended') return 'b-ok';
  if (s === 'not delivered' || s === 'absent') return 'b-bad';
  if (s === 'on route' || s === 'pending') return 'b-warn';
  if (s === 'left at warehouse' || s === 'moved to another vehicle') return 'b-warn';
  if (s === 'logged in, no route') return 'b-blue';
  return 'b-grey';
}
// Drive hands back a .../file/d/ID/view link, which is a web page and
// never renders in an <img>. The thumbnail endpoint does, for any file
// the viewer can open - so the photo shows and the link still opens the
// full-size original.
function thumbUrl(url, size){
  var m = String(url || '').match(/[-\w]{25,}/);
  if (!m) return '';
  return 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w' + (size || 220);
}

// If Drive refuses the thumbnail, fall back to the camera glyph rather
// than leaving a broken-image box on the card.
function photoThumb(url){
  var t = thumbUrl(url, 220);
  if (!t) return '';
  return '<img class="thumb" src="' + esc(t) + '" alt="" loading="lazy" ' +
    'onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement(\'span\'),' +
    '{className:\'thumb noimg\',textContent:\'\\uD83D\\uDCF7\'}))" />';
}

function callBtn(phone, label){
  var p = String(phone || '').replace(/[^\d+]/g, '');
  if (!p) return '';
  return '<a class="call" href="tel:' + esc(p) + '">☎ ' + esc(label || 'Call') + '</a>';
}
function progressBar(done, total){
  if (!total) return '';
  return '<div class="bar"><i class="' + (done < total ? 'part' : '') + '" style="width:' + pct(done,total) + '%"></i></div>';
}

/******************** LOADING PROGRESS ********************/
/**
 * Ported from the sales-mix dashboard.
 *
 * The honest part is the estimate: each action's typical duration is
 * remembered in this browser and blended as it changes, so the bar is
 * calibrated to this person's own connection rather than a guess
 * baked in here. The percentage eases towards 97% and only reaches
 * 100% when the data actually arrives - a bar that parks at 60% tells
 * the reader less than no bar at all.
 */
var LD = {};
var LD_LABEL = {
  getSupHome:'Alerts', getSupFailures:'Failed deliveries', getSupRoutes:'Routes',
  getRouteDetail:'Route', trackOrder:'Order lookup', getFloor:'Left on floor',
  getDaTracker:'DA tracker', getInvoiceItems:'Bill items',
  findProduct:'Product search', quickPreview:'Finding orders',
  quickCreate:'Making the route', floorLog:'Logging on floor',
  floorSend:'Sending out', getDrill:'List',
  deskLookup:'Finding the order', deskPhoto:'Uploading photo', deskMark:'Saving',
  deskList:'Today\u2019s returns', deskUndo:'Undoing', deskPdf:'Making the PDF'
};
function ldLabel(action){ return LD_LABEL[action] || 'Working'; }

function ldEst(key, def){
  try { return Number(localStorage.getItem('bm_ld_' + key)) || def; }
  catch(e){ return def; }
}
function ldRemember(key, ms){
  // Blended, not replaced: one slow morning should nudge the estimate,
  // not become it.
  try {
    var old = Number(localStorage.getItem('bm_ld_' + key));
    localStorage.setItem('bm_ld_' + key, String(Math.round(old ? old * 0.6 + ms * 0.4 : ms)));
  } catch(e){}
}

// The first load after signing in, shown as one card rather than
// several corner ones appearing and vanishing.
var BOOT = { on:false, t0:0, keys:[], def:{}, done:{}, cur:'', curT0:0, timer:null };

function bootBegin(keys, labels){
  BOOT = { on:true, t0:Date.now(), keys:keys, def:{}, done:{},
           cur:keys[0], curT0:Date.now(), timer:null };
  keys.forEach(function(k){ BOOT.def[k] = 2500; });
  document.getElementById('bootSteps').innerHTML = keys.map(function(k, i){
    return '<li data-k="' + k + '"' + (i === 0 ? ' class="now"' : '') + '><i></i>' +
      esc(labels[i] || ldLabel(k)) + '<small></small></li>';
  }).join('');
  document.getElementById('boot').hidden = false;
  BOOT.timer = setInterval(bootTick, 100);
}
function bootTick(){
  if (!BOOT.on) return;
  var est = function(k){ return ldEst(k, BOOT.def[k]); };
  var total = BOOT.keys.reduce(function(a, k){ return a + est(k); }, 0);
  var got = BOOT.keys.filter(function(k){ return BOOT.done[k]; })
                     .reduce(function(a, k){ return a + est(k); }, 0);
  if (BOOT.cur && !BOOT.done[BOOT.cur]) {
    got += est(BOOT.cur) * Math.min(0.97,
      1 - Math.exp(-2.3 * (Date.now() - BOOT.curT0) / est(BOOT.cur)));
  }
  var pc = Math.min(99, 100 * got / total), e = (Date.now() - BOOT.t0) / 1000;
  document.getElementById('bootPct').textContent = Math.floor(pc) + '%';
  document.getElementById('bootTime').textContent = e.toFixed(1) + ' s';
  document.getElementById('bootFill').style.width = Math.max(2, pc) + '%';
  if (e * 1000 > total * 1.6) {
    document.getElementById('bootNote').textContent =
      'Taking longer than usual. Google can be slow on the first open of the day; still working…';
  }
}
function bootStep(key, st, ms){
  var li = document.querySelector('#bootSteps li[data-k="' + key + '"]');
  if (!li) return;
  li.className = st;
  if (ms != null) li.querySelector('small').textContent = (ms / 1000).toFixed(1) + ' s';
}
function bootEnd(ok, msg){
  if (!BOOT.on) return;
  clearInterval(BOOT.timer);
  if (!ok) {
    document.getElementById('bootNote').textContent = msg || 'Could not load.';
    document.getElementById('bootFill').style.background = 'var(--red)';
    // Left on screen deliberately: a failure the reader never sees is
    // a blank dashboard with no explanation.
    setTimeout(function(){ document.getElementById('boot').hidden = true; BOOT.on = false; }, 2500);
    return;
  }
  BOOT.on = false;
  document.getElementById('bootPct').textContent = '100%';
  document.getElementById('bootFill').style.width = '100%';
  document.getElementById('bootFill').style.background = 'var(--green)';
  setTimeout(function(){ document.getElementById('boot').hidden = true; }, 220);
}

function ldStart(key, label, defMs){
  var est = ldEst(key, defMs || 2500);
  var inBoot = BOOT.on && BOOT.keys.indexOf(key) >= 0;
  if (inBoot) { BOOT.cur = key; BOOT.curT0 = Date.now(); bootStep(key, 'now'); }

  var L = LD[key];
  if (!L) {
    L = LD[key] = { el: document.createElement('div') };
    L.el.className = 'ld';
    document.getElementById('ldbox').appendChild(L.el);
  }
  L.el.hidden = inBoot;
  clearInterval(L.timer); clearTimeout(L.hide);
  L.el.className = 'ld';
  L.el.innerHTML = '<div class="top"><b>' + esc(label) + '</b>' +
    '<span><em>0%</em><i>0.0 s</i></span></div>' +
    '<div class="trk"><div class="fill"></div></div><div class="sub"></div>';

  var tok = L.tok = {}, t0 = Date.now();
  var em = L.el.querySelector('em'), ti = L.el.querySelector('i');
  var fill = L.el.querySelector('.fill'), sub = L.el.querySelector('.sub');
  sub.textContent = 'Usually about ' + (est / 1000).toFixed(0) + ' s';
  var tick = function(){
    var e = Date.now() - t0;
    var pc = Math.min(97, 100 * (1 - Math.exp(-2.3 * e / est)));
    em.textContent = Math.floor(pc) + '%';
    ti.textContent = (e / 1000).toFixed(1) + ' s';
    fill.style.width = pc + '%';
    if (e > est * 1.6) sub.textContent = 'Taking longer than usual, still working…';
  };
  tick(); L.timer = setInterval(tick, 100);
  return { key: key, tok: tok, t0: t0 };
}

function ldEnd(h, ok){
  var L = LD[h.key];
  // A second call on the same key replaced this one; its card is not
  // ours to finish.
  if (!L || L.tok !== h.tok) return;
  clearInterval(L.timer);
  var ms = Date.now() - h.t0;
  if (BOOT.on && BOOT.keys.indexOf(h.key) >= 0) {
    BOOT.done[h.key] = ok;
    bootStep(h.key, ok ? 'ok' : 'bad', ms);
    if (BOOT.keys.every(function(k){ return BOOT.done[k] != null; })) {
      bootEnd(BOOT.keys.every(function(k){ return BOOT.done[k]; }));
    }
  }
  if (ok) ldRemember(h.key, ms);
  L.el.classList.add('done');
  L.el.querySelector('em').textContent = ok ? '100%' : '';
  L.el.querySelector('i').textContent = (ms / 1000).toFixed(1) + ' s';
  L.el.querySelector('.fill').style.width = '100%';
  L.el.querySelector('.sub').textContent = ok ? 'Loaded' : 'Stopped: there was an error';
  if (!ok) L.el.querySelector('.fill').style.background = 'var(--red)';
  L.hide = setTimeout(function(){
    L.el.classList.add('out');
    setTimeout(function(){
      if (L.tok === h.tok) { L.el.remove(); delete LD[h.key]; }
    }, 380);
  }, ok ? 700 : 2500);
}

// Set by config.js on the GitHub copy; absent inside Apps Script.
var BM_HOSTED = !!(typeof window !== 'undefined' && window.BM_EXEC_URL);

// Where the login is kept. On GitHub the app is installed and closed
// between uses, which ends a sessionStorage; the server's own session
// still expires on its usual clock either way.
function supStore(){
  try { return BM_HOSTED ? window.localStorage : window.sessionStorage; } catch(e){ return null; }
}

function api(action, payload){
  return new Promise(function(resolve){
    if (!BM_HOSTED && (typeof google === 'undefined' || !google.script || !google.script.run)) {
      resolve({ success:false, error:'Cannot reach the server.' }); return;
    }
    var data = { action:action, token:state.token };
    for (var k in (payload || {})) { if (payload.hasOwnProperty(k)) data[k] = payload[k]; }

    var h = ldStart(action, ldLabel(action));
    var settle = function(res){ ldEnd(h, !!(res && res.success)); return res; };

    if (BM_HOSTED) {
      // The Control Room's doPost hands this to the same router.
      // text/plain keeps it a simple request; no cookies are sent.
      fetch(window.BM_EXEC_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(data), redirect:'follow', credentials:'omit', cache:'no-store' })
        .then(function(r){ return r.text(); })
        .then(function(t){
          var r;
          try { r = JSON.parse(t); }
          catch(e){ r = { success:false, error:'The server sent a page instead of an answer.' }; }
          if (r && r.expired) doLogout(true);
          resolve(settle(r));
        })
        .catch(function(){ resolve(settle({ success:false, error:'Cannot reach the server. Check your connection.' })); });
      return;
    }

    google.script.run
      .withSuccessHandler(function(res){
        var r;
        try { r = typeof res === 'string' ? JSON.parse(res) : res; }
        catch(e){ r = { success:false, error:'Malformed server response.' }; }
        if (r && r.expired) doLogout(true);
        resolve(settle(r));
      })
      .withFailureHandler(function(err){
        resolve(settle({ success:false,
          error:(err && err.message) ? err.message : 'Connection failed.' }));
      })
      .apiCall(JSON.stringify(data));
  });
}

function dkReset(keepQuery){
  state.dk = { q: keepQuery ? state.dk.q : '', data: null, type: '', qty: {}, note: '',
               photos: [], saving: false, list: state.dk ? state.dk.list : null,
               pdfBusy: false, pdfLink: '', mode: state.dk ? state.dk.mode : 'so',
               extra: [{ name: '', qty: '' }] };
}

// Before anything redraws the screen, keep what has been typed.
function dkCapture(){
  var d = state.dk; if (!d) return;
  var q = document.getElementById('dk-q'); if (q) d.q = q.value;
  var n = document.getElementById('dk-note'); if (n) d.note = n.value;
  var qs = document.querySelectorAll('[data-dk-qty]');
  for (var i = 0; i < qs.length; i++) {
    d.qty[qs[i].getAttribute('data-dk-qty')] = qs[i].value;
  }
  var xn = document.querySelectorAll('[data-dk-xname]');
  for (var j = 0; j < xn.length; j++) {
    var k = Number(xn[j].getAttribute('data-dk-xname'));
    if (d.extra[k]) d.extra[k].name = xn[j].value;
  }
  var xq = document.querySelectorAll('[data-dk-xqty]');
  for (var m = 0; m < xq.length; m++) {
    var k2 = Number(xq[m].getAttribute('data-dk-xqty'));
    if (d.extra[k2]) d.extra[k2].qty = xq[m].value;
  }
}

var DK_CLS = { 'Inward': 'b-blue', 'Items returned': 'b-warn', 'Redispatch': 'b-blue', 'Cancelled': 'b-bad', 'Extra items': 'b-grey' };
var DK_INWARD = 'Inward';

// The area an order goes to, as the supervisor needs to read it.
// A shop that keeps sending orders back: support and the office want to know.
function dkFrdHTML(f){
  if (!f || !f.flagged) return '';
  return '<div class="err" style="margin-top:10px;"><b>\u26A0 Frequent RD shop</b> \u2014 ' + f.rd +
    ' RD order' + (f.rd === 1 ? '' : 's') + ' in the last 30 days' + (f.cancel ? ', ' + f.cancel + ' cancelled' : '') + '.</div>';
}

function dkPlaceHTML(p){
  if (!p) return '';
  var box = p.area === 'CANCEL'
    ? { cls: 'dk-place cx', head: 'Put in CANCEL AREA', sub: 'Check for damage, then take the articles inward one by one.' }
    : p.area === 'RD'
    ? { cls: 'dk-place rd', head: 'Put in RD AREA', sub: 'Keep it packed as it is. It goes out again.' }
    : { cls: 'dk-place pend', head: 'Calls pending \u2014 RD AREA for now', sub: 'Keep it packed. If support cancels it, it will show here as \u201cMove to CANCEL area\u201d.' };
  return '<div class="' + box.cls + '"><div class="dk-place-h">' + box.head + '</div>' +
    '<div class="dk-place-s">' + box.sub + '</div>' +
    (p.why ? '<div class="dk-place-w">' + esc(p.why) + '</div>' : '') + '</div>';
}

// A saved mark's area, from its decision.
function dkRowArea(x){
  if (x.type !== DK_INWARD && x.type !== 'Redispatch' && x.type !== 'Cancelled') return badge(DK_LABEL[x.type] || x.type, DK_CLS[x.type]);
  if (x.decision === 'Cancel') return x.placed && x.placed !== 'CANCEL' ? badge('Move to CANCEL area', 'b-bad') : badge('CANCEL area', 'b-bad');
  if (x.decision === 'RD') return badge('RD area', 'b-blue');
  return badge('RD area \u00b7 pending', 'b-warn');
}

    d.photos.map(function(p, i){
      return '<div class="dk-shot"><img src="' + esc(p.thumb) + '" alt="" />' +
        (p.uploading ? '<span class="dk-up">↑</span>' : '') +
        (p.failed ? '<span class="dk-up bad">!</span>' : '') +
        '<button class="dk-x" data-a="dk-photo-x" data-i="' + i + '">×</button></div>';
    }).join('') +
    (d.photos.length < DK_MAX_PHOTOS
      ? (supCamera()
          ? '<button class="dk-add" data-a="dk-cam">📷<br>Take photo</button>'
          : '<label class="dk-add">📷<br>Take photo<input type="file" accept="image/*" capture="environment" id="dk-file" style="display:none;" /></label>')
      : '') +
    '</div>';

  html += '<div class="sec">Note' + (d.type === 'Items returned' && d.data.items && !d.data.items.length ? '' : ' (optional)') + '</div>' +
    '<textarea id="dk-note" rows="2" placeholder="' +
      (d.type === 'Redispatch' ? 'Why: shop closed, asked for tomorrow…'
       : d.type === 'Cancelled' ? 'Why it was cancelled'
       : d.type === DK_EXTRA ? 'Where they were found, who loaded them\u2026'
       : 'Anything else about the return') + '">' + esc(d.note) + '</textarea>' +
    '<button class="btn block" style="margin-top:12px;" data-a="dk-save">' +
      'Save: ' + esc(DK_LABEL[d.type] || d.type) + '</button>' +
    '<div class="fnt" style="margin:6px 2px 0; text-align:center;">Saves in the background \u2014 ' +
      'you can type the next SO straight away.</div>';
  return html;
}

function dkLoadList(){
  api('deskList', {}).then(function(res){
    if (res && res.success) { state.dk.list = res; if (state.view === 'desk') { dkCapture(); render(); } }
  });
}

function dkFind(){
  dkCapture();
  var byRoute = state.dk.mode === 'route';
  var q = byRoute ? String(state.dk.q || '').trim().toUpperCase()
                  : String(state.dk.q || '').replace(/\D/g, '');
  if (byRoute && !/^(?=.*[A-Z])[A-Z0-9]{6}$/.test(q)) {
    state.error = 'A route code is 6 letters and numbers, like JWHUCM.'; render(); return;
  }
  if (!byRoute && q.length < 4) { state.error = 'Enter the SO number (the last 5 digits).'; render(); return; }
  state.error = ''; state.note = '';
  var keepList = state.dk.list;
  dkReset(true); state.dk.list = keepList; state.dk.q = q;
  state.loading = true; render();
  api('deskLookup', { query: q }).then(function(res){
    state.loading = false;
    if (res && res.success) {
      res.items = null;                 // on their way
      state.dk.data = res;
      if (res.order.routeOnly) { res.items = []; state.dk.type = DK_EXTRA; }
      else if (!state.dk.type) state.dk.type = DK_INWARD;
      else dkLoadItems(res.order.invoiceNo);
    } else {
      state.error = (res && res.error) || 'Could not find that order.';
    }
    render();
  });
}

// The item list can take a few seconds (it may come from the ERP), so
// it arrives behind the order card instead of holding it up.
function dkLoadItems(inv){
  api('deskItems', { invoiceNo: inv }).then(function(res){
    var d = state.dk;
    if (!d.data || d.data.order.invoiceNo !== inv) return;   // moved on
    d.data.items = (res && res.success) ? res.items : [];
    d.data.itemsNote = (res && res.success) ? res.itemsNote : 'Could not load the item list.';
    // Only redraw when it shows; never under the supervisor's thumbs.
    if (state.view === 'desk' && d.type === 'Items returned' && !dkTyping()) { dkCapture(); render(); }
  });
}

function dkAddPhoto(dataUrl){
  var d = state.dk;
  if (d.photos.length >= DK_MAX_PHOTOS) return;
  var p = { thumb: dataUrl, link: '', uploading: true, failed: false };
  d.photos.push(p);
  dkCapture(); render();
  dkUpload(p, d.data ? d.data.order.soNo : '');
}

// Sends one photo; tries once more on a bad connection. Whoever is
// waiting for it - the form, or a queued mark - is told when it lands.
function dkUpload(p, soNo){
  p.uploading = true; p.failed = false;
  var send = function(tries){
    api('deskPhoto', { base64: p.thumb.split(',')[1], mime: 'image/jpeg', soNo: soNo })
      .then(function(res){
        if (res && res.success) { p.link = res.link; p.uploading = false; }
        else if (tries < 2) { setTimeout(function(){ send(tries + 1); }, 2500); return; }
        else { p.uploading = false; p.failed = true; }
        dkPump();
        if (state.view === 'desk' && !dkTyping()) { dkCapture(); render(); }
      });
  };
  send(1);
}

// True while a text box on the desk has the keyboard; redrawing then
// would close the keyboard mid-word.
function dkTyping(){
  var a = document.activeElement;
  return !!(a && (a.id === 'dk-q' || a.id === 'dk-note' || (a.hasAttribute &&
    (a.hasAttribute('data-dk-qty') || a.hasAttribute('data-dk-xname') || a.hasAttribute('data-dk-xqty')))));
}

// Same size and quality as the DA app's proof photos.
function dkShrink(src, cb){
  var img = new Image();
  img.onload = function(){
    var maxEdge = 1000, w = img.width, h = img.height;
    if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
    else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    var out = c.toDataURL('image/jpeg', 0.6); c.width = 1; c.height = 1;
    cb(out);
  };
  img.src = src;
}

// How many days ago a yyyy-MM-dd day was; -1 when unknown.
var DK_OLD_DAYS = 3;
function dkDaysAgo(day){
  var m = String(day || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return -1;
  var then = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((now - then) / 86400000);
}
function dkNiceDay(day){
  var m = String(day || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return day;
  return Number(m[3]) + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[2]) - 1];
}

function dkSave(){
  dkCapture();
  var d = state.dk;
  if (!d.data || !d.type) return;
  var age = d.data.order && !d.data.order.routeOnly ? dkDaysAgo(d.data.order.routeDay) : -1;
  if (age >= DK_OLD_DAYS && !confirm('This order\u2019s route ran ' + age + ' days ago (' + dkNiceDay(d.data.order.routeDay) +
      '). Is SO ' + d.data.order.soNo + ' really the bill in your hand?')) return;
  if (d.photos.some(function(p){ return p.failed; })) {
    state.error = 'A photo did not upload. Remove it (×) and take it again.'; render(); return;
  }
  var items = (d.data.items || []).map(function(it, i){
    return { product: it.product, variant: it.variant, qty: Number(d.qty[i]) || 0 };
  }).filter(function(x){ return x.qty > 0; });
  if (d.type === DK_EXTRA) {
    items = d.extra.map(function(x){ return { product: String(x.name || '').trim(), variant: '', qty: Number(x.qty) || 0 }; })
      .filter(function(x){ return x.product && x.qty > 0; });
    if (!d.photos.length) { state.error = 'Take at least one photo of the extra items.'; render(); return; }
    if (!items.length && !String(d.note).trim()) {
      state.error = 'Enter each extra item and how many, or write them in the note.'; render(); return;
    }
  }
  if (d.type === 'Items returned') {
    if (!d.photos.length) { state.error = 'Take at least one photo of the returned items.'; render(); return; }
    if (!items.length && !String(d.note).trim()) {
      state.error = d.data.items
        ? 'Enter how many of each item came back, or write it in the note.'
        : 'The item list is still loading. Wait a moment, or write what came back in the note.';
      render(); return;
    }
  }
  var o = d.data.order;
  state.dkQueue.unshift({
    key: 'q' + Date.now(), soNo: o.soNo, invoiceNo: o.invoiceNo, party: o.partyName, code: o.code,
    routeOnly: !!o.routeOnly, type: d.type, items: items, note: d.note, photos: d.photos.slice(),
    status: 'waiting', error: ''
  });
  state.error = '';
  state.note = (o.routeOnly ? 'Route ' + o.code : 'SO ' + o.soNo) + ': ' + (DK_LABEL[d.type] || d.type) +
    ' — saving in the background.';
  var keepList = d.list;
  dkReset(false); state.dk.list = keepList;
  render();
  var q = document.getElementById('dk-q'); if (q) q.focus();
  dkPump();
}

// Sends every queued mark whose photos have all landed. Called on save,
// on each photo upload, and on Retry.
function dkPump(){
  state.dkQueue.forEach(function(job){
    if (job.status !== 'waiting') return;
    if (job.photos.some(function(p){ return p.uploading; })) return;
    if (job.photos.some(function(p){ return p.failed; })) {
      job.status = 'failed';
      job.error = 'A photo did not upload.';
      dkQueueChanged(); return;
    }
    job.status = 'saving';
    api('deskMark', { soNo: job.soNo, invoiceNo: job.invoiceNo, code: job.code, type: job.type, items: job.items,
                      note: job.note, photos: job.photos.map(function(p){ return p.link; }) })
      .then(function(res){
        if (res && res.success) {
          state.dkQueue = state.dkQueue.filter(function(j){ return j !== job; });
          dkListAdd(res.row);
        } else {
          job.status = 'failed';
          job.error = (res && res.error) || 'Could not save.';
        }
        dkQueueChanged();
      });
  });
}

function dkQueueChanged(){
  if (state.view === 'desk' && !dkTyping()) { dkCapture(); render(); }
}

// The saved mark goes straight into today's list; no reload needed.
function dkListAdd(row){
  var L = state.dk.list;
  if (!row || !L) { dkLoadList(); return; }
  // Same rule as the server: an order has one main mark and one extra-
  // items entry; a route-only entry is keyed by its route.
  var slot = function(x){ return (x.type === DK_EXTRA ? 'x|' : 'm|') + (x.invoiceNo || ('route:' + x.code)); };
  L.rows = [row].concat(L.rows.filter(function(x){ return slot(x) !== slot(row); }));
  L.counts = { returned: 0, extra: 0, inward: 0, rd: 0, cancel: 0, pending: 0, moveToCancel: 0, redispatch: 0, cancelled: 0 };
  L.rows.forEach(function(x){
    if (x.type === 'Items returned') L.counts.returned++;
    if (x.type === DK_EXTRA) L.counts.extra++;
    if (x.type === DK_INWARD) L.counts.inward++;
    var back = x.decision || x.type === DK_INWARD;
    if (!back) return;
    if (x.decision === 'RD') { L.counts.rd++; L.counts.redispatch++; }
    else if (x.decision === 'Cancel') { L.counts.cancel++; L.counts.cancelled++; if (x.placed && x.placed !== 'CANCEL') L.counts.moveToCancel++; }
    else L.counts.pending++;
  });
}

function dkRetry(key){
  state.dkQueue.forEach(function(job){
    if (job.key !== key) return;
    job.photos.forEach(function(p){ if (p.failed) dkUpload(p, job.soNo); });
    job.status = 'waiting'; job.error = '';
  });
  render();
  dkPump();
}

function dkDrop(key){
  if (!confirm('Throw this mark away? It has not been saved.')) return;
  state.dkQueue = state.dkQueue.filter(function(j){ return j.key !== key; });
  render();
}

function dkJobHTML(j){
  var left = j.photos.filter(function(p){ return p.uploading; }).length;
  var line = j.status === 'failed' ? '<span style="color:var(--red);">Not saved: ' + esc(j.error) + '</span>'
           : j.status === 'saving' ? 'Saving…'
           : left ? 'Waiting for ' + left + ' photo' + (left > 1 ? 's' : '') + ' to upload…'
           : 'Saving…';
  return '<div class="card dk-job' + (j.status === 'failed' ? ' bad' : '') + '"><div class="row"><div class="grow">' +
    '<div class="ttl trunc">' + esc(cleanName(j.party) || j.invoiceNo || ('Route ' + j.code)) + '</div>' +
    '<div class="mut">' + (j.soNo ? 'SO ' + esc(j.soNo) + ' · ' : 'No order · ') + esc(j.code) + '</div>' +
    '<div class="fnt">' + line + '</div>' +
    '</div><div style="text-align:right;">' + badge(DK_LABEL[j.type] || j.type, DK_CLS[j.type]) +
    (j.status === 'failed'
      ? '<div style="margin-top:8px;"><button class="btn sm" data-a="dk-retry" data-k="' + esc(j.key) + '">Retry</button> ' +
        '<button class="btn sm ghost" data-a="dk-drop" data-k="' + esc(j.key) + '">×</button></div>'
      : '') +
    '</div></div></div>';
}

// Nothing is deleted: a mark made by mistake is removed with a reason,
// kept on record, and the order stays flagged until it is decided.
var DK_REMOVE = ['Wrong SO number entered', 'Goods were not returned (delivered)', 'Entered twice', 'Other'];
function dkUndo(id){
  dkCapture();
  state.dkRemove = { id: id, reason: '', note: '' };
  render();
  var el = document.getElementById('dk-rm-box');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function dkRemoveHTML(x){
  var r = state.dkRemove;
  if (!r || r.id !== x.id) return '';
  return '<div id="dk-rm-box" style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">' +
    '<div class="fnt" style="margin-bottom:6px;">Why is this mark being removed? It stays on record.</div>' +
    '<select id="dk-rm-why">' + '<option value="">Choose\u2026</option>' + DK_REMOVE.map(function(w){
      return '<option' + (r.reason === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join('') + '</select>' +
    '<input type="text" id="dk-rm-note" style="margin-top:8px;" placeholder="Note (needed for Other)" value="' + esc(r.note) + '" />' +
    '<div class="row" style="margin-top:9px; gap:8px;"><button class="btn sm ghost" data-a="dk-rm-cancel">Cancel</button>' +
    '<span class="grow"></span><button class="btn sm red" data-a="dk-rm-go">Remove</button></div></div>';
}
function dkRemoveGo(){
  var r = state.dkRemove; if (!r) return;
  r.reason = (document.getElementById('dk-rm-why') || {}).value || '';
  r.note = (document.getElementById('dk-rm-note') || {}).value || '';
  if (!r.reason) { state.error = 'Pick why the mark is being removed.'; render(); return; }
  if (r.reason === 'Other' && r.note.trim().length < 3) { state.error = 'Write why.'; render(); return; }
  api('deskUndo', { id: r.id, reason: r.reason, note: r.note }).then(function(res){
    if (res && res.success) { state.note = res.note || 'Removed.'; state.dkRemove = null; dkLoadList(); }
    else { state.error = (res && res.error) || 'Could not remove it.'; }
    dkCapture(); render();
  });
}

function dkPdf(){
  dkCapture();
  var d = state.dk;
  // Marks still on their way to the server would be missing from it.
  if (state.dkQueue.length &&
      !confirm(state.dkQueue.length + ' mark(s) are still saving and will not be in this PDF. Make it anyway?')) return;
  d.pdfBusy = true; d.pdfLink = ''; state.error = ''; render();
  api('deskPdf', {}).then(function(res){
    d.pdfBusy = false;
    if (!res || !res.success) { state.error = (res && res.error) || 'Could not make the PDF.'; render(); return; }
    d.pdfLink = res.link || '';
    try {
      var bin = atob(res.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url; a.download = res.fileName || 'Returns desk.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
      state.note = 'PDF downloaded: ' + res.redispatch + ' RD, ' + res.cancelled + ' cancelled, ' +
        (res.extra || 0) + ' extra items. You can keep marking; press again for an updated PDF.';
    } catch (e) {
      state.note = 'PDF ready — use the Drive link below to open it.';
    }
    render();
  });
}

/******************** CAMERA (GitHub copy only) ********************/
// Apps Script forbids the camera in its frame, so there the photo
// button opens the phone's camera app instead.
var scam = { stream: null, el: null };
function supCamera(){
  return BM_HOSTED && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function scamOpen(){
  if (scam.el) return;
  var el = document.createElement('div');
  el.className = 'scam';
  el.innerHTML = '<video id="scam-v" autoplay playsinline muted></video>' +
    '<div class="scam-bar"><button type="button" id="scam-done">Done</button>' +
    '<button type="button" id="scam-shoot" aria-label="Take photo"></button>' +
    '<span id="scam-n"></span></div>';
  document.body.appendChild(el);
  scam.el = el;
  var count = function(){ var n = document.getElementById('scam-n');
    if (n) n.textContent = state.dk.photos.length + ' / ' + DK_MAX_PHOTOS; };
  count();
  document.getElementById('scam-done').onclick = scamClose;
  document.getElementById('scam-shoot').onclick = function(){
    var v = document.getElementById('scam-v');
    if (!scam.stream || !v.videoWidth) return;
    var c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    var raw = c.toDataURL('image/jpeg', 0.85); c.width = 1; c.height = 1;
    dkShrink(raw, function(out){
      dkAddPhoto(out); count();
      el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 150);
      if (state.dk.photos.length >= DK_MAX_PHOTOS) scamClose();
    });
  };
  navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } } })
    .then(function(s){
      if (!scam.el) { s.getTracks().forEach(function(t){ t.stop(); }); return; }
      scam.stream = s;
      var v = document.getElementById('scam-v'); v.srcObject = s;
      var p = v.play && v.play(); if (p && p.catch) p.catch(function(){});
    }).catch(function(err){
      scamClose();
      state.error = (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError'))
        ? 'The camera is blocked for this app. In Chrome tap the lock icon next to the address, then Permissions → Camera → Allow.'
        : 'The camera could not start' + (err && err.name ? ' (' + err.name + ')' : '') + '.';
      dkCapture(); render();
    });
}
function scamClose(){
  if (scam.stream) { scam.stream.getTracks().forEach(function(t){ t.stop(); }); scam.stream = null; }
  if (scam.el && scam.el.parentNode) scam.el.parentNode.removeChild(scam.el);
  scam.el = null;
}
document.addEventListener('visibilitychange', function(){ if (document.hidden && scam.el) scamClose(); });
// A mark still in the queue only exists on this phone.
window.addEventListener('beforeunload', function(ev){
  if (state.dkQueue && state.dkQueue.length) { ev.preventDefault(); ev.returnValue = ''; }
});

/******************** RENDER ********************/
function render(){
  var app = document.getElementById('app');
  if (!state.token){ app.innerHTML = loginHTML(); bind(); return; }
  app.innerHTML = topHTML() +
    '<div class="page">' + (state.loading ? '<div class="spin">Loading…</div>' : pageHTML()) + '</div>' +
    tabbarHTML();
  bind();
}

function loginHTML(){
  return '<div class="login"><div class="login-box">' +
    '<h1>BM Supervisor</h1><p>Delivery floor and route watch</p>' +
    '<label class="f">Login name</label>' +
    '<input type="text" id="lg-name" autocomplete="username" autocapitalize="none" />' +
    '<label class="f">PIN</label>' +
    '<input type="password" id="lg-pin" inputmode="numeric" autocomplete="current-password" />' +
    (state.error ? '<div class="err" style="margin-top:14px;">' + esc(state.error) + '</div>' : '') +
    '<div style="margin-top:18px;"><button class="btn block" data-a="login">' +
      (state.loading ? 'Signing in…' : 'Sign in') + '</button></div>' +
    '</div></div>';
}

function clockOf(ms){
  var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
  return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' am' : ' pm');
}

function topHTML(){
  var titles = { home:'Route watch', fails:'Not delivered', routes:'Routes',
                 lookup:'Order lookup', floor:'Left on floor', quick:'Quick route', desk:'Returns desk',
                 route:'Route', assign:'Route assignment' };
  var sub = state.view === 'route' ? esc(state.routeCode || '')
          : (state.date === today() ? 'Today' : esc(state.date));
  if (state.savedAt[state.view] && state.data[state.view]) {
    sub += ' \u00b7 saved ' + esc(clockOf(state.savedAt[state.view])) +
           (state.updating ? ', updating\u2026' : '');
  }
  var back = (state.view === 'route' || state.view === 'quick' || state.view === 'assign')
    ? '<button class="back" data-a="back">‹</button>' : '';
  return '<div class="top">' + back +
    '<h1>' + esc(titles[state.view] || 'BM Supervisor') +
      '<div class="sub">' + sub + '</div></h1>' +
    '<button data-a="refresh">Refresh</button>' +
    '<button data-a="logout">Exit</button>' +
    '</div>';
}

function tabbarHTML(){
  var home = state.data.home;
  var counts = {
    home: home ? (home.stats.alerts + home.stats.warns) : 0,
    fails: home ? home.stats.failures : 0,
    floor: (state.data.floor && state.data.floor.onFloor) || 0
  };
  return '<div class="tabbar">' + TABS.map(function(t){
    var n = counts[t.id] || 0;
    return '<div class="' + (state.view === t.id ? 'on' : '') + '" data-a="tab" data-v="' + t.id + '">' +
      '<span class="ic">' + t.ic + '</span><span>' + esc(t.label) + '</span>' +
      (n ? '<span class="dot">' + (n > 99 ? '99+' : n) + '</span>' : '') +
      '</div>';
  }).join('') + '</div>';
}

function pageHTML(){
  var err = state.error ? '<div class="err">' + esc(state.error) + '</div>' : '';
  var note = state.note ? '<div class="ok">' + esc(state.note) + '</div>' : '';
  var d = state.data[state.view];
  if (state.view === 'home')   return err + note + homeHTML(state.data.home);
  if (state.view === 'fails')  return err + note + failsHTML(state.data.fails);
  if (state.view === 'routes') return err + note + routesHTML(state.data.routes);
  if (state.view === 'route')  return err + note + routeHTML();
  if (state.view === 'lookup') return err + note + lookupHTML();
  if (state.view === 'product') return err + note + productHTML();
  if (state.view === 'floor')  return err + note + floorHTML(state.data.floor);
  if (state.view === 'quick')  return err + note + quickHTML();
  if (state.view === 'desk')   return err + note + deskHTML();
  if (state.view === 'assign') return err + note + assignHTML(state.data.assign);
  return '';
}

/******************** ROUTE ASSIGNMENT ********************/
// Today's routes in the order they leave, who has each, who is still
// waiting, and every change made today. A move always needs a reason.
function assignHTML(d){
  if (!d) return '<div class="empty">Loading\u2026</div>';
  var h = '';
  // The emergency switch. Off: everyone back to typing codes.
  h += '<div class="card" style="padding:12px 14px;"><div class="row"><div class="grow">' +
    '<div class="ttl" style="font-size:14px;">' + (d.on ? 'Route choice is ON' : 'Route choice is OFF') + '</div>' +
    '<div class="fnt">' + (d.on ? 'DAs pick from 3 routes when they log in.' : 'DAs type the code from the loading sheet, as before.') + '</div></div>' +
    (state.asConfirm || (state.roles || []).indexOf('Admin') === -1
      ? ''
      : '<button class="btn sm ' + (d.on ? 'red' : '') + '" data-a="as-switch">' + (d.on ? 'Switch off' : 'Switch on') + '</button>') +
    '</div>' +
    (state.asConfirm
      ? '<div class="fnt" style="margin-top:8px;">' + (d.on
          ? 'Everyone goes back to typing the code from the loading sheet within a minute. Routes already picked stay on record.'
          : 'DAs will pick from 3 routes when they next open the app.') + '</div>' +
        '<div class="row" style="margin-top:9px; gap:8px;"><button class="btn sm ghost" data-a="as-switch-no">Cancel</button><span class="grow"></span>' +
        '<button class="btn sm ' + (d.on ? 'red' : '') + '" data-a="as-switch-yes">' + (d.on ? 'Yes, switch off' : 'Yes, switch on') + '</button></div>'
      : '') +
    '</div>';
  var waitingRoutes = d.routes.filter(function(r){ return r.status === 'Waiting'; }).length;
  h += '<div class="card" style="padding:12px 14px;">' +
    '<div class="ttl" style="font-size:15px;">' + d.routes.length + ' routes \u00b7 ' + waitingRoutes + ' not taken yet</div>' +
    '<div class="fnt">Each DA picks one of 3 when he logs in. Before ' + esc(ampm(d.from)) +
      ' he is offered routes that fit his last 14 days; after it, the 3 longest left. ' +
      'Team average: ' + (d.teamAvgMin ? mins(d.teamAvgMin) : '\u2014') + ' a route.</div></div>';

  h += '<div class="sec">Checked in, no route yet (' + d.waiting.length + ')</div>';
  h += d.waiting.length
    ? '<div class="card" style="padding:10px 12px;">' + d.waiting.map(function(p){
        return '<div class="row" style="padding:4px 0;"><div class="grow">' + esc(p.name) + '</div>' +
          '<span class="fnt">' + (p.avgMin == null ? 'no routes in 14 days' : 'last 14 days: ' + p.routes14 + ' routes, ' + mins(p.avgMin) + ' each') + '</span></div>';
      }).join('') + '</div>'
    : '<div class="empty" style="padding:10px;">Everyone checked in has a route.</div>';

  h += '<div class="sec">Leaving order</div>';
  h += d.routes.length ? d.routes.map(function(r){
    var open = state.asMove === r.code;
    var cls = r.status === 'Waiting' ? 'b-grey' : r.status === 'Given out' ? 'b-blue' : statusCls(r.status);
    var label = r.status === 'Waiting' ? 'Not taken' : r.status === 'Given out' ? 'Picked' : r.status;
    var line = '<div class="card" style="padding:11px 12px;">' +
      '<div class="row"><div class="seq">' + r.n + '</div>' +
      '<div class="grow"><div class="ttl" style="font-size:14px;">' + esc(r.da || 'Nobody yet') + '</div>' +
      '<div class="mut">' + esc(r.code) + (r.vehicle ? ' \u00b7 ' + esc(r.vehicle) : '') + (r.vtype ? ' (' + esc(r.vtype) + ')' : '') + '</div>' +
      '<div class="fnt">' + r.stops + ' stops \u00b7 ' + mins(r.plannedMin) + (r.km ? ' \u00b7 ' + r.km + ' km' : '') +
        (r.how === 'Moved' || r.how === 'Swapped' ? ' \u00b7 ' + esc(r.how) + (r.by ? ' by ' + esc(r.by) : '') :
         r.how === 'Picked late' ? ' \u00b7 picked late' + (r.at ? ' (' + esc(r.at) + ')' : '') :
         /^Picked \(/.test(r.how || '') ? ' \u00b7 ' + esc(r.how.replace('Picked', 'picked')) + (r.at ? ' ' + esc(r.at) : '') :
         r.how === 'Picked' && r.at ? ' \u00b7 picked ' + esc(r.at) : '') + '</div></div>' +
      badge(label, cls) + '</div>';
    if (r.status !== 'Trip ended') {
      line += open ? assignMoveHTML(d, r)
        : '<div class="row" style="margin-top:9px;"><span class="grow"></span>' +
          '<button class="btn sm ghost" data-a="as-move" data-code="' + esc(r.code) + '">' +
          (r.da ? 'Move to another DA' : 'Give to a DA') + '</button></div>';
    }
    return line + '</div>';
  }).join('') : '<div class="empty">No routes planned for today yet.</div>';

  if (d.moves && d.moves.length) {
    h += '<div class="sec">Changes today</div><div class="card" style="padding:10px 12px;">' +
      d.moves.map(function(m){
        return '<div style="padding:5px 0; border-bottom:1px solid var(--border);">' +
          '<div><b>' + esc(m.code) + '</b> \u2192 ' + esc(m.da) + ' <span class="fnt">' + esc(m.at) + ' \u00b7 ' + esc(m.by) +
          (m.how === 'Swapped' ? ' \u00b7 swap' : '') + '</span></div>' +
          (m.reason ? '<div class="fnt">' + esc(m.reason) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }
  return h;
}

function assignMoveHTML(d, r){
  var opts = '<option value="">Choose a DA\u2026</option>' + d.people.filter(function(p){
    return p.name !== r.da;
  }).map(function(p){
    var note = p.onTrip ? 'out on ' + p.onTrip : p.holds ? 'has ' + p.holds : p.checkedIn ? 'waiting' : 'not checked in';
    if (p.role && p.role !== 'DA') note = p.role + ', ' + note;
    return '<option value="' + esc(p.name) + '"' + (state.asTo === p.name ? ' selected' : '') +
      (p.onTrip ? ' disabled' : '') + '>' + esc(p.name) + ' \u2014 ' + esc(note) + '</option>';
  }).join('');
  var swap = state.asSwap && state.asSwap.code === r.code
    ? '<div class="err" style="margin-top:8px;">' + esc(state.asSwap.msg) + '</div>' +
      '<button class="btn block" style="margin-top:8px;" data-a="as-swap">Swap ' + esc(r.code) + ' and ' + esc(state.asSwap.other) + '</button>'
    : '';
  return '<div style="margin-top:10px;">' +
    '<select id="as-to" data-a="as-to">' + opts + '</select>' +
    '<input type="text" id="as-why" style="margin-top:8px;" placeholder="Why? (required, kept on record)" value="' + esc(state.asWhy || '') + '" />' +
    (r.status === 'On route' ? '<div class="fnt" style="margin-top:6px;">' + esc(r.runner) +
      ' has started this route. The new DA takes it over from where it is.</div>' : '') +
    swap +
    '<div class="row" style="margin-top:9px; gap:8px;"><button class="btn sm ghost" data-a="as-cancel">Cancel</button>' +
    '<span class="grow"></span><button class="btn sm" data-a="as-go" data-code="' + esc(r.code) + '">Move</button></div></div>';
}

function ampm(hhmm){
  var p = String(hhmm || '').split(':');
  var h = Number(p[0]), mi = p[1] || '00';
  if (!isFinite(h)) return String(hhmm || '');
  return ((h % 12) || 12) + ':' + mi + (h < 12 ? ' AM' : ' PM');
}

function asCapture(){
  var t = document.getElementById('as-to'), w = document.getElementById('as-why');
  if (t) state.asTo = t.value;
  if (w) state.asWhy = w.value;
}

function asMove(code, swap){
  asCapture();
  if (!state.asTo) { state.error = 'Choose who gets the route.'; render(); return; }
  if (String(state.asWhy || '').trim().length < 3) { state.error = 'Write why the route is being moved.'; render(); return; }
  state.error = ''; state.updating = true; render();
  api('moveRoute', { code: code, toDa: state.asTo, reason: state.asWhy, swap: !!swap }).then(function(res){
    state.updating = false;
    if (res && res.success) {
      state.data.assign = res; state.loadedAt.assign = Date.now();
      state.asMove = null; state.asTo = ''; state.asWhy = ''; state.asSwap = null;
      state.note = res.note || 'Moved.';
    } else if (res && res.needSwap) {
      state.asSwap = { code: code, other: res.otherCode, msg: res.error };
    } else {
      state.error = (res && res.error) || 'Could not move that route.';
    }
    if (state.view === 'assign') render();
  });
}

function asRelease(){
  state.error = ''; state.updating = true; render();
  api('releaseRoutes', {}).then(function(res){
    state.updating = false;
    if (res && res.success) { state.data.assign = res; state.loadedAt.assign = Date.now(); state.note = res.note || ''; }
    else state.error = (res && res.error) || 'Could not give out routes.';
    if (state.view === 'assign') render();
  });
}

function st(label, value, sub, cls, act){
  return '<div class="st ' + (cls || '') + (act ? ' tap' : '') + '"' +
    (act ? ' data-a="' + act + '"' : '') + '>' +
    '<div class="l">' + esc(label) + '</div>' +
    '<div class="v">' + esc(String(value)) + '</div>' +
    '<div class="s">' + esc(sub || '') + '</div></div>';
}

/******************** HOME - what needs attention now ********************/
function homeHTML(d){
  if (!d) return '<div class="empty">No data yet.</div>';
  var s = d.stats;

  var html = '<div class="stats">' +
    st('Stuck', s.alerts + s.warns,
       s.alerts ? s.alerts + ' over ' + mins(d.thresholds.alertMin) : 'no mark for ' + mins(d.thresholds.warnMin) + '+',
       s.alerts ? 'bad' : (s.warns ? 'warn' : 'good')) +
    st('Not delivered', s.notDelivered, 'of ' + s.orders + ' orders',
       s.notDelivered ? 'bad' : 'good', 'tab-fails') +
    st('Picked up', (s.assigned || 0) + ' / ' + (s.planned || 0),
       s.runs ? 'across ' + s.runs + ' run' + (s.runs === 1 ? '' : 's') : 'of routes planned today',
       s.unassigned ? 'warn' : 'good', 'tab-routes') +
    st('Routes out', s.routesOpen + ' / ' + s.routes, 'still on the road', s.routesOpen ? 'warn' : 'good', 'tab-routes') +
    st('Pending', s.pending + ' / ' + s.orders, 'not marked either way', s.pending ? 'warn' : 'good') +
    st('Absent', (s.absentDas || 0) + ' / ' + (s.activeDas || 0), 'never opened the DA app',
       s.absentDas ? 'bad' : 'good') +
    st('On routes', s.onRouteDas || 0, 'partners out delivering', '', 'tab-routes') +
    '</div>';

  if (s.absentDas) {
    html += '<div class="sec">Not signed in today</div>';
    html += '<div class="card">' +
      '<div class="fnt" style="margin-bottom:4px;">' + s.absentDas + ' of ' + s.activeDas +
        ' partners have not opened the DA app.</div>' +
      d.absentDas.map(function(x){
        return '<div class="row" style="padding:7px 0; border-top:1px solid var(--border);">' +
          '<div class="grow ttl" style="font-size:14px;">' + esc(cleanName(x.daName)) + '</div>' +
          badge('Absent', 'b-bad') + callBtn(x.daPhone) + '</div>';
      }).join('') + '</div>';
  }

  if (d.noProof && d.noProof.length) {
    html += '<div class="sec">Delivered without a photo today (' + d.noProof.length + ')</div>';
    html += d.noProof.map(function(x){
      return '<div class="card" style="padding:10px 12px;"><div class="row">' +
        '<div class="grow"><div class="ttl" style="font-size:14px;">' + esc(cleanName(x.daName)) + ' \u00b7 ' + esc(x.code) + '</div>' +
        '<div class="fnt">' + esc(x.invoiceNo) + ' \u00b7 ' + esc(x.at) + '</div>' +
        '<div class="mut">' + esc(x.reason) + '</div></div>' +
        callBtn(x.daPhone, 'DA') + '</div></div>';
    }).join('');
  }

  if (d.plannerError) {
    html += '<div class="err">Could not read the route planner, so the planned ' +
      'figures are missing: ' + esc(d.plannerError) + '</div>';
  }

  if (s.notStarted) {
    html += '<div class="sec">Never left the warehouse</div>';
    d.notStarted.forEach(function(x){
      html += '<div class="card alert lv-alert"><div class="row">' +
        '<div class="grow"><div class="ttl">' + esc(x.code) + '</div>' +
        '<div class="mut">' + x.orders + ' orders planned, nobody has opened it</div>' +
        '<div class="fnt">Should have left by ' + esc(d.thresholds.startBy) + ' — ' + mins(x.lateMin) + ' late</div>' +
        '</div></div></div>';
    });
  }

  if (s.alerts + s.warns) {
    html += '<div class="sec">Stopped moving</div>';
    d.stuck.forEach(function(x){ html += stuckCard(x); });
  }

  if (s.notEnded) {
    html += '<div class="sec">Trip never closed</div>';
    d.notEnded.forEach(function(x){
      html += '<div class="card tap" data-a="route" data-code="' + esc(x.code) + '"><div class="row">' +
        '<div class="grow"><div class="ttl">' + esc(cleanName(x.daName) || 'Unknown') + '</div>' +
        '<div class="mut">' + esc(x.code) + (x.vehicleNo ? ' · ' + esc(x.vehicleNo) : '') + '</div>' +
        '<div class="fnt">Open ' + mins(x.overdueMin) + ' past ' + esc(d.thresholds.endBy) +
          (x.pending ? ' · ' + x.pending + ' unmarked' : '') + '</div></div>' +
        callBtn(x.daPhone) + '</div></div>';
    });
  }

  if (s.idleDas) {
    html += '<div class="sec">Logged in, no route</div>';
    html += '<div class="card">' + d.idleDas.map(function(x){
      return '<div class="row" style="padding:6px 0;"><div class="grow ttl" style="font-size:14px;">' +
        esc(cleanName(x.daName)) + '</div>' + callBtn(x.daPhone) + '</div>';
    }).join('') + '</div>';
  }

  if (d.failuresTop && d.failuresTop.length) {
    html += '<div class="sec">Latest failures</div>';
    d.failuresTop.forEach(function(x){ html += failCard(x, true); });
    if (s.failures > d.failuresTop.length) {
      html += '<button class="btn ghost block" data-a="tab-fails">See all ' + s.failures + ' failures</button>';
    }
  }

  if (!s.alerts && !s.warns && !s.notStarted && !s.notEnded && !s.failures) {
    html += '<div class="empty">Nothing needs chasing. Every route is moving and no delivery has failed.</div>';
  }
  return html;
}

function stuckCard(x){
  var done = x.done, total = x.total;
  return '<div class="card alert lv-' + x.level + ' tap" data-a="route" data-code="' + esc(x.code) + '">' +
    '<div class="row">' +
      '<div class="grow"><div class="ttl">' + esc(cleanName(x.daName) || 'Unknown') +
        (x.runnerRole && x.runnerRole !== 'DA' ? ' ' + badge(x.runnerRole, 'b-blue') : '') + '</div>' +
        '<div class="mut">' + esc(x.code) + (x.vehicleNo ? ' · ' + esc(x.vehicleNo) : '') + '</div></div>' +
      '<div style="text-align:right;"><div class="idle">' + mins(x.idleMin) + '</div>' +
        '<div class="fnt">since ' + esc(x.basis) + '</div></div>' +
    '</div>' +
    '<div class="mut" style="margin-top:7px;">' + done + ' of ' + total + ' done' +
      (x.notDelivered ? ' · ' + x.notDelivered + ' failed' : '') + '</div>' +
    progressBar(done, total) +
    (x.nextStop
      ? '<div class="fnt" style="margin-top:7px;">Sitting on stop ' + x.nextStop.sequence + ' — ' +
         esc(x.nextStop.shop || 'unnamed shop') + (x.nextStop.area ? ', ' + esc(x.nextStop.area) : '') + '</div>'
      : '') +
    '<div class="row" style="margin-top:10px;">' + callBtn(x.daPhone, 'Call ' + cleanName(x.daName).split(' ')[0]) +
      '<span class="grow"></span><span class="link">Open route ›</span></div>' +
    '</div>';
}

// Whether the DA called the SO before marking it (from 28 Oct).
function soCheckLine(v){
  if (!v) return '';
  var bad = /not reached/i.test(v);
  return '<div class="fnt" style="color:var(' + (bad ? '--amber' : '--green') + ');">' +
    (bad ? '\u26A0 ' : '\u2713 ') + esc(v) + '</div>';
}

function failsHTML(d){
  if (!d) return '<div class="empty">No data yet.</div>';
  if (!d.rows.length) return '<div class="empty">No failed deliveries on ' +
    (d.date === today() ? 'today’s' : esc(d.date)) + ' routes.</div>';

  var html = '<div class="chips">' +
    '<div class="chip' + (state.failFilter ? '' : ' on') + '" data-a="fail-f" data-v="">All ' + d.rows.length + '</div>' +
    d.reasons.map(function(r){
      return '<div class="chip' + (state.failFilter === r.reason ? ' on' : '') + '" data-a="fail-f" data-v="' +
        esc(r.reason) + '">' + esc(r.reason) + ' ' + r.count + '</div>';
    }).join('') + '</div>';

  if (d.byDa.length > 1) {
    html += '<div class="card"><div class="fnt" style="margin-bottom:6px;">Failures by partner</div>' +
      d.byDa.map(function(x){
        return '<div class="row" style="padding:4px 0;"><div class="grow trunc" style="font-size:13.5px;">' +
          esc(cleanName(x.daName)) + '</div><b>' + x.count + '</b></div>';
      }).join('') + '</div>';
  }

  var rows = state.failFilter
    ? d.rows.filter(function(x){ return String(x.reason || 'No reason given').split(' \u2014 ')[0].trim() === state.failFilter; })
    : d.rows;
  html += '<div class="sec">' + rows.length + ' order' + (rows.length === 1 ? '' : 's') + '</div>';
  rows.forEach(function(x){ html += failCard(x, false); });
  return html;
}

/******************** ROUTES ********************/

    '<div class="empty">No routes started on this day.</div>';

  // without counting cards. Routes outnumber partners when one runs two.

  var head = '<div class="card tap" data-a="tab" data-v="assign" style="padding:11px 14px;"><div class="row">' +
      '<div class="grow"><div class="ttl" style="font-size:14px;">Route assignment</div>' +

      '<span class="link">Open \u203a</span></div></div>' +

      ? '<div class="err">Could not read the route planner: ' + esc(d.plannerError) + '</div>'

      (d.assigned || 0) + ' of ' + (d.planned || 0) + ' routes picked up</div>' +
    '<div class="fnt">' +

  // Routes nobody has opened yet, listed first so the codes still

      d.unassigned.map(function(u){
