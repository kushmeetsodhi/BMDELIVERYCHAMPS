          '<div class="grow"><div class="ttl" style="font-size:14px;">' + esc(u.code) +
            (u.vehicle ? ' · ' + esc(u.vehicle) : '') + '</div>' +
          '<div class="fnt">' + u.orders + ' stop' + (u.orders === 1 ? '' : 's') +
            (u.createdAt ? ' · issued ' + esc(u.createdAt) : '') +
            (u.type === 'special' ? ' · special run' : '') + '</div></div>' +
          badge('Not taken', 'b-warn') + '</div></div>';
      }).join('') +
      '<div class="sec">' + d.routes.length + ' on the road</div>';
  }

  return head + d.routes.map(function(r, i){
    var done = r.delivered + r.notDelivered;
    return '<div class="card tap' + (r.stuckLevel ? ' alert lv-' + r.stuckLevel : '') +
      '" data-a="route" data-code="' + esc(r.code) + '">' +
      '<div class="row">' +
        '<div class="seq">' + (i + 1) + '</div>' +
        '<div class="grow"><div class="ttl">' + esc(cleanName(r.daName) || 'Unassigned') +
          (r.runnerRole && r.runnerRole !== 'DA' ? ' ' + badge(r.runnerRole, 'b-blue') : '') + '</div>' +
          '<div class="mut">' + esc(r.code) + (r.vehicleNo ? ' · ' + esc(r.vehicleNo) : '') + '</div></div>' +
        badge(r.isOpen ? 'On route' : 'Trip ended') +
      '</div>' +
      '<div class="mut" style="margin-top:7px;">' + done + ' of ' + r.total + ' marked' +
        (r.notDelivered ? ' · ' + r.notDelivered + ' failed' : '') +
        (r.pending ? ' · ' + r.pending + ' pending' : '') + '</div>' +
      progressBar(done, r.total) +
      (r.stuckLevel
        ? '<div class="fnt" style="margin-top:7px;"><b>No mark for ' + mins(r.idleMin) + '</b>' +
          (r.nextStop ? ' — stop ' + r.nextStop.sequence + ', ' + esc(r.nextStop.shop || '') : '') + '</div>'
        : (r.lastMark ? '<div class="fnt" style="margin-top:7px;">Last mark ' + esc(r.lastMark) + '</div>' : '')) +
      '<div class="row" style="margin-top:10px;">' + callBtn(r.daPhone) +
        '<span class="grow"></span><span class="link">Open ›</span></div>' +
      '</div>';
  }).join('');
}

function routeHTML(){
  var d = state.routeData;
  if (!d) return '<div class="spin">Loading route…</div>';
  var t = d.trip || {};
  var counts = { Delivered:0, 'Not Delivered':0, Pending:0, other:0 };
  d.orders.forEach(function(o){
    if (counts[o.status] != null) counts[o.status]++; else counts.other++;
  });

  var html = '<div class="card">' +
    '<div class="row"><div class="grow"><div class="ttl">' + esc(cleanName(t.daName) || 'Unassigned') + '</div>' +
      '<div class="mut">' + esc(d.code) + (t.vehicleNo ? ' · ' + esc(t.vehicleNo) : '') + '</div>' +
      '<div class="fnt">Out ' + esc(t.tripStart || '—') +
        (t.tripEnd ? ' · back ' + esc(t.tripEnd) : ' · still out') + '</div></div>' +
      callBtn(t.daPhone) + '</div>' +
    (t.note ? '<div class="mut" style="margin-top:8px;">Note: ' + esc(t.note) + '</div>' : '') +
    (!t.tripEnd && t.tripStart ? '<div class="row" style="margin-top:10px;"><span class="fnt grow">DA out of no-proof deliveries? ' +
      'Allow him one more.</span><button class="btn sm ghost" data-a="pod-allow" data-code="' + esc(d.code) + '">Allow one more</button></div>' : '') +
    '</div>' +
    '<div class="stats">' +
      st('Delivered', counts.Delivered, '', 'good') +
      st('Failed', counts['Not Delivered'], '', counts['Not Delivered'] ? 'bad' : '') +
    '</div>';

  html += '<div class="sec">' + d.orders.length + ' stops</div>';
  html += d.orders.map(function(o){
    var failed = o.status === 'Not Delivered';
    return '<div class="card" style="padding:11px 12px;' + (failed ? 'background:var(--red-bg);' : '') + '">' +
      '<div class="row">' +
        '<div class="seq">' + (o.sequence || '—') + '</div>' +
        '<div class="grow"><div class="ttl trunc" style="font-size:14px;">' + esc(o.partyName || o.invoiceNo) + '</div>' +
          '<div class="fnt">' + esc(o.invoiceNo) + (o.area ? ' · ' + esc(o.area) : '') + '</div></div>' +
        badge(o.status || 'Pending') +
      '</div>' +
      (o.reason ? '<div class="mut" style="margin-top:6px;">' + esc(o.reason) + '</div>' : '') +
      (o.issueType ? '<div class="mut" style="margin-top:6px;">' + badge(o.issueType, 'b-warn') + ' ' +
                     esc(o.issueDetails || '') + '</div>' : '') +
      (o.floorStatus ? '<div class="fnt" style="margin-top:6px;">' + esc(o.floorStatus) +
                       (o.movedTo ? ' → ' + esc(o.movedTo) : '') + '</div>' : '') +
      (o.markedAt ? '<div class="fnt" style="margin-top:4px;">' + esc(o.markedAt) + '</div>' : '') +
      podRow(o) +
      (o.phone || o.proof
        ? '<div class="row" style="margin-top:8px;">' + callBtn(o.phone, 'Shop') + '<span class="grow"></span>' +
          (o.proof ? '<a class="link" href="' + esc(o.proof) + '" target="_blank">Photo ›</a>' : '') + '</div>'
        : '') +
      '</div>';
  }).join('');
  return html;
}

/******************** ORDER LOOKUP ********************/
// Where the order stands now: support's decision (or the supervisor's,
// or pending), who made it and when. Delivered later beats all of it.
function finalBoxHTML(f){
  if (!f) return '';
  var cls, head;
  if (f.deliveredLater) { cls = 'done'; head = 'Delivered later'; }
  else if (f.decision === 'RD') { cls = 'rd'; head = 'Final: Redispatch (RD)'; }
  else if (f.decision === 'Cancel') { cls = 'cx'; head = 'Final: Cancelled'; }
  else { cls = 'pend'; head = 'Decision pending'; }
  var src = f.source === 'Support' ? 'support' : f.source === 'Supervisor' ? 'the supervisor' : 'the returns desk';
  var line = f.deliveredLater
    ? 'Sent again on ' + esc(f.deliveredLater.code) + ' and delivered ' + esc(f.deliveredLater.on) +
      (f.deliveredLater.daName ? ' by ' + esc(f.deliveredLater.daName) : '') + '. Earlier decision: ' + esc(f.decision || 'pending') + '.'
    : esc(f.why || '') + (f.incomplete ? ' (calls not finished)' : '');
  var who = f.pending ? 'Failed on ' + esc(f.day) + ' · support still calling' + (f.attempts ? ' (' + f.attempts + ' call' + (f.attempts > 1 ? 's' : '') + ')' : '')
    : 'Decided by ' + esc(f.by || src) + (f.by && f.by.indexOf('Automatic') !== 0 ? ' (' + src + ')' : '') +
      (f.at ? ' · ' + esc(f.at) : '') + ' · failed on ' + esc(f.day);
  var area = f.deliveredLater ? '' : '<div class="fd-area">Goods: ' + (f.area === 'CANCEL' ? 'CANCEL area' : f.area === 'RD' ? 'RD area' : 'RD area for now') + '</div>';
  return '<div class="fd ' + cls + '"><div class="fd-h">' + head + '</div>' +
    '<div class="fd-l">' + line + '</div><div class="fd-w">' + who + '</div>' + area + '</div>';
}

// Admins can change a final decision - an order auto-cancelled at 9 pm
// sent as RD instead, say. Kept on record with the admin's note.
function overrideHTML(f){
  if (!f || f.deliveredLater || (state.roles || []).indexOf('Admin') === -1) return '';
  if (!state.ovOpen) {
    return '<div style="margin:-4px 0 12px; text-align:right;"><button class="btn sm ghost" data-a="ov-open">Change decision (admin)</button></div>';
  }
  var cur = f.decision || 'pending';
  return '<div class="card" style="padding:12px 14px;">' +
    '<div class="ttl" style="font-size:14px;">Change the decision for ' + esc(f.invoiceNo) + '</div>' +
    '<div class="fnt">Now: ' + esc(cur) + ' \u00b7 failed on ' + esc(f.day) + '</div>' +
    '<input type="text" id="ov-note" style="margin-top:8px;" placeholder="Why? (required, kept on record)" value="' + esc(state.ovNote || '') + '" />' +
    '<div class="row" style="margin-top:9px; gap:8px;">' +
      '<button class="btn sm ghost" data-a="ov-cancel">Close</button><span class="grow"></span>' +
      (f.decision !== 'Cancel' ? '<button class="btn sm red" data-a="ov-go" data-v="Cancel">Make it Cancel</button>' : '') +
      (f.decision !== 'RD' ? '<button class="btn sm" data-a="ov-go" data-v="RD">Make it RD</button>' : '') +
    '</div></div>';
}

function doOverride(res){
  var f = state.lookup && state.lookup.finalDecision;
  var n = document.getElementById('ov-note');
  state.ovNote = n ? n.value : state.ovNote;
  if (!f) return;
  if (String(state.ovNote || '').trim().length < 3) { state.error = 'Write why you are changing it.'; render(); return; }
  state.error = ''; state.updating = true; render();
  api('overrideDecision', { invoiceNo: f.invoiceNo, date: f.day, resolution: res, note: state.ovNote }).then(function(r){
    state.updating = false;
    if (r && r.success) { state.ovOpen = false; state.ovNote = ''; state.note = r.note || 'Changed.'; doLookup(); }
    else { state.error = (r && r.error) || 'Could not change it.'; render(); }
  });
}

function doPodAllow(code){
  state.error = ''; state.updating = true; render();
  api('allowPodSkip', { code: code }).then(function(r){
    state.updating = false;
    if (r && r.success) state.note = r.note || 'Allowed.';
    else state.error = (r && r.error) || 'Could not allow it.';
    render();
  });
}

function lookupHTML(){
  var html = '<div class="card">' +
    '<label class="f" style="margin-top:0;">Order number (last 3 digits are enough)</label>' +
    '<input type="text" id="lk-q" inputmode="numeric" value="' + esc(state.query) + '" placeholder="e.g. 31428" />' +
    '<div style="margin-top:12px;"><button class="btn block" data-a="lookup">Find order</button></div></div>';

  var d = state.lookup;
  if (!d) return html + '<div class="empty">Type an order number to see which route it is on and how it went.</div>';

  (d.warnings || []).forEach(function(w){ html += '<div class="err"><b>\u26A0 Check this order.</b> ' + esc(w) + '</div>'; });
  html += finalBoxHTML(d.finalDecision) + overrideHTML(d.finalDecision);
  var hit = null;
  d.orders.forEach(function(o){ if (o.invoiceNo === d.matchInvoice) hit = o; });
  if (hit) {
    html += '<div class="card">' +
      '<div class="ttl">' + esc(hit.partyName || hit.invoiceNo) + '</div>' +
      '<div class="mut" style="margin-top:3px;">Order ' + esc(hit.invoiceNo) +
        ' · stop ' + (hit.sequence || '—') + (hit.area ? ' · ' + esc(hit.area) : '') + '</div>' +
      '<div style="margin-top:8px;">' + badge(hit.status || 'Pending') + '</div>' +
      (hit.reason ? '<div class="mut" style="margin-top:7px;">' + esc(hit.reason) + '</div>' : '') +
      (hit.issueType ? '<div class="mut" style="margin-top:7px;">' + badge(hit.issueType, 'b-warn') + ' ' +
                       esc(hit.issueDetails || '') + '</div>' : '') +
      (hit.markedAt ? '<div class="fnt" style="margin-top:5px;">Marked ' + esc(hit.markedAt) + '</div>' : '') +
      podRow(hit) +
      '<div class="row" style="margin-top:10px;">' + callBtn(hit.phone, 'Shop') +
        '<span class="grow"></span>' +
        '<button class="btn ghost sm" data-a="items" data-inv="' + esc(hit.invoiceNo) + '">' +
          (state.itemsFor === hit.invoiceNo ? 'Hide items' : 'What was on the bill') + '</button>' +
      '</div>' +
      '</div>';
    html += itemsHTML(hit.invoiceNo);
  }

  var t = d.trip || {};
  html += '<div class="card tap" data-a="route" data-code="' + esc(d.code) + '">' +
    '<div class="row"><div class="grow"><div class="ttl">' + esc(cleanName(t.daName) || 'Unassigned') + '</div>' +
    '<div class="mut">Route ' + esc(d.code) + (t.vehicleNo ? ' · ' + esc(t.vehicleNo) : '') + '</div></div>' +
    callBtn(t.daPhone) + '</div>' +
    '<div class="row" style="margin-top:9px;"><span class="grow"></span><span class="link">Open route ›</span></div></div>';

  if (d.deskCancel && !d.finalDecision) {
    var dc = d.deskCancel;
    html += '<div class="err"><b>Cancelled at the returns desk</b> on ' + esc(dc.at) +
      (dc.by ? ' by ' + esc(dc.by) : '') + ' \u00b7 route ' + esc(dc.code) +
      (dc.note ? '<br>' + esc(dc.note) : '') + '</div>';
  }
  if (d.history && d.history.length > 1) {
    var firstRoute = -1;
    d.history.forEach(function(h, i){ if (firstRoute < 0 && !h.desk) firstRoute = i; });
    // Why it came back matters more than how many times it went out.
    html += '<div class="sec">Sent out before</div>' +
      d.history.map(function(h, i){
        var cls = h.outcome === 'Delivered' ? 'b-ok'
                : (h.outcome === 'Never marked' ? 'b-grey' : 'b-bad');
        return '<div class="card" style="padding:11px 13px;">' +
          '<div class="row"><div class="grow"><span class="ttl" style="font-size:14px;">' +
            esc(h.code) + '</span>' + (h.desk ? ' <span class="fnt">(returns desk)</span>' : i === firstRoute ? ' <span class="fnt">(current)</span>' : '') +
            '</div>' + badge(h.outcome, cls) + '</div>' +
          '<div class="mut" style="margin-top:4px;">' + esc(h.createdAt) +
            (h.daName ? ' \u00b7 ' + esc(h.daName) : '') +
            (h.markedAt ? ' \u00b7 ' + esc(h.markedAt) : '') + '</div>' +
          (h.why ? '<div style="margin-top:6px;">' + esc(h.why) + '</div>' : '') +
          ((h.photos && h.photos.length ? h.photos : (h.photo ? [h.photo] : [])).length
            ? '<div style="margin-top:7px; display:flex; gap:6px; flex-wrap:wrap;">' +
              (h.photos && h.photos.length ? h.photos : [h.photo]).map(function(p){
                return '<a href="' + esc(p) + '" target="_blank" rel="noopener">' + photoThumb(p) + '</a>';
              }).join('') + '</div>' : '') +
          '</div>';
      }).join('');
  }
  return html;
}

// What was on the bill. Quantities only - no rates, no totals.
function itemsHTML(invoiceNo){
  if (state.itemsFor !== invoiceNo) return '';
  if (state.itemsLoading) return '<div class="card"><div class="mut">Loading items…</div></div>';
  if (state.itemsErr) return '<div class="err">' + esc(state.itemsErr) + '</div>';

  var d = state.items[invoiceNo];
  if (!d) return '';
  if (!d.items.length) return '<div class="card"><div class="mut">No line items recorded.</div></div>';

  return '<div class="card">' +
    '<div class="row" style="margin-bottom:8px;">' +
      '<div class="grow"><div class="ttl" style="font-size:14px;">' + d.lines + ' item' +
        (d.lines === 1 ? '' : 's') + '</div>' +
        (d.totalPieces ? '<div class="fnt">' + d.totalPieces + ' pieces in total</div>' : '') +
      '</div></div>' +
    d.items.map(function(it){
      // The headline number is what is physically on the vehicle. How
      // it was sold - "2 x Pack of 12" - sits underneath as the working.
      var detail = [];
      if (it.qty && it.variant) detail.push(it.qty + ' \u00D7 ' + it.variant);
      else if (it.variant) detail.push(it.variant);
      else if (it.qty && it.packQty) detail.push(it.qty + ' \u00D7 pack of ' + it.packQty);
      else if (it.qty) detail.push(it.qty + ' \u00D7');
      if (it.uom) detail.push(it.uom);
      var total = it.pieces || it.qty || 0;
      return '<div class="row" style="padding:7px 0; border-top:1px solid var(--border);">' +
        '<div class="grow"><div style="font-weight:600; font-size:13.5px;">' + esc(it.product) + '</div>' +
        (it.code ? '<div class="fnt">' + esc(it.code) + '</div>' : '') +
        (detail.length ? '<div class="fnt">' + esc(detail.join(' \u00B7 ')) + '</div>' : '') + '</div>' +
        (total ? '<div style="text-align:right; flex:0 0 auto;">' +
                   '<div style="font-size:17px; font-weight:750; line-height:1.1;">' + total + '</div>' +
                   '<div class="fnt">pcs</div></div>'
               : '') +
        '</div>';
    }).join('') +
    '</div>';
}

// Proof of delivery, where a dispute is actually settled: the photo of
// the goods, the shopkeeper's signature, or why neither exists.
function podRow(o){
  if (String(o.status || '') !== 'Delivered') return '';
  var shots = [];
  (o.podPhotos || []).forEach(function(u, i){
    shots.push({ url: u, label: (o.podPhotos.length > 1 ? 'Goods ' + (i + 1) : 'Goods') });
  });
  if (o.podSignature) shots.push({ url: o.podSignature, label: 'Signature' });

  if (!shots.length) {
    return '<div style="margin-top:8px;">' + badge('No proof', 'b-warn') +
      (o.podSkip ? ' <span class="fnt">' + esc(o.podSkip) + '</span>' : '') + '</div>';
  }

  return '<div class="row" style="margin-top:8px; gap:8px;">' +
    shots.map(function(x){
      return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener" ' +
        'style="text-align:center; text-decoration:none;">' + photoThumb(x.url) +
        '<div class="fnt">' + esc(x.label) + '</div></a>';
    }).join('') + '<span class="grow"></span></div>';
}

/******************** FIND A PRODUCT ON A VAN ********************/
// Asked standing at the loading bay: a line has run short, or a batch
// has to come back off. The answer has to name the stops, because the
// next thing that happens is someone opening those crates.
function productHTML(){
  var html = '<div class="card">' +
    '<label class="f" style="margin-top:0;">Route code</label>' +
    '<input type="text" id="pr-code" value="' + esc(state.prodCode) + '" placeholder="e.g. KY6MHV" />' +
    '<label class="f">Product</label>' +
    '<input type="text" id="pr-q" value="' + esc(state.prodQuery) + '" placeholder="coca cola 250" />' +
    '<div style="margin-top:12px;"><button class="btn block" data-a="p-find">Search this van</button></div>' +
    '</div>';

  if (state.prodErr) html += '<div class="err">' + esc(state.prodErr) + '</div>';

  var d = state.prodData;
  if (!d) return html + '<div class="empty">Enter a van’s code and part of a product name. ' +
    'Half the name is enough.</div>';

  if (d.unsearchable && d.unsearchable.length) {
    return html + '<div class="err">' + esc(d.unsearchable[0].code) +
      ' has no item list saved, so this van could not be searched. ' +
      'That is not the same as it having none.</div>';
  }

  if (!d.routes.length) {
    var sug = (d.suggestions || []).length
      ? '<div class="card"><label class="f" style="margin-top:0;">Loaded products with a similar name</label>' +
        d.suggestions.map(function(x){
          return '<div style="margin-top:6px;"><button class="btn ghost sm block" ' +
            'data-a="p-try" data-v="' + esc(x) + '">' + esc(x) + '</button></div>';
        }).join('') + '</div>'
      : '';
    return html + '<div class="empty">Nothing on ' + esc(state.prodCode.toUpperCase()) +
      ' matches that.</div>' + sug;
  }

  var r = d.routes[0];
  html += '<div class="card"><div class="ttl">' + esc(r.code) + '</div>' +
    '<div class="mut" style="margin-top:3px;">' + r.orders.length + ' order' +
    (r.orders.length === 1 ? '' : 's') + ' · ' + r.pieces + ' piece' +
    (r.pieces === 1 ? '' : 's') + ' on board</div>' +
    (r.partial ? '<div class="fnt" style="margin-top:6px;">Only ' + r.covered + ' of ' +
                 r.total + ' orders on this van have an item list.</div>' : '') +
    '</div>';

  html += r.orders.map(function(o){
    return '<div class="card">' +
      '<div class="ttl">' + esc(o.shop || o.invoiceNo) + '</div>' +
      '<div class="mut" style="margin-top:3px;">Stop ' + (o.sequence || '—') +
        ' · ' + esc(o.invoiceNo) + (o.area ? ' · ' + esc(o.area) : '') + '</div>' +
      o.lines.map(function(l){
        return '<div style="margin-top:7px;">' + esc(l.product) +
          (l.variant ? ' <span class="fnt">' + esc(l.variant) + '</span>' : '') +
          ' <span class="mut">×' + l.qty + '</span>' +
          ' <span class="fnt">(' + l.pieces + ' pcs)</span></div>';
      }).join('') +
      '</div>';
  }).join('');

  return html;
}

function doProductSearch(){
  var c = document.getElementById('pr-code');
  var q = document.getElementById('pr-q');
  if (c) state.prodCode = c.value;
  if (q) state.prodQuery = q.value;

  state.prodErr = '';
  if (!String(state.prodCode).trim()){ state.prodErr = 'Enter the route code first.'; render(); return; }
  if (!String(state.prodQuery).trim()){ state.prodErr = 'Type part of a product name.'; render(); return; }

  state.loading = true; render();
  api('findProduct', { code: state.prodCode, query: state.prodQuery, date: state.date })
    .then(function(res){
      state.loading = false;
      if (res && res.success) state.prodData = res;
      else { state.prodData = null; state.prodErr = (res && res.error) || 'Could not search.'; }
      render();
    });
}

/******************** LEFT ON FLOOR ********************/
function floorHTML(d){
  var html = '';
  if (state.flErr) html += '<div class="err">' + esc(state.flErr) + '</div>';
  if (state.flMsg) html += '<div class="ok">' + esc(state.flMsg) + '</div>';

  html += '<div class="card"><label class="f" style="margin-top:0;">Log orders left behind</label>' +
    '<textarea id="fl-text" placeholder="One order number per line"></textarea>' +
    '<label class="f">Why (optional)</label>' +
    '<input type="text" id="fl-note" placeholder="e.g. vehicle full" />' +
    '<div style="margin-top:12px;"><button class="btn block" data-a="fl-log">Log on floor</button></div></div>';

  if (!d) return html;
  var on = d.floor.filter(function(x){ return x.status === 'On floor'; });
  var sent = d.floor.filter(function(x){ return x.status === 'Sent'; });

  if (!d.floor.length) return html + '<div class="empty">Nothing on the floor today.</div>';

  // Everything logged today and who logged it - the floor is where
  // orders go missing, so the name against each one matters.
  var byUser = {};
  d.floor.forEach(function(x){
    var k = cleanName(x.loggedBy) || 'Unknown';
    if (!byUser[k]) byUser[k] = { name: k, total: 0, waiting: 0, sent: 0 };
    byUser[k].total++;
    if (x.status === 'On floor') byUser[k].waiting++; else byUser[k].sent++;
  });
  var users = Object.keys(byUser).map(function(k){ return byUser[k]; })
    .sort(function(a, b){ return b.total - a.total || a.name.localeCompare(b.name); });

  html += '<div class="card"><div class="row" style="margin-bottom:4px;">' +
    '<div class="grow"><div class="ttl" style="font-size:15px;">' + d.floor.length +
      ' order' + (d.floor.length === 1 ? '' : 's') + ' logged today</div>' +
    '<div class="fnt">' + on.length + ' still waiting · ' + sent.length + ' sent back out</div>' +
    '</div></div>' +
    users.map(function(u){
      return '<div class="row" style="padding:7px 0; border-top:1px solid var(--border);">' +
        '<div class="grow" style="font-weight:600; font-size:13.5px;">' + esc(u.name) +
          '<div class="fnt">' + u.waiting + ' waiting · ' + u.sent + ' sent</div></div>' +
        '<div class="seq" style="width:auto; padding:0 9px;">' + u.total + '</div>' +
        '</div>';
    }).join('') + '</div>';

  if (on.length) {
    var picked = Object.keys(state.flSel).filter(function(k){ return state.flSel[k]; });
    html += '<div class="sec">' + on.length + ' waiting</div>';
    html += on.map(function(x){
      return '<div class="card" style="padding:11px 12px;"><div class="row">' +
        '<input class="pick" type="checkbox" data-a="fl-pick" data-id="' + esc(x.entryId) + '"' +
          (state.flSel[x.entryId] ? ' checked' : '') + ' />' +
        '<div class="grow"><div class="ttl trunc" style="font-size:14px;">' + esc(x.shop || x.invoiceNo) + '</div>' +
        '<div class="fnt">' + esc(x.invoiceNo) + (x.area ? ' · ' + esc(x.area) : '') +
          ' · off ' + esc(x.fromCode) + '</div>' +
        (x.repeat > 1 ? '<div class="fnt">' + badge('Left ' + x.repeat + ' times', 'b-warn') + '</div>' : '') +
        '</div>' + callBtn(x.phone, 'Shop') + '</div>' +
        '<div class="row" style="margin-top:7px;"><span class="fnt grow">by ' + esc(cleanName(x.loggedBy)) +
          ', ' + esc(x.loggedAt) + '</span>' +
          '<button class="btn ghost sm" data-a="fl-undo" data-id="' + esc(x.entryId) + '">Undo</button></div>' +
        '</div>';
    }).join('');

    if (picked.length) {
      html += '<div class="card"><div class="ttl" style="font-size:14px;">' + picked.length +
        ' selected</div>' +
        '<label class="f">Send on</label>' +
        '<select id="fl-target"><option value="">A new quick route</option>' +
        (d.openRoutes || []).map(function(r){
          return '<option value="' + esc(r.code) + '">' + esc(r.code) + ' — ' +
            esc(cleanName(r.daName) || (r.started ? 'unassigned' : 'not started yet')) +
            (r.vehicleNo ? ' (' + esc(r.vehicleNo) + ')' : '') + '</option>';
        }).join('') + '</select>' +
        '<div style="margin-top:12px;"><button class="btn block" data-a="fl-send">Send these out</button></div></div>';
    }
  }

  if (sent.length) {
    html += '<div class="sec">' + sent.length + ' sent back out</div>';
    html += sent.map(function(x){
      return '<div class="card" style="padding:10px 12px;"><div class="row">' +
        '<div class="grow"><div class="trunc" style="font-weight:600;">' + esc(x.shop || x.invoiceNo) + '</div>' +
        '<div class="fnt">' + esc(x.invoiceNo) + ' · ' + esc(x.fromCode) + ' → ' + esc(x.newCode) + '</div>' +
        '<div class="fnt">logged by ' + esc(cleanName(x.loggedBy) || 'unknown') +
          ', ' + esc(x.loggedAt) + '</div></div>' +
        badge('Sent', 'b-ok') + '</div></div>';
    }).join('');
  }

  html += '<button class="btn ghost block" data-a="tab-quick" style="margin-top:10px;">Build a quick route</button>';
  return html;
}

/******************** QUICK ROUTE ********************/
function quickHTML(){
  var html = '';
  if (state.qkErr) html += '<div class="err">' + esc(state.qkErr) + '</div>';
  if (state.qkMsg) html += '<div class="ok">' + esc(state.qkMsg) + '</div>';

  html += '<div class="card">' +
    '<div class="mut" style="margin-bottom:10px;">Orders that have been on a manifest before. Anything still ' +
    'sitting on another route is pulled off it.</div>' +
    '<label class="f" style="margin-top:0;">Order numbers</label>' +
    '<textarea id="qk-text" placeholder="One per line">' + esc(state.qkText) + '</textarea>' +
    '<div style="margin-top:12px;"><button class="btn block" data-a="qk-find">Find these orders</button></div></div>';

  if (!state.qkOrders) return html;
  if (!state.qkOrders.length) return html + '<div class="empty">Nothing found.</div>';

  var picked = state.qkOrders.filter(function(o){ return state.qkSel[o.invoiceNo]; });
  html += '<div class="sec">' + state.qkOrders.length + ' found</div>';
  html += state.qkOrders.map(function(o){
    return '<div class="card" style="padding:11px 12px;' + (o.blocked ? 'opacity:0.55;' : '') + '"><div class="row">' +
      (o.blocked ? '<span class="seq">✖</span>'
                 : '<input class="pick" type="checkbox" data-a="qk-pick" data-id="' + esc(o.invoiceNo) + '"' +
                   (state.qkSel[o.invoiceNo] ? ' checked' : '') + ' />') +
      '<div class="grow"><div class="ttl trunc" style="font-size:14px;">' + esc(o.partyName || o.invoiceNo) + '</div>' +
      '<div class="fnt">' + esc(o.invoiceNo) + (o.area ? ' · ' + esc(o.area) : '') + '</div>' +
      (o.blocked ? '<div class="fnt">' + badge(o.why || 'Not available', 'b-bad') + '</div>'
                 : (o.onOtherRoute ? '<div class="fnt">' + badge('On ' + o.onOtherRoute, 'b-warn') + '</div>' : '')) +
      (o.hasLocation ? '' : '<div class="fnt">' + badge('No map pin', 'b-grey') + '</div>') +
      '</div></div></div>';
  }).join('');

  if (picked.length) {
    html += '<button class="btn block" data-a="qk-create">Create route with ' + picked.length +
      ' order' + (picked.length === 1 ? '' : 's') + '</button>';
  }
  return html;
}

/******************** EVENTS ********************/
function bind(){
  var app = document.getElementById('app');
  app.onclick = onClick;
  app.onchange = onChange;
  ['lg-name','lg-pin'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.onkeydown = function(ev){ if (ev.key === 'Enter') doLogin(); };
  });
  var dq = document.getElementById('dk-q');
  if (dq) dq.onkeydown = function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); dkFind(); } };
  var df = document.getElementById('dk-file');
  if (df) df.onchange = function(){
    var f = df.files && df.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ dkShrink(r.result, dkAddPhoto); };
    r.readAsDataURL(f);
    try { df.value = ''; } catch(e){}
  };
  var q = document.getElementById('lk-q');
  if (q) q.onkeydown = function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); doLookup(); } };

  // Route code first, then the product - the order someone standing at
  // a van actually has them in.
  var pc = document.getElementById('pr-code');
  var pq = document.getElementById('pr-q');
  if (pc) pc.onkeydown = function(ev){
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    state.prodCode = pc.value;
    if (pq && !String(pq.value).trim()) { pq.focus(); return; }
    doProductSearch();
  };
  if (pq) pq.onkeydown = function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); doProductSearch(); }
  };
}

function onChange(ev){
  var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
  if (!el) return;
  var a = el.getAttribute('data-a');
  if (a === 'fl-pick'){ state.flSel[el.getAttribute('data-id')] = el.checked; render(); }
  if (a === 'qk-pick'){ state.qkSel[el.getAttribute('data-id')] = el.checked; render(); }
  if (a === 'as-to'){ asCapture(); state.asSwap = null; }
}

function onClick(ev){
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a');
  if (a === 'fl-pick' || a === 'qk-pick') return;   // handled on change

  if (a === 'login')   { doLogin(); return; }
  if (a === 'logout')  { doLogout(false); return; }
  if (a === 'refresh') { state.error = ''; state.note = ''; reload(); return; }
  if (a === 'back')    { goTab(state.view === 'quick' ? 'floor' : 'routes'); return; }
  if (a === 'as-switch')    { state.asConfirm = true; render(); return; }
  if (a === 'as-switch-no') { state.asConfirm = false; render(); return; }
  if (a === 'as-switch-yes'){
    var turnOn = !(state.data.assign && state.data.assign.on);
    state.asConfirm = false; state.updating = true; state.error = ''; render();
    api('setRouteAssign', { on: turnOn }).then(function(r){
      state.updating = false;
      if (r && r.success) { state.data.assign = r; state.loadedAt.assign = Date.now(); state.note = r.note || ''; }
      else state.error = (r && r.error) || 'Could not change it.';
      render();
    });
    return;
  }
  if (a === 'ov-open')   { state.ovOpen = true; state.ovNote = ''; render(); return; }
  if (a === 'ov-cancel') { state.ovOpen = false; render(); return; }
  if (a === 'ov-go')     { doOverride(el.getAttribute('data-v')); return; }
  if (a === 'pod-allow') { doPodAllow(el.getAttribute('data-code')); return; }
  if (a === 'as-move')   { asCapture(); state.asMove = el.getAttribute('data-code'); state.asTo = ''; state.asWhy = ''; state.asSwap = null; state.error = ''; render(); return; }
  if (a === 'as-cancel') { state.asMove = null; state.asSwap = null; state.error = ''; render(); return; }
  if (a === 'as-go')     { asMove(el.getAttribute('data-code'), false); return; }
  if (a === 'as-swap')   { asMove(state.asSwap.code, true); return; }
  if (a === 'as-release'){ asRelease(); return; }

  if (a === 'tab')       { goTab(el.getAttribute('data-v')); return; }
  if (a === 'tab-fails') { goTab('fails'); return; }
  if (a === 'tab-routes'){ goTab('routes'); return; }
  if (a === 'tab-quick') { goTab('quick'); return; }

  if (a === 'route')   { openRoute(el.getAttribute('data-code')); return; }
  if (a === 'lookup')  { doLookup(); return; }
  if (a === 'p-find')  { doProductSearch(); return; }
  if (a === 'p-try')   {
    state.prodQuery = el.getAttribute('data-v');
    var pqEl = document.getElementById('pr-q');
    if (pqEl) pqEl.value = state.prodQuery;
    doProductSearch(); return;
  }
  if (a === 'items')   { toggleItems(el.getAttribute('data-inv')); return; }
  if (a === 'fail-f')  { state.failFilter = el.getAttribute('data-v'); render(); return; }

  if (a === 'fl-log')  { doFloorLog(); return; }
  if (a === 'fl-send') { doFloorSend(); return; }
  if (a === 'fl-undo') { doFloorUndo(el.getAttribute('data-id')); return; }
  if (a === 'qk-find') { doQuickFind(); return; }
  if (a === 'qk-create'){ doQuickCreate(); return; }
  if (a === 'dk-find')  { dkFind(); return; }
  if (a === 'dk-type')  { dkCapture(); state.dk.type = el.getAttribute('data-v'); state.error = ''; render(); return; }
  if (a === 'dk-cam')   { dkCapture(); state.error = ''; scamOpen(); return; }
  if (a === 'dk-photo-x'){ dkCapture(); state.dk.photos.splice(Number(el.getAttribute('data-i')), 1); render(); return; }
  if (a === 'dk-save')  { dkSave(); return; }
  if (a === 'dk-retry') { dkRetry(el.getAttribute('data-k')); return; }
  if (a === 'dk-mode')  { var keepL = state.dk.list; state.dk.mode = el.getAttribute('data-v'); dkReset(false);
                          state.dk.list = keepL; state.error = ''; render();
                          var qi = document.getElementById('dk-q'); if (qi) qi.focus(); return; }
  if (a === 'dk-xadd')  { dkCapture(); state.dk.extra.push({ name: '', qty: '' }); render();
                          var xs = document.querySelectorAll('[data-dk-xname]'); if (xs.length) xs[xs.length - 1].focus(); return; }
  if (a === 'dk-xdel')  { dkCapture(); state.dk.extra.splice(Number(el.getAttribute('data-i')), 1);
                          if (!state.dk.extra.length) state.dk.extra.push({ name: '', qty: '' }); render(); return; }
  if (a === 'dk-drop')  { dkDrop(el.getAttribute('data-k')); return; }
  if (a === 'dk-forcerd') {
    var so = el.getAttribute('data-so');
    var why = window.prompt ? window.prompt('Why does SO ' + so + ' go as RD?') : '';
    if (!why || why.trim().length < 3) { state.error = 'Write why it goes as RD.'; render(); return; }
    state.updating = true; render();
    api('deskForceRd', { soNo: so, note: why }).then(function(r){
      state.updating = false;
      if (r && r.success) state.note = r.note || 'Moved to RD.'; else state.error = (r && r.error) || 'Could not move it.';
      dkLoadList(); render();
    });
    return;
  }
  if (a === 'dk-rm-cancel') { state.dkRemove = null; render(); return; }
  if (a === 'dk-rm-go')     { dkRemoveGo(); return; }
  if (a === 'dk-undo')  { dkUndo(el.getAttribute('data-id')); return; }
  if (a === 'dk-pdf')   { dkPdf(); return; }
}

function val(id){ var e = document.getElementById(id); return e ? e.value : ''; }

function goTab(v){
  if (!v) return;
  state.view = v; state.error = ''; state.note = '';
  if (v !== 'route') state.routeCode = null;
  load(false);
}

/******************** LOADING ********************/
function load(force, done){
  var v = state.view;
  var finish = function(ok){ if (typeof done === 'function') done(ok); };
  if (v === 'route' || v === 'lookup' || v === 'quick' || v === 'product'){
    render(); finish(true); return;
  }
  if (v === 'desk'){ render(); dkLoadList(); finish(true); return; }
  // A screen already loaded shows at once; a fresh copy follows when
  // asked for (Refresh), or quietly if it is more than a minute old.
  if (!force && state.data[v] && Date.now() - (state.loadedAt[v] || 0) < 60000){ render(); finish(true); return; }

  var map = {
    home:   { call:'getSupHome',     payload:{ date:state.date } },
    fails:  { call:'getSupFailures', payload:{ date:state.date } },
    routes: { call:'getSupRoutes',   payload:{ date:state.date } },
    assign: { call:'getAssignBoard', payload:{} },
    floor:  { call:'getFloor',       payload:{} }
  };
  var m = map[v];
  if (!m){ render(); finish(true); return; }
  if (v === 'floor') state.flSel = {};

  // Refresh reads fresh on the server too, past its short memory.
  var payload = Object.assign({}, m.payload);
  if (state.freshNext) payload.fresh = true;
  state.freshNext = false;
  // Already on screen: keep showing it while the new copy comes.
  var had = !!state.data[v];
  if (had) { state.updating = true; render(); }
  else { state.loading = true; render(); }
  api(m.call, payload).then(function(res){
    state.loading = false; state.updating = false;
    if (res && res.success) {
      state.data[v] = res; state.loadedAt[v] = Date.now(); state.savedAt[v] = 0;
      keepCopy(v, res);
    }
    else if (!had) state.error = (res && res.error) || 'Could not load that.';
    if (state.view === v) render();
    finish(!!(res && res.success));
  });
}

function reload(){
  if (state.view === 'route'){ openRoute(state.routeCode); return; }
  if (state.view === 'lookup'){ if (state.query) doLookup(); else render(); return; }
  if (state.view === 'quick'){ render(); return; }
  if (state.view === 'product'){ if (state.prodQuery) doProductSearch(); else render(); return; }
  if (state.view === 'desk'){ dkCapture(); render(); dkLoadList(); return; }
  // The alert counts in the tab bar come from home, so keep it fresh
  // whichever screen the refresh was tapped on.
  // What is on screen stays there until the new copy arrives.
  state.freshNext = true;
  load(true);
  if (state.view !== 'home') {
    api('getSupHome', { date:state.date, fresh:true }).then(function(res){
      if (res && res.success){ state.data.home = res; render(); }
    });
  }
}

function doLogin(){
  var name = val('lg-name').trim(), pin = val('lg-pin').trim();
  if (!name || !pin){ state.error = 'Enter your login name and PIN.'; render(); return; }
  state.loading = true; state.error = ''; render();

  // Signing in and loading the alerts both read sheet, and a phone on
  // a weak signal makes that slow. One card with the steps beats a
  // blank screen the supervisor cannot interpret.
  bootBegin(['dashLogin', 'firstScreen'], ['Signing in', 'Loading alerts']);

  api('dashLogin', { loginName:name, pin:pin }).then(function(res){
    state.loading = false;
    if (!res || !res.success){
      bootEnd(false, (res && res.error) || 'Could not sign in.');
      state.error = (res && res.error) || 'Could not sign in.'; render(); return;
    }
    var roles = res.roles || (res.role ? [res.role] : []);
    if (roles.indexOf('Supervisor') === -1 && roles.indexOf('Admin') === -1){
      bootEnd(false, 'This app is for supervisors.');
      state.error = 'This app is for supervisors. Use the Control Room dashboard instead.';
      render(); return;
    }
    state.token = res.token; state.name = res.name; state.roles = roles;
    save();
    state.view = 'home';
    if (res.initial && res.initial.view === 'suphome' && res.initial.data){
      state.data.home = res.initial.data;
      ldEnd(ldStart('firstScreen', 'Loading alerts'), true);
      render();
    } else {
      var fh = ldStart('firstScreen', 'Loading alerts');
      load(true, function(ok){ ldEnd(fh, ok); });
    }
  });
}

// Home, Failures and Routes keep themselves current: every 5 minutes,
// quietly, while the app is open and in view. Never while someone is
// typing, and never on the floor or desk screens, which hold half-done work.
var AUTO_VIEWS = { home: 1, fails: 1, routes: 1, assign: 1 };
setInterval(function(){
  if (!state.token || state.loading || document.hidden || !AUTO_VIEWS[state.view]) return;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  load(true);
}, 5 * 60 * 1000);

function doLogout(expired){
  var t = state.token;
  state.token = ''; state.name = ''; state.roles = []; state.data = {};
  state.routeCode = null; state.routeData = null; state.lookup = null;
  state.error = expired ? 'Signed out — please sign in again.' : '';
  try { var ss = supStore(); if (ss) ss.removeItem('bm_sup'); } catch(e){}
  dropCopies();
  render();
  if (t && !expired) api('dashLogout', { token:t });
}

// Survives the phone's back button and a page reload, so a supervisor
// walking the floor is not asked for his PIN every few minutes.
// The last copy of each main screen stays on the phone, so opening the
// app shows it at once while the server works out the new one. Only
// today's copy is used; a copy from yesterday would mislead.
var COPY_VIEWS = { home:1, fails:1, routes:1 };
function keepCopy(v, res){
  if (!COPY_VIEWS[v] || !BM_HOSTED) return;
  try {
    var txt = JSON.stringify({ date: state.date, at: Date.now(), data: res });
    if (txt.length > 400000) return;
    localStorage.setItem('bm_sup_copy_' + v, txt);
  } catch(e){}
}
function restoreCopies(){
  if (!BM_HOSTED) return;
  Object.keys(COPY_VIEWS).forEach(function(v){
    try {
      var c = JSON.parse(localStorage.getItem('bm_sup_copy_' + v) || 'null');
      if (c && c.date === state.date && c.data && c.data.success) {
        state.data[v] = c.data; state.loadedAt[v] = 0; state.savedAt[v] = c.at;
      }
    } catch(e){}
  });
}
function dropCopies(){
  Object.keys(COPY_VIEWS).forEach(function(v){
    try { localStorage.removeItem('bm_sup_copy_' + v); } catch(e){}
  });
}

function save(){
  try {
    supStore().setItem('bm_sup', JSON.stringify({
      token:state.token, name:state.name, roles:state.roles
    }));
  } catch(e){}
}

function openRoute(code){
  if (!code) return;
  state.view = 'route'; state.routeCode = code; state.routeData = null;
  state.error = ''; state.note = '';
  render();
  api('getRouteDetail', { code:code }).then(function(res){
    if (state.routeCode !== code) return;
    if (res && res.success) state.routeData = res;
    else state.error = (res && res.error) || 'Could not load the route.';
    render();
  });
}

function doLookup(){
  var q = val('lk-q').trim() || state.query;
  if (!q){ state.error = 'Enter an order number.'; render(); return; }
  state.query = q; state.loading = true; state.error = '';
  state.itemsFor = ''; state.itemsErr = '';
  render();
  api('trackOrder', { query:q }).then(function(res){
    state.loading = false;
    if (res && res.success) state.lookup = res;
    else { state.lookup = null; state.error = (res && res.error) || 'Nothing found.'; }
    render();
  });
}

function toggleItems(inv){
  if (!inv) return;
  if (state.itemsFor === inv){ state.itemsFor = ''; render(); return; }
  state.itemsFor = inv; state.itemsErr = '';
  if (state.items[inv]){ render(); return; }

  state.itemsLoading = true; render();
  api('getInvoiceItems', { invoiceNo: inv }).then(function(res){
    state.itemsLoading = false;
    if (res && res.success) state.items[inv] = res;
    else state.itemsErr = (res && res.error) || 'Could not load the items.';
    render();
  });
}

function doFloorLog(){
  var text = val('fl-text').trim();
  if (!text){ state.flErr = 'Enter at least one order number.'; render(); return; }
  state.loading = true; state.flErr = ''; state.flMsg = ''; render();
  api('floorLog', { text:text, note:val('fl-note') }).then(function(res){
    state.loading = false;
    if (res && res.success){
      state.flMsg = (res.resolved ? res.resolved.length : 0) + ' order(s) taken off the route and logged on the floor.' +
        (res.overrode && res.overrode.length ? ' ' + res.overrode.map(function(x){ return x.invoiceNo + ': ' + x.why; }).join('; ') + '.' : '') +
        (res.skipped && res.skipped.length ? ' ' + res.skipped.map(function(x){ return x.invoiceNo + ' ' + x.why; }).join('; ') + '.' : '') +
        (res.unknown && res.unknown.length ? ' Not on a route today: ' + res.unknown.join(', ') + '.' : '');
      state.data.floor = null; state.data.home = null;
      load(true);
    } else {
      state.flErr = (res && res.error) || 'Could not log those.';
      render();
    }
  });
}

function doFloorSend(){
  var ids = Object.keys(state.flSel).filter(function(k){ return state.flSel[k]; });
  if (!ids.length) return;
  var target = val('fl-target');
  state.loading = true; state.flErr = ''; state.flMsg = ''; render();
  api('floorSend', {
    entryIds:ids,
    mode: target ? 'existing' : 'new',
    targetCode: target
  }).then(function(res){
    state.loading = false;
    if (res && res.success){
      state.flMsg = ids.length + ' order(s) sent out on ' + (res.code || target) + '.';
      state.flSel = {}; state.data.floor = null; state.data.home = null;
      load(true);
    } else {
      state.flErr = (res && res.error) || 'Could not send those.';
      render();
    }
  });
}

function doFloorUndo(id){
  if (!id) return;
  state.loading = true; state.flErr = ''; state.flMsg = ''; render();
  api('floorUndo', { entryId:id }).then(function(res){
    state.loading = false;
    if (res && res.success){
      state.flMsg = 'Put back on its original route.';
      delete state.flSel[id];
      state.data.floor = null; state.data.home = null;
      load(true);
    } else {
      state.flErr = (res && res.error) || 'Could not undo that.';
      render();
    }
  });
}

function doQuickFind(){
  var text = val('qk-text').trim();
  if (!text){ state.qkErr = 'Enter at least one order number.'; render(); return; }
  state.qkText = text;
  state.loading = true; state.qkErr = ''; state.qkMsg = ''; render();
  api('quickPreview', { text:text }).then(function(res){
    state.loading = false;
    if (res && res.success){
      state.qkOrders = res.orders || [];
      state.qkSel = {};
      state.qkOrders.forEach(function(o){ if (!o.blocked) state.qkSel[o.invoiceNo] = true; });
      if (res.unknown && res.unknown.length) state.qkErr = 'Not found: ' + res.unknown.join(', ');
    } else {
      state.qkOrders = null;
      state.qkErr = (res && res.error) || 'Nothing found.';
    }
    render();
  });
}

function doQuickCreate(){
  var picked = Object.keys(state.qkSel).filter(function(k){ return state.qkSel[k]; });
  if (!picked.length) return;
  state.loading = true; state.qkErr = ''; state.qkMsg = ''; render();
  api('quickCreate', { invoiceNos:picked }).then(function(res){
    state.loading = false;
    if (res && res.success){
      state.qkMsg = 'Route ' + res.code + ' created with ' + res.count + ' order(s).' +
        (res.movedOff ? ' ' + res.movedOff + ' pulled off other routes.' : '');
      state.qkOrders = null; state.qkSel = {}; state.qkText = '';
      state.data.floor = null; state.data.home = null; state.data.routes = null;
    } else {
      state.qkErr = (res && res.error) || 'Could not create the route.';
    }
    render();
  });
}

/******************** BOOT ********************/
function boot(){
  state.date = today();
  try {
    var store = supStore();
    var saved = JSON.parse((store && store.getItem('bm_sup')) || 'null');
    if (saved && saved.token){
      state.token = saved.token; state.name = saved.name; state.roles = saved.roles || [];
      state.view = 'home';
      restoreCopies();
      load(true);
      return;
    }
  } catch(e){}
  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
<script>
// Keeps the app on the phone. Registered after load so it never
// slows the first screen down.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
