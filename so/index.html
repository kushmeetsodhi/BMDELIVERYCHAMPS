<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BM SO</title>
<script src="config.js?v=b2a7013414"></script>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  :root{
    --brand:#0E1466; --brand-ink:#FFFFFF; --brand-soft:#C9CDF2;
    --bg:#F3F4F8; --card:#FFFFFF; --ink:#151826; --sub:#5A6075; --faint:#8B91A3; --line:#E2E5EC;
    --field:#FFFFFF;
    --green:#16794A; --green-bg:#E3F4EA;
    --red:#B42323; --red-bg:#FDE2E2;
    --amber:#8A5300; --amber-bg:#FFF1D6;
    --blue:#1B2A8F; --blue-bg:#E3E7FB;
    --shadow:0 1px 2px rgba(20,20,43,0.06), 0 1px 3px rgba(20,20,43,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#151A4D; --brand-soft:#A9AECB;
      --bg:#0F1222; --card:#1A1E33; --ink:#ECEEF7; --sub:#A9AECB; --faint:#7D83A3; --line:#2E3350; --field:#12152A;
      --green:#4ADE80; --green-bg:#16301F; --red:#F87171; --red-bg:#3A1C1C;
      --amber:#FBBF24; --amber-bg:#33290F; --blue:#9DB2FF; --blue-bg:#1E2650;
      --shadow:0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --brand:#151A4D; --brand-soft:#A9AECB;
    --bg:#0F1222; --card:#1A1E33; --ink:#ECEEF7; --sub:#A9AECB; --faint:#7D83A3; --line:#2E3350; --field:#12152A;
    --green:#4ADE80; --green-bg:#16301F; --red:#F87171; --red-bg:#3A1C1C;
    --amber:#FBBF24; --amber-bg:#33290F; --blue:#9DB2FF; --blue-bg:#1E2650;
    --shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
        background:var(--bg); color:var(--ink); font-size:15px; }
  button{ font:inherit; }
  a{ color:inherit; }

  .top{ position:sticky; top:0; z-index:20; background:var(--brand); color:var(--brand-ink);
        padding:calc(14px + env(safe-area-inset-top)) 16px 16px; }
  .top-row{ display:flex; align-items:center; gap:10px; }
  .top h1{ margin:0; font-size:20px; font-weight:700; flex:1; }
  .top .sub{ font-size:13px; color:var(--brand-soft); margin-top:3px; }
  .icon-btn{ width:42px; height:42px; border-radius:21px; border:0; background:rgba(255,255,255,0.13);
             color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; flex:none; }
  .days{ display:flex; gap:8px; margin-top:12px; }
  .day{ flex:1; padding:9px 0; text-align:center; border-radius:10px; background:rgba(255,255,255,0.10);
        color:var(--brand-soft); font-weight:600; font-size:13.5px; border:0; cursor:pointer; }
  .day.on{ background:#fff; color:#0E1466; }

  .page{ padding:14px 14px 40px; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--card); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .tiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .tile{ background:var(--card); border-radius:12px; padding:10px 8px; text-align:center; box-shadow:var(--shadow);
         border:2px solid transparent; cursor:pointer; }
  .tile.on{ border-color:var(--blue); }
  .tile b{ display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .tile span{ font-size:11.5px; color:var(--sub); }
  .tile.bad b{ color:var(--red); } .tile.ok b{ color:var(--green); } .tile.mid b{ color:var(--amber); }

  .order{ display:flex; flex-direction:column; gap:6px; cursor:pointer; }
  .order.failed{ border-left:5px solid var(--red); }
  .row{ display:flex; align-items:center; gap:10px; }
  .grow{ flex:1; min-width:0; }
  .shop{ font-weight:700; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta{ font-size:13px; color:var(--sub); }
  .pill{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .p-bad{ background:var(--red-bg); color:var(--red); } .p-ok{ background:var(--green-bg); color:var(--green); }
  .p-mid{ background:var(--amber-bg); color:var(--amber); } .p-blue{ background:var(--blue-bg); color:var(--blue); }
  .why{ background:var(--red-bg); color:var(--red); border-radius:10px; padding:8px 10px; font-size:13.5px; }
  .note{ font-size:12.5px; color:var(--sub); }
  .ok-line{ color:var(--green); font-size:12.5px; font-weight:600; }
  .warn-line{ color:var(--amber); font-size:12.5px; font-weight:600; }
  .call{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; border-radius:19px;
         background:var(--blue-bg); color:var(--blue); font-weight:700; font-size:13.5px; text-decoration:none; white-space:nowrap; }
  .call.strong{ background:#fff; color:#0E1466; }
  .sec{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin:6px 2px 0; }
  .empty{ text-align:center; color:var(--sub); padding:30px 10px; }
  .err{ background:var(--red-bg); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .okmsg{ background:var(--green-bg); color:var(--green); border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .banner{ background:var(--red); color:#fff; border-radius:12px; padding:11px 13px; font-weight:600; font-size:14px; }

  .hero{ background:var(--brand); color:#fff; padding:4px 16px 18px; display:flex; flex-direction:column; gap:12px; }
  .hero .big{ font-size:23px; font-weight:700; }
  .hero .sub{ color:var(--brand-soft); font-size:13.5px; }
  .da-box{ background:rgba(255,255,255,0.10); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:12px; }
  .photo{ width:100%; max-height:260px; object-fit:cover; border-radius:12px; background:var(--line); display:block; }
  .tl{ display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px 12px; font-size:14px; }
  .tl .t{ color:var(--sub); font-size:12.5px; }
  .items{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px 12px; font-size:14px; }
  .items .q{ color:var(--sub); font-variant-numeric:tabular-nums; }
  .dec{ border-radius:12px; padding:12px; }
  .dec.rd{ background:var(--blue-bg); color:var(--blue); } .dec.cx{ background:var(--red-bg); color:var(--red); }
  .dec.pend{ background:var(--amber-bg); color:var(--amber); } .dec.done{ background:var(--green-bg); color:var(--green); }
  .dec b{ display:block; font-size:15px; margin-bottom:3px; }

  label.f{ display:block; font-size:13px; font-weight:600; color:var(--sub); margin:12px 0 6px; }
  input{ width:100%; height:48px; border-radius:10px; border:1px solid var(--line); background:var(--field);
         color:var(--ink); padding:0 12px; font-size:16px; }
  .btn{ width:100%; height:50px; border-radius:12px; border:0; background:var(--brand); color:#fff; font-weight:700;
        font-size:15.5px; cursor:pointer; }
  :root[data-theme="dark"] .btn{ background:#3B4BC8; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{ background:#3B4BC8; } }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn[disabled]{ opacity:.55; }
  .seg{ display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--bg); border-radius:12px; padding:4px; }
  .seg button{ height:44px; border-radius:9px; border:0; background:transparent; color:var(--sub); font-weight:600; cursor:pointer; }
  .seg button.on{ background:var(--brand); color:#fff; }
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px; }
  .login .card{ width:100%; max-width:380px; padding:26px 20px; }
  .spin{ text-align:center; color:var(--sub); padding:40px 0; }
  .splash{ display:flex; flex-direction:column; align-items:center; padding:64px 28px 0; text-align:center; }
  .sp-logo{ width:64px; height:64px; border-radius:18px; background:var(--accent,#1a237e); color:#fff; font-weight:800; font-size:24px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .sp-title{ font-size:18px; font-weight:700; margin-bottom:18px; }
  .sp-bar{ width:100%; max-width:320px; height:8px; border-radius:6px; background:rgba(127,127,127,.2); overflow:hidden; }
  .sp-bar i{ display:block; height:100%; background:var(--accent,#1a237e); border-radius:6px; transition:width .12s linear; }
  .sp-row{ width:100%; max-width:320px; display:flex; justify-content:space-between; font-size:13px; margin-top:6px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .sp-note{ margin-top:14px; font-size:13px; color:var(--sub); max-width:300px; }
  .fab{ font-size:12px; color:var(--faint); text-align:center; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var BM_HOSTED = !!window.BM_EXEC_URL;
var state = { token:'', name:'', phone:'', view:'login', day:'today', home:null, order:null, filter:'',
              error:'', note:'', loading:false, mustChangePin:false, busy:false };
var REFRESH_MS = 2 * 60 * 1000;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function money(n){ n = Number(n) || 0; return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayStr(){ var d = new Date(); if (state.day === 'yesterday') d.setDate(d.getDate() - 1); return ymd(d); }
function tel(p){ return String(p || '').replace(/[^\d+]/g, ''); }
function store(){ try { return window.localStorage; } catch (e) { return null; } }
function thumb(url, size){
  var m = String(url || '').match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w' + (size || 600) : '';
}

/******************** THEME ********************/
function theme(){ try { return localStorage.getItem('bm_so_theme') || ''; } catch (e) { return ''; } }
function applyTheme(t){
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(t){ try { localStorage.setItem('bm_so_theme', t); } catch (e) {} applyTheme(t); render(); }
applyTheme(theme());
function isDark(){
  var t = theme();
  if (t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

/******************** SERVER ********************/
function api(action, payload){
  return new Promise(function(resolve){
    if (!BM_HOSTED) { resolve({ success:false, error:'This page has no server address set.' }); return; }
    var data = { action: action, token: state.token };
    for (var k in (payload || {})) if (payload.hasOwnProperty(k)) data[k] = payload[k];
    fetch(window.BM_EXEC_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(data), redirect:'follow', credentials:'omit', cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var r;
        try { r = JSON.parse(t); } catch (e) { r = { success:false, error:'The server sent a page instead of an answer.' }; }
        if (r && r.expired) { logout('Please sign in again.'); }
        resolve(r);
      })
      .catch(function(){ resolve({ success:false, error:'No connection. Check your internet and try again.' }); });
  });
}

function saveSession(){
  var s = store(); if (!s) return;
  try { s.setItem('bm_so', JSON.stringify({ token: state.token, name: state.name, phone: state.phone, role: state.role })); } catch (e) {}
}
function logout(msg){
  if (state.token) api('soLogout', {});
  state.token = ''; state.name = ''; state.home = null; state.order = null; state.role = ''; state.viewSo = null; state.viewAsm = null; state.bundle = null; state.tab = '';
  state.view = 'login'; state.error = msg || '';
  var s = store(); if (s) try { s.removeItem('bm_so'); } catch (e) {}
  try { localStorage.removeItem('bm_so_copy'); } catch (e) {}
  render();
}

/******************** NOTIFICATIONS ********************/
// While the app is open (or in the background on Android), it checks
// every two minutes and raises a phone notification for any of his
// orders newly marked Not delivered. True push, with the app closed,
// comes with the next version.
function seenFailed(){ try { return JSON.parse(localStorage.getItem('bm_so_seen') || '{}'); } catch (e) { return {}; } }
function saveSeen(m){ try { localStorage.setItem('bm_so_seen', JSON.stringify(m)); } catch (e) {} }
function notifyNew(home){
  if (!home || state.day !== 'today') return;
  var seen = seenFailed(), fresh = [];
  home.orders.forEach(function(o){
    if (o.status === 'Not delivered' && !seen[o.invoiceNo]) { fresh.push(o); seen[o.invoiceNo] = Date.now(); }
  });
  var cut = Date.now() - 3 * 86400000;
  Object.keys(seen).forEach(function(k){ if (seen[k] < cut) delete seen[k]; });
  saveSeen(seen);
  if (!fresh.length || !state.seenOnce) { state.seenOnce = true; return; }
  state.fresh = fresh.length;
  if (window.Notification && Notification.permission === 'granted') {
    fresh.forEach(function(o){
      try {
        var body = o.shop + ' (SO ' + o.soNo + '): ' + (o.reason || 'not delivered') + (o.daName ? ' · DA ' + o.daName : '');
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(function(reg){ reg.showNotification('Not delivered', { body: body, tag: o.invoiceNo, icon: 'icon-192.png' }); });
        } else new Notification('Not delivered', { body: body, tag: o.invoiceNo });
      } catch (e) {}
    });
  }
}
function askNotify(){
  if (!window.Notification) { state.error = 'This phone’s browser cannot show notifications.'; render(); return; }
  Notification.requestPermission().then(function(){ render(); });
}

/******************** LOADING ********************/
function bundled(){ return state.role === 'admin' || state.role === 'asm'; }

// ASMs and admins get everything in one answer; moving between ASM, SO and
// orders then needs no waiting. The screens are worked out here from it.
function deriveHome(){
  var b = state.bundle; if (!b) return null;
  var zero = function(){ return { total: 0, delivered: 0, failed: 0, onTheWay: 0, waiting: 0 }; };
  var countOf = function(list){
    var c = zero(); c.total = list.length;
    list.forEach(function(o){
      if (o.status === 'Delivered') c.delivered++; else if (o.status === 'Not delivered') c.failed++;
      else if (o.status === 'On the way') c.onTheWay++; else c.waiting++;
    }); return c;
  };
  var add = function(t, c){ Object.keys(t).forEach(function(k){ t[k] += c[k]; }); return t; };
  var ordersOf = function(p){ return b.orders[p] || []; };
  var soCards = function(roster){
    var tot = zero();
    var sos = roster.map(function(x){ var c = countOf(ordersOf(x.phone)); add(tot, c); return { phone: x.phone, name: x.name, counts: c }; });
    sos.sort(function(a, c){ return (c.counts.failed - a.counts.failed) || (c.counts.total - a.counts.total) || a.name.localeCompare(c.name); });
    return { sos: sos, counts: tot };
  };
  if (state.viewSo) {
    var os = ordersOf(state.viewSo.phone);
    return { success: true, day: b.day, name: state.viewSo.name, soPhone: state.viewSo.phone, orders: os, counts: countOf(os) };
  }
  if (state.role === 'admin' && !state.viewAsm) {
    var tot = zero();
    var asms = b.asms.map(function(a){ var r = soCards(a.sos); add(tot, r.counts); return { phone: a.phone, name: a.name, soCount: r.sos.length, counts: r.counts }; });
    asms.sort(function(a, c){ return ((a.phone === 'none') - (c.phone === 'none')) || (c.counts.failed - a.counts.failed) || a.name.localeCompare(c.name); });
    return { success: true, admin: true, day: b.day, name: b.name, asms: asms, counts: tot, orders: [] };
  }
  var pick = state.role === 'admin' ? state.viewAsm.phone : state.phone;
  var asm = b.asms.filter(function(a){ return a.phone === pick; })[0] || { name: b.name, sos: [] };
  var r2 = soCards(asm.sos);
  return { success: true, asm: true, asmPhone: pick, day: b.day, name: asm.name, sos: r2.sos, counts: r2.counts, orders: [] };
}
function showHome(){ state.home = deriveHome(); if (state.view === 'home' && state.tab !== 'track') render(); }

function loadHome(quiet){
  if (bundled()) {
    if (state.bundle && state.bundleDay !== dayStr()) state.bundle = null;
    if (!quiet && !state.bundle) { state.loading = true; state.error = ''; splashStart(); render(); }
    var day = dayStr();
    api('soBundle', { date: day }).then(function(r){
      state.loading = false; splashEnd(r && r.success);
      if (r && r.success) { state.bundle = r; state.bundleDay = day; state.loadedAt = Date.now(); state.home = deriveHome(); }
      else if (!quiet) state.error = (r && r.error) || 'Could not load.';
      if (state.view === 'home' && state.tab !== 'track') render();
    });
    return;
  }
  if (!quiet) { state.loading = !state.home; state.error = ''; if (state.loading) splashStart(); render(); }
  api('soHome', { date: dayStr(), soPhone: state.viewSo ? state.viewSo.phone : '' }).then(function(r){
    state.loading = false; splashEnd(r && r.success);
    if (r && r.success) {
      state.home = r; state.loadedAt = Date.now(); notifyNew(r);
      // Kept on the phone so the app opens on it next time, at once.
      try { localStorage.setItem('bm_so_copy', JSON.stringify({ phone: state.phone, day: dayStr(), data: r })); } catch (e) {}
    }
    else if (!quiet) state.error = (r && r.error) || 'Could not load your orders.';
    if (state.view === 'home' && state.tab !== 'track') render();
  });
}

/******************** LOADING SCREEN ********************/
// A bar that eases towards 97% and only reaches 100% when the data arrives.
// The usual wait is remembered on this phone, so the bar fits its connection.
var SPLASH = { on: false, t0: 0, timer: 0 };
function splashEst(){ try { return Math.max(1500, Number(localStorage.getItem('bm_so_est')) || 4000); } catch (e) { return 4000; } }
function splashStart(){
  SPLASH.on = true; SPLASH.t0 = Date.now();
  clearInterval(SPLASH.timer);
  SPLASH.timer = setInterval(splashTick, 100);
}
function splashTick(){
  var fill = document.getElementById('spFill'); if (!fill || !SPLASH.on) return;
  var el = Date.now() - SPLASH.t0, est = splashEst();
  var pc = Math.min(97, 97 * (1 - Math.exp(-2.3 * el / est)));
  fill.style.width = Math.max(3, pc) + '%';
  document.getElementById('spPct').textContent = Math.floor(pc) + '%';
  document.getElementById('spTime').textContent = (el / 1000).toFixed(1) + ' s';
  if (el > est * 1.6) document.getElementById('spNote').textContent = 'Taking longer than usual, still working…';
}
function splashEnd(ok){
  if (!SPLASH.on) return;
  SPLASH.on = false; clearInterval(SPLASH.timer);
  if (ok) { try { var took = Date.now() - SPLASH.t0; var old = Number(localStorage.getItem('bm_so_est')) || took; localStorage.setItem('bm_so_est', String(Math.round(old * 0.6 + took * 0.4))); } catch (e) {} }
}
function splashHTML(){
  return '<div class="splash"><div class="sp-logo">BM</div><div class="sp-title">Getting your orders</div>' +
    '<div class="sp-bar"><i id="spFill" style="width:3%"></i></div>' +
    '<div class="sp-row"><span id="spPct">0%</span><span id="spTime">0.0 s</span></div>' +
    '<div class="sp-note" id="spNote">Loading everything at once, so the next screens open instantly.</div></div>';
}
function openOrder(inv){
  state.view = 'order'; state.order = null; state.error = ''; state.orderFor = inv; render();
  window.scrollTo(0, 0);
  api('soOrder', { invoiceNo: inv }).then(function(r){
    if (state.orderFor !== inv) return;
    if (r && r.success) state.order = r; else state.error = (r && r.error) || 'Could not load the order.';
    render();
  });
}
setInterval(function(){
  if (state.token && state.view === 'home' && state.tab !== 'track' && !document.hidden) loadHome(true);
}, REFRESH_MS);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && state.token && state.view === 'home' && state.tab !== 'track' && Date.now() - (state.loadedAt || 0) > 60000) loadHome(true);
});

/******************** RENDER ********************/
function render(){
  var app = document.getElementById('app');
  var h = state.view === 'login' ? loginHTML()
        : state.view === 'order' ? orderHTML()
        : state.view === 'settings' ? settingsHTML()
        : homeHTML();
  app.innerHTML = h;
}

function loginHTML(){
  return '<div class="login"><div class="card">' +
    '<div style="font-size:22px; font-weight:800;">BM SO</div>' +
    '<div class="note" style="margin:4px 0 14px;">Your customers’ orders, live from the routes.</div>' +
    '<label class="f">Your phone number</label>' +
    '<input id="lg-phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="10 digits" value="' + esc(state.phone) + '" />' +
    '<label class="f">PIN</label>' +
    '<input id="lg-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="First time: last 4 digits of your phone" />' +
    (state.error ? '<div class="err" style="margin-top:12px;">' + esc(state.error) + '</div>' : '') +
    '<div style="margin-top:16px;"><button class="btn" data-a="login"' + (state.busy ? ' disabled' : '') + '>' +
      (state.busy ? 'Signing in…' : 'Sign in') + '</button></div>' +
    '</div></div>';
}

function statusPill(s){
  var cls = s === 'Delivered' ? 'p-ok' : s === 'Not delivered' || s === 'Not Delivered' ? 'p-bad' : s === 'On the way' ? 'p-mid' : 'p-blue';
  return '<span class="pill ' + cls + '">' + esc(s === 'Not Delivered' ? 'Not delivered' : s) + '</span>';
}

function decisionLine(d){
  if (!d) return '';
  if (d.pending) return '<div class="warn-line">Support is calling the shop' + (d.attempts ? ' (' + d.attempts + ' call' + (d.attempts > 1 ? 's' : '') + ' so far)' : '') + '</div>';
  if (d.decision === 'RD') return '<div class="note"><b style="color:var(--blue);">Going again (RD)</b> · ' + esc(d.why) + '</div>';
  if (d.decision === 'Cancel') return '<div class="note"><b style="color:var(--red);">Cancelled</b> · ' + esc(d.why) + '</div>';
  return '';
}

function soCheckLine(v){
  if (!v) return '';
  return /not reached/i.test(v)
    ? '<div class="warn-line">⚠ DA could not reach you (' + esc(v.replace(/^SO not reached\s*/i, '')) + ')</div>'
    : /confirmed/i.test(v) ? '<div class="ok-line">✓ DA called you first (' + esc(v.replace(/^SO confirmed\s*/i, '')) + ')</div>' : '';
}

document.addEventListener('click', function(ev){
  if (ev.target.closest('[data-stop]')) return;
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a');
  if (a === 'login') return doLogin();
  if (a === 'refresh') { state.fresh = 0; state.bundle = null; return loadHome(false); }
  if (a === 'settings') { state.view = 'settings'; state.error = ''; state.note = ''; render(); return; }
  if (a === 'so') { state.viewSo = { phone: el.getAttribute('data-v'), name: el.getAttribute('data-n') }; state.filter = ''; state.view = 'home'; if (state.bundle) showHome(); else { state.home = null; loadHome(false); } window.scrollTo(0, 0); return; }
  if (a === 'asm') { state.viewAsm = { phone: el.getAttribute('data-v'), name: el.getAttribute('data-n') }; state.viewSo = null; state.filter = ''; if (state.bundle) showHome(); else { state.home = null; loadHome(false); } window.scrollTo(0, 0); return; }
  if (a === 'admintop') { state.viewAsm = null; state.viewSo = null; if (state.bundle) showHome(); else { state.home = null; loadHome(false); } return; }
  if (a === 'team') { state.viewSo = null; state.filter = ''; if (state.bundle) showHome(); else { state.home = null; loadHome(false); } return; }
  if (a === 'back') { state.view = 'home'; state.error = ''; render(); if (!state.home) loadHome(false); return; }
  if (a === 'day') { state.day = el.getAttribute('data-v'); state.home = null; state.bundle = null; state.filter = ''; loadHome(false); return; }
  if (a === 'filter') { var v = el.getAttribute('data-v'); state.filter = state.filter === v ? '' : v; render(); return; }
  if (a === 'open') { state.fresh = 0; openOrder(el.getAttribute('data-v')); return; }
  if (a === 'fresh-ok') { state.fresh = 0; state.filter = 'Not delivered'; render(); return; }
  if (a === 'theme') { setTheme(el.getAttribute('data-v')); return; }
  if (a === 'tab') { state.tab = el.getAttribute('data-v'); state.trackErr = ''; state.view = 'home'; render(); if (state.tab === 'track') { var tq = document.getElementById('tr-q'); if (tq) tq.focus(); } else if (!state.home) loadHome(false); return; }
  if (a === 'track') { doTrack(); return; }
  if (a === 'notify') { askNotify(); return; }
  if (a === 'pin') return doPin();
  if (a === 'logout') { logout(''); return; }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && state.view === 'login') doLogin();
  if (ev.key === 'Enter' && state.view === 'home' && state.tab === 'track' && ev.target && ev.target.id === 'tr-q') doTrack();
});

function doLogin(){
  var p = (document.getElementById('lg-phone') || {}).value || '';
  var n = (document.getElementById('lg-pin') || {}).value || '';
  p = p.replace(/\D/g, '').slice(-10);
  state.phone = p;
  if (p.length !== 10 || !n) { state.error = 'Enter your 10-digit phone number and PIN.'; render(); return; }
  state.busy = true; state.error = ''; render();
  api('soLogin', { phone: p, pin: n }).then(function(r){
    state.busy = false;
    if (r && r.success) {
      state.token = r.token; state.name = r.name; state.phone = r.phone; state.role = r.role || 'so'; state.viewSo = null; state.viewAsm = null; state.bundle = null; state.mustChangePin = !!r.mustChangePin;
      saveSession(); state.view = 'home'; loadHome(false);
    } else { state.error = (r && r.error) || 'Could not sign in.'; render(); }
  });
}

function doPin(){
  var c = document.getElementById('pin-cur').value, n1 = document.getElementById('pin-new').value, n2 = document.getElementById('pin-new2').value;
  state.note = ''; state.error = '';
  if (n1 !== n2) { state.error = 'The two new PINs do not match.'; render(); return; }
  api('soChangePin', { currentPin: c, newPin: n1 }).then(function(r){
    if (r && r.success) { state.note = 'PIN changed.'; state.mustChangePin = false; }
    else state.error = (r && r.error) || 'Could not change the PIN.';
    render();
  });
}

(function(){

  try { saved = s && JSON.parse(s.getItem('bm_so') || 'null'); } catch (e) {}

    state.token = saved.token; state.name = saved.name; state.phone = saved.phone; state.role = saved.role || 'so';

      var c = JSON.parse(localStorage.getItem('bm_so_copy') || 'null');

    } catch (e) {}
    loadHome(false);
  } else render();
})();
</script>
<script>
/* PHOTO-POPUP: photo links open in a big popup inside the app, not another app. */
(function(){
  var box = null, hist = false;
  function fileId(u){ var m = String(u || '').match(/[-\w]{25,}/); return m ? m[0] : ''; }
  function isPhotoLink(a){
    var h = a.getAttribute('href') || '';
    if (!/drive\.google\.com|googleusercontent\.com/i.test(h)) return false;
    if (/\/maps|wa\.me|whatsapp/i.test(h)) return false;
    var txt = (a.textContent || '').toLowerCase();
    if (/pdf|manifest|sheet|doc\b/.test(txt)) return false;
    return !!a.querySelector('img') || /photo|view|screenshot|image|proof|signature|pod/.test(txt);
  }
  function close(fromPop){
    if (!box) return;
    box.remove(); box = null;
    if (hist && !fromPop) { hist = false; try { history.back(); } catch (e) {} }
    hist = false;
  }
  function open(href){
    var id = fileId(href); if (!id) return false;
    close(true);
    box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;');
    box.innerHTML =
      '<div style="position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;align-items:center;">' +
        '<a href="' + href.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener" data-lb-skip="1" style="color:#fff;font:600 13px system-ui;text-decoration:underline;opacity:.85;">Open original</a>' +
        '<button type="button" id="lb-x" style="background:#fff;color:#000;border:0;border-radius:20px;width:38px;height:38px;font:700 20px system-ui;cursor:pointer;">×</button>' +
      '</div>' +
      '<img alt="" style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;touch-action:pinch-zoom;" ' +
        'src="https://drive.google.com/thumbnail?id=' + id + '&sz=w1600">' +
      '<div id="lb-msg" style="color:#fff;font:13px system-ui;margin-top:10px;opacity:.8;">Tap outside the photo to close</div>';
    var img = box.querySelector('img');
    img.onerror = function(){ img.style.display = 'none'; box.querySelector('#lb-msg').textContent = 'Could not load the photo here. Use Open original.'; };
    box.addEventListener('click', function(e){
      if (e.target.closest && e.target.closest('[data-lb-skip]')) return;
      if (e.target === img) return;
      close();
    });
    document.body.appendChild(box);
    try { history.pushState({ lb: 1 }, ''); hist = true; } catch (e) {}
    return true;
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.hasAttribute('data-lb-skip') || !isPhotoLink(a)) return;
    if (open(a.getAttribute('href'))) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener('popstate', function(){ if (box) close(true); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
})();
</script>
<script>
// Keeps the app on the phone. Registered after load so it never
// slows the first screen down.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
