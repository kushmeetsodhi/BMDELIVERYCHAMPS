/******************** EVENTS ********************/
function attachEvents(){
  var app = document.getElementById('app');
  if(!app) return;

  var nodes = app.querySelectorAll('[data-action]');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].addEventListener('click', onAction);
  }

  var stops = app.querySelectorAll('[data-stop]');
  for (var j = 0; j < stops.length; j++) {
    stops[j].addEventListener('click', function(ev){ ev.stopPropagation(); });
  }

  var reasonSel = document.getElementById('reason-select');
  if (reasonSel) {
    reasonSel.addEventListener('change', function(){
      state.reasonInput = reasonSel.value;
      render();
    });
  }

  var cashEl = document.getElementById('cash-input');
  var upiEl = document.getElementById('upi-input');
  if (cashEl && upiEl) {
    cashEl.addEventListener('input', function(){
      state.cashInput = cashEl.value;
      var o = currentOrder();
      var due = o ? collectedDue(o) : 0;
      state.upiInput = (state.cashInput === '') ? '' : String(Math.max(0, +(due - (Number(state.cashInput)||0)).toFixed(2)));
      upiEl.value = state.upiInput;
      refreshSplitHint();
    });
    upiEl.addEventListener('input', function(){
      state.upiInput = upiEl.value;
      var o = currentOrder();
      var due = o ? collectedDue(o) : 0;
      state.cashInput = (state.upiInput === '') ? '' : String(Math.max(0, +(due - (Number(state.upiInput)||0)).toFixed(2)));
      cashEl.value = state.cashInput;
      refreshSplitHint();
    });
  }

  var itEl = document.getElementById('issue-type');
  if (itEl) itEl.addEventListener('change', function(){ state.issueType = itEl.value; render(); });
  var iiEl = document.getElementById('issue-items');
  if (iiEl) iiEl.addEventListener('input', function(){
    var was = !!String(state.issueItems || '').trim();
    state.issueItems = iiEl.value;
    // Only redraw when the Confirm button needs to switch on or off.
    if (was !== !!iiEl.value.trim()) render();
  });
  var inEl = document.getElementById('issue-note');
  if (inEl) inEl.addEventListener('input', function(){ state.issueNote = inEl.value; });

  var collEl = document.getElementById('collected-input');
  if (collEl) collEl.addEventListener('input', function(){ state.collectedInput = collEl.value; });
  var srEl = document.getElementById('short-reason');
  if (srEl) srEl.addEventListener('change', function(){ state.shortReason = srEl.value; render(); });
  var snEl = document.getElementById('short-note');
  if (snEl) snEl.addEventListener('input', function(){ state.shortNote = snEl.value; });
  var tnEl = document.getElementById('trip-note');
  if (tnEl) tnEl.addEventListener('input', function(){ state.tripNote = tnEl.value; });

  var rpQ = document.getElementById('rp-q');
  if (rpQ) {
    rpQ.addEventListener('input', function(){ rpOnType(rpQ); });
    rpQ.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { rpQ.blur(); } });
  }
  var rpFile = document.getElementById('rp-file');
  if (rpFile) rpFile.addEventListener('change', function(){ rpAddFile(rpFile); });

  var podInput = document.getElementById('pod-photo-input');
  if (podInput) podInput.addEventListener('change', function(){
    addPodFiles(podInput, false);
  });
  var podGallery = document.getElementById('pod-gallery-input');
  if (podGallery) podGallery.addEventListener('change', function(){
    addPodFiles(podGallery, true);
  });

  var skipSel = document.getElementById('pod-skip-reason');
  if (skipSel) skipSel.addEventListener('change', function(){
    state.podSkipReason = skipSel.value; render();
  });
  var skipNote = document.getElementById('pod-skip-note');
  if (skipNote) skipNote.addEventListener('input', function(){ state.podSkipNote = skipNote.value; });

  setupSignaturePad();

  var retInput = document.getElementById('return-photo-input');
  if (retInput) {
    retInput.addEventListener('change', function(){
      var file = retInput.files && retInput.files[0];
      if (!file) return;
      state.loading = true; state.loadingMsg = 'Preparing photo...'; render();
      compressImage(file, function(out){
        state.returnPhotoPreview = out.dataUrl;
        state.returnPhotoMime = out.mime;
        state.returnPhoto = out.base64;
        state.loading = false;
        render();
      });
    });
  }

  var shotEl = document.getElementById('screenshot-input');
  if (shotEl) {
    shotEl.addEventListener('change', function(){
      var file = shotEl.files && shotEl.files[0];
      if(!file) return;
      state.loading = true; state.loadingMsg = 'Preparing photo...'; render();
      compressImage(file, function(out){
        state.screenshotPreview = out.dataUrl;
        state.screenshotMime = out.mime;
        state.screenshotBase64 = out.base64;
        state.screenshotLink = null;
        state.loading = false;
        render();

        // Start the upload now so it overlaps with the DA filling in
        // the rest of the form.
        var o = currentOrder();
        if (!o) return;
        state.screenshotUploading = true;
        api('uploadPhoto', {
          code: state.code,
          invoiceNo: o.invoiceNo,
          isProof: (state.markStatus === 'Not Delivered'),
          screenshotBase64: out.base64,
          screenshotMime: out.mime
        }).then(function(res){
          state.screenshotUploading = false;
          if (res && res.success && res.link) state.screenshotLink = res.link;
        });
      });
    });
  }
}

function refreshSplitHint(){
  var o = currentOrder();
  if(!o) return;
  var due = collectedDue(o);
  var total = (Number(state.cashInput)||0) + (Number(state.upiInput)||0);
  var el = document.getElementById('split-hint');
  if (el) el.textContent = 'Must add up to ' + money(due) + '. Currently ' + money(total) + '.';
}

// If the DA tapped "Change this status" then navigated away without
// re-marking, put the original status back rather than leaving the
// order looking unmarked.
function restoreSaved(){
  var o = currentOrder();
  if (o && o._saved) { o.currentStatus = o._saved; delete o._saved; }
}

// The app redraws by replacing innerHTML, which would wipe a drawn
// signature. So every stroke is kept as a data URL in state and painted
// back onto a fresh canvas after each render.
function setupSignaturePad(){
  var cv = document.getElementById('pod-sig');
  if (!cv) return;

  // Match the backing store to the element's real size, allowing for a
  // phone's pixel ratio, or the line comes out blurred and offset.
  var ratio = window.devicePixelRatio || 1;
  var rect = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(rect.width * ratio));
  cv.height = Math.max(1, Math.round(rect.height * ratio));
  var ctx = cv.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';

  if (state.podSigPreview) {
    var img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, rect.width, rect.height); };
    img.src = state.podSigPreview;
  }

  var drawing = false;
  var pos = function(ev){
    var r = cv.getBoundingClientRect();
    var t = (ev.touches && ev.touches[0]) || ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };

  var start = function(ev){
    ev.preventDefault();
    drawing = true;
    var p = pos(ev);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  var move = function(ev){
    if (!drawing) return;
    ev.preventDefault();
    var p = pos(ev);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  var end = function(){
    if (!drawing) return;
    drawing = false;
    // Kept without a re-render, so drawing stays smooth. The confirm
    // button is enabled by hand instead.
    try {
      state.podSigPreview = cv.toDataURL('image/png');
      state.podSigBase64 = state.podSigPreview.split(',')[1];
    } catch (e) {}
    var hint = document.getElementById('pod-sig-hint');
    if (hint) hint.textContent = 'Signed';
    refreshPodConfirm();
  };

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointerleave', end);
  // Older Android browsers without pointer events.
  cv.addEventListener('touchstart', start, { passive: false });
  cv.addEventListener('touchmove', move, { passive: false });
  cv.addEventListener('touchend', end);
  cv.addEventListener('mousedown', start);
  cv.addEventListener('mousemove', move);
  cv.addEventListener('mouseup', end);
}

function refreshPodConfirm(){
  var btn = document.getElementById('pod-confirm');
  if (!btn) return;
  if (state.podPhotos.length && state.podSigBase64) btn.removeAttribute('disabled');
  else btn.setAttribute('disabled', 'disabled');
}

function clearSignature(){
  state.podSigBase64 = null;
  state.podSigPreview = null;
  var cv = document.getElementById('pod-sig');
  if (cv) {
    var ctx = cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
  }
  render();
}

// The photo goes up while the signature is being taken, so the queued
// mark carries a link rather than an image. If it fails, the raw data
// goes with the mark instead and the server saves it.
// A thumbnail for a photo, from the link once it has uploaded and from
// the bytes before that. Built when it is drawn rather than kept.
function podThumbSrc(sh){
  if (sh.link) return thumbFor(sh.link);
  if (sh.base64) return 'data:' + (sh.mime || 'image/jpeg') + ';base64,' + sh.base64;
  return '';
}

// A Drive file's thumbnail, which is a fraction of the full image.
function thumbFor(url){
  var m = String(url || '').match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w200' : url;
}

/**
 * Proof photos already uploaded for the stop in hand.
 *
 * The camera is heavy enough to get the page evicted on a phone with
 * little memory, and the reload loses everything held in the tab. The
 * pictures themselves are already safe on Drive by then, so only
 * their links are kept here - a few hundred bytes, not megabytes -
 * and the DA comes back to a stop that still has its photos rather
 * than being sent to the camera a second time.
 */
function savePodProgress(){
  try {
    if (state.isDemo) return;
    var o = currentOrder();
    if (!o) return;
    var links = state.podPhotos.filter(function(sh){ return sh.link; })
                               .map(function(sh){ return sh.link; });
    if (!links.length && !state.podSkipReason) { localStorage.removeItem('bm_pod'); return; }
    localStorage.setItem('bm_pod', JSON.stringify({
      day: todayKey(), code: state.code, invoiceNo: o.invoiceNo,
      links: links, skip: state.podSkipReason || ''
    }));
  } catch(e){}
}

function clearPodProgress(){
  try { localStorage.removeItem('bm_pod'); } catch(e){}
}

// Returns the saved proof for this stop, or null. Anything from
// another day, route or order is not his and is thrown away.
function loadPodProgress(invoiceNo){
  try {
    var raw = localStorage.getItem('bm_pod');
    if (!raw) return null;
    var p = JSON.parse(raw);
    if (!p || p.day !== todayKey() || p.code !== state.code) { clearPodProgress(); return null; }
    if (p.invoiceNo !== invoiceNo) return null;
    return p;
  } catch(e){ return null; }
}

function uploadPodPhotos(){
  if (state.isDemo) return;
  var inv = (currentOrder() || {}).invoiceNo;
  state.podPhotos.forEach(function(sh){
    if (sh.link || sh.uploading) return;
    sh.uploading = true;
    api('uploadPhoto', {
      code: state.code, invoiceNo: inv, kind: 'pod',
      screenshotBase64: sh.base64, screenshotMime: sh.mime
    }).then(function(res){
      sh.uploading = false;
      if (res && res.success && res.link) {
        sh.link = res.link;
        // The server has the picture now, so the copy on the phone is
        // dead weight. Dropping it is what keeps a long route from
        // filling the browser's memory one stop at a time.
        sh.base64 = null;
        // And its link is written down, so the camera killing the page
        // does not cost the DA the photo he has just taken.
        savePodProgress();
      }
      // Only repaint the little upload marks, and only while the proof
      // screen is still up - a redraw mid-signature would wipe it.
      if (state.view === 'pod') render();
    }).catch(function(){ sh.uploading = false; });
  });
}

function resetPodState(){
  clearPodProgress();
  state.podPhotos = [];
  state.podSigBase64 = null;
  state.podSigPreview = null;
  state.podSkipOpen = false;
  state.podSkipReason = '';
  state.podSkipNote = '';
}

function resetMarkState(){
  state.markStatus = null;
  state.payMode = null;
  state.cashInput = '';
  state.upiInput = '';
  state.reasonInput = '';
  state.screenshotBase64 = null;
  state.screenshotMime = null;
  state.screenshotPreview = null;
  state.screenshotLink = null;
  state.screenshotUploading = false;
  state.amountChoice = null;
  state.amountDone = false;
  state.issueOpen = false;
  state.issueType = '';
  state.issueItems = '';
  state.issueNote = '';
  state.collectedInput = '';
  state.shortReason = '';
  state.shortNote = '';
}

function onAction(ev){
  var el = ev.currentTarget;
  var action = el.getAttribute('data-action');
  if (!action) return;
  ev.stopPropagation();
  state.error = '';

  if (action === 'toggle-menu') { state.menuOpen = !state.menuOpen; render(); return; }
  if (action === 'toggle-theme') { toggleTheme(); return; }
  if (action === 'close-modal') { state.modal = null; render(); return; }

  if (action === 'install-app') {
    state.menuOpen = false;
    if (state.deferredInstall) {
      state.deferredInstall.prompt();
      state.deferredInstall = null;
    }
    render();
    return;
  }

  if (action === 'open-profile') {
    state.menuOpen = false; state.profileMsg = ''; state.view = 'profile'; render(); return;
  }
  if (action === 'back-from-profile') {
    state.view = state.orders.length ? 'order' : 'code'; render(); return;
  }

  if (action === 'logout') {
    // Unsent marks are NOT discarded on logout. They stay on the phone
    // and keep sending, each still recorded under the DA who made it.
    state.confirmingLogout = false;
    clearSession();
    if (state.isDemo) state.pending = [];
    state.isDemo = false;
    state.loginName = ''; state.pin = ''; state.code = ''; state.vehicleNo = '';
    state.orders = []; state.orderIndex = 0; state.openTrip = null;
    state.tripClosed = false; state.menuOpen = false; state.modal = null;
    resetMarkState();
    resetPodState();
    state.view = 'login';
    render();
    return;
  }

  if (action === 'show-stuck') { state.view = 'stuck'; render(); return; }
  if (action === 'stuck-back') {
    state.view = !state.loginName ? 'login'
      : (state.orders.length ? 'order' : (state.openTrip ? 'resume' : 'code'));
    render(); return;
  }
  if (action === 'stuck-retry') { retryNow(); render(); return; }
  if (action === 'stuck-drop') {
    var idx = Number(el.getAttribute('data-idx'));
    var job = state.pending[idx];
    if (!job) return;
    state.modal = {
      title: 'Remove this update?',
      body: 'The server will not accept it, so it cannot be saved from here. Removing it means ' +
            shortId(job.payload.invoiceNo) + ' stays unmarked — tell the office, then mark it again.',
      confirmText: 'Remove',
      confirmAction: 'stuck-drop-confirm',
      confirmIdx: idx
    };
    render(); return;
  }
  if (action === 'stuck-drop-confirm') {
    var di = state.modal ? state.modal.confirmIdx : -1;
    state.modal = null;
    if (di > -1 && state.pending[di]) {
      var inv = state.pending[di].payload.invoiceNo;
      state.pending.splice(di, 1);
      for (var oi = 0; oi < state.orders.length; oi++) {
        // Show it as unmarked again so the DA can re-do it properly.
        if (state.orders[oi].invoiceNo === inv && state.orders[oi]._unsaved) {
          state.orders[oi].currentStatus = null;
          delete state.orders[oi]._unsaved;
        }
      }
      state.syncFailed = rejectedJobs().length > 0;
      saveQueue();
    }
    render(); return;
  }

  if (action === 'flush-retry') { flushThen(state.flushNext || afterLogin); return; }
  if (action === 'menu-stuck') { state.menuOpen = false; state.view = 'stuck'; render(); return; }

  if (action === 'flush-continue') {
    var nx = state.flushNext || afterLogin;
    state.flushNext = null; state.flushFailed = false;
    pumpQueue();
    nx();
    return;
  }

  if (action === 'do-login')        { doLogin(); return; }
  if (action === 'practice')        { startPractice(); return; }
  if (action === 'checkin-selfie')  { state.error = ''; openCamera('selfie'); return; }
  if (action === 'checkin-locate')  { checkinLocate(); return; }
  if (action === 'checkin-submit')  { submitCheckin(); return; }
  if (action === 'checkin-back')    { state.checkin = null; state.error = ''; state.view = 'login'; render(); return; }
  if (action === 'do-enter-code')   { doEnterCode(false); return; }
  if (action === 'confirm-handover'){ state.modal = null; doEnterCode(true); return; }
  if (action === 'resume-trip')     { doResume(); return; }

  if (action === 'reopen-retry') {
    var sess = loadSession();
    if (sess) { state.reopenError = ''; resumeSession(sess); }
    else { state.view = 'login'; render(); }
    return;
  }
  if (action === 'reopen-login') {
    // Only here, where the DA has chosen it, is the session dropped.
    clearSession();
    state.loginName = ''; state.code = ''; state.reopenError = '';
    state.view = 'login';
    render();
    return;
  }

  if (action === 'prev-order') {
    restoreSaved();
    if (state.orderIndex > 0) { state.orderIndex--; saveSession(); render(); }
    return;
  }
  if (action === 'next-order') {
    restoreSaved();
    if (state.orderIndex < state.orders.length - 1) { state.orderIndex++; saveSession(); render(); }
    return;
  }
  if (action === 'go-summary')      { state.view = 'summary'; render(); return; }
  if (action === 'back-to-orders')  { state.view = 'order'; render(); return; }

  if (action === 'start-mark') {
    var wasRestored = currentOrder() ? loadPodProgress(currentOrder().invoiceNo) : null;
    resetMarkState();
    resetPodState();
    // Put back what survived the reload, now that the proof state is
    // fresh and will not be cleared out from under it.
    if (wasRestored) {
      state.podPhotos = (wasRestored.links || []).map(function(u){
        return { base64: null, mime: 'image/jpeg', link: u, uploading: false };
      });
      state.podSkipReason = wasRestored.skip || '';
      savePodProgress();
    }
    state.podRestored = 0;
    state.markStatus = el.getAttribute('data-status');
    state.view = 'mark';
    render();
    return;
  }

  if (action === 'remark') {
    resetMarkState();
    resetPodState();
    var o = currentOrder();
    if (o) { o._saved = o.currentStatus; o.currentStatus = null; }
    state.view = 'order';
    render();
    return;
  }

  if (action === 'cancel-mark') {
    var co = currentOrder();
    if (co && co._saved) { co.currentStatus = co._saved; delete co._saved; }
    resetMarkState();
    resetPodState();
    state.view = 'order';
    render();
    return;
  }

  if (action === 'issue-open') {
    state.issueOpen = true;
    state.issueType = ''; state.issueItems = ''; state.issueNote = '';
    state.screenshotBase64 = null; state.screenshotMime = null;
    state.screenshotPreview = null; state.screenshotLink = null;
    state.error = '';
    render();
    return;
  }
  if (action === 'issue-cancel') {
    state.issueOpen = false;
    state.issueType = ''; state.issueItems = ''; state.issueNote = '';
    state.screenshotBase64 = null; state.screenshotMime = null;
    state.screenshotPreview = null; state.screenshotLink = null;
    state.error = '';
    render();
    return;
  }

  if (action === 'amt-full') {
    state.amountChoice = 'full';
    state.collectedInput = '';
    state.shortReason = ''; state.shortNote = '';
    state.screenshotBase64 = null; state.screenshotMime = null;
    state.screenshotPreview = null; state.screenshotLink = null;
    render();
    return;
  }
  if (action === 'amt-diff') {
    state.amountChoice = 'diff';
    state.amountDone = false;
    state.payMode = null;
    state.collectedInput = '';
    state.screenshotBase64 = null; state.screenshotMime = null;
    state.screenshotPreview = null; state.screenshotLink = null;
    render();
    return;
  }
  if (action === 'amt-back') {
    state.amountChoice = null;
    state.amountDone = false;
    state.collectedInput = ''; state.shortReason = ''; state.shortNote = '';
    state.screenshotBase64 = null; state.screenshotMime = null;
    state.screenshotPreview = null; state.screenshotLink = null;
    render();
    return;
  }
  if (action === 'amt-next') {
    var ao = currentOrder();
    var inv = Number(ao.balanceDue || 0);
    var got = Number(state.collectedInput);
    if (isNaN(got) || got < 0) { state.error = 'Enter the amount collected.'; render(); return; }
    if (got > inv + 0.01) { state.error = 'Cannot be more than the invoice ' + money(inv) + '.'; render(); return; }
    if (!state.shortReason) { state.error = 'Pick a reason.'; render(); return; }
    if (!state.screenshotBase64) { state.error = 'Take a photo.'; render(); return; }
    // Keep the short-payment photo; the payment screenshot, if any,
    // replaces it only when UPI is chosen.
    state.amountDone = true;
    state.payMode = null;
    state.error = '';
    render();
    return;
  }
  if (action === 'pay-back') {
    if (state.amountChoice === 'diff') { state.amountDone = false; state.payMode = null; }
    else { state.amountChoice = null; }
    state.error = '';
    render();
    return;
  }

  if (action === 'pick-pay') {
    state.payMode = el.getAttribute('data-mode');
    var po = currentOrder();
    var due = po ? collectedDue(po) : 0;
    if (state.payMode === 'Cash') { state.cashInput = String(due); state.upiInput = '0'; }
    if (state.payMode === 'UPI')  { state.cashInput = '0'; state.upiInput = String(due); }
    if (state.payMode === 'Split'){ state.cashInput = ''; state.upiInput = ''; }
    render();
    return;
  }

  if (action === 'start-collect') {
    var rid = el.getAttribute('data-rid');
    var ord = currentOrder();
    var found = null;
    if (ord && ord.returns) {
      for (var ri = 0; ri < ord.returns.length; ri++) {
        if (ord.returns[ri].requestId === rid) { found = ord.returns[ri]; break; }
      }
    }
    state.collectingReturn = found;
    state.returnPhoto = null; state.returnPhotoMime = null; state.returnPhotoPreview = null;
    state.view = 'collect';
    render();
    return;
  }

  if (action === 'cancel-collect') {
    state.collectingReturn = null;
    state.deferring = false; state.deferReason = '';
    state.returnPhoto = null; state.returnPhotoMime = null; state.returnPhotoPreview = null;
    state.view = 'order';
    render();
    return;
  }

  if (action === 'confirm-collect') { doCollectReturn(); return; }

  if (action === 'start-defer') {
    state.deferring = true; state.deferReason = ''; state.error = '';
    render();
    return;
  }
  if (action === 'cancel-defer') {
    state.deferring = false; state.error = '';
    render();
    return;
  }
  if (action === 'confirm-defer') { doDeferReturn(); return; }

  if (action === 'confirm-mark')    { doConfirmMark(); return; }
  if (action === 'pod-sig-clear')   { clearSignature(); return; }
  if (action === 'pod-camera-open') { openCamera(); return; }
  if (action === 'pod-photo-remove'){
    var pi = Number(el.getAttribute('data-i'));
    if (pi >= 0) state.podPhotos.splice(pi, 1);
    render();
    return;
  }
  if (action === 'pod-skip-open')   { state.podSkipOpen = true; state.error = ''; render(); return; }
  if (action === 'pod-skip-close')  { state.podSkipOpen = false; state.error = ''; render(); return; }
  if (action === 'pod-confirm')     { submitMark(); return; }
  if (action === 'pod-skip-confirm'){
    if (!state.podSkipReason) { state.error = 'Pick a reason.'; render(); return; }
    var nEl = document.getElementById('pod-skip-note');
    if (nEl) state.podSkipNote = nEl.value;
    submitMark();
    return;
  }
  if (action === 'save-pin')        { doSavePin(); return; }

  // New app: the return proofs come first, and End day on that screen
  // brings the usual confirmation.
  if (action === 'ask-end-trip' && state.view !== 'retproof' && rpEnabled()) {
    openReturnProofs();
    return;
  }
  if (action === 'rp-cam')  { if (state.rp && state.rp.match) openCamera('ret'); return; }
  if (action === 'rp-save') { rpSave(); return; }
  if (action === 'rp-del')  { rpDelete(el.getAttribute('data-inv')); return; }
  if (action === 'rp-photo-remove') {
    var ri = Number(el.getAttribute('data-i'));
    if (state.rp && ri >= 0) state.rp.photos.splice(ri, 1);
    render();
    return;
  }
  if (action === 'ask-end-trip' || action === 'ask-end-trip-resume') {
    state.menuOpen = false;
    var pending = 0;
    for (var i = 0; i < state.orders.length; i++) {
      if (!state.orders[i].currentStatus) pending++;
    }
    var msg = (action === 'ask-end-trip-resume')
      ? 'Any orders not yet marked will be recorded as not delivered.'
      : (pending > 0
          ? pending + ' order(s) are still unmarked. They will be recorded as not delivered.'
          : 'All orders are marked. This will close your day.');
    state.modal = {
      title: 'End trip?',
      body: msg,
      confirmText: 'End trip',
      confirmAction: (action === 'ask-end-trip-resume') ? 'do-end-trip-resume' : 'do-end-trip'
    };
    render();
    return;
  }

  if (action === 'close-blocking-trip'){ doCloseBlockingTrip(); return; }
  if (action === 'close-skip') { state.tripNote = ''; finishClose(); return; }
  if (action === 'close-done') {
    var tn = document.getElementById('trip-note');
    state.tripNote = tn ? tn.value.trim() : '';
    finishClose();
    return;
  }
  if (action === 'close-retry') {
    var rcode = state.endingFromResume
      ? (state.openTrip ? state.openTrip.code : state.code) : state.code;
    state.closeError = '';
    render();
    fireCloseRequest(rcode, state.tripNote);
    return;
  }
  if (action === 'close-cancel') {
    state.closeError = '';
    state.view = state.endingFromResume ? 'resume' : 'order';
    render();
    return;
  }

  if (action === 'do-end-trip')        { doEndTrip(false); return; }
  if (action === 'do-end-trip-resume') { doEndTrip(true); return; }
  if (action === 'reopen-trip')        { doReopenTrip(); return; }
}

/******************** SESSION ON THE PHONE ********************/
// A DA tapping Back used to land on the login screen and think the app
// had thrown their work away. The session is kept on the phone instead,
// so the app reopens on the stop they were on. It holds no PIN - only
// who was working, which route, and where they had got to - and it
// expires at the end of the day.
function todayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function saveSession(){
  try {
    if (state.isDemo || !state.loginName || !state.code) return;
    localStorage.setItem('bm_session', JSON.stringify({
      loginName: state.loginName,
      code: state.code,
      vehicleNo: state.vehicleNo || '',
      orderIndex: state.orderIndex || 0,
      day: todayKey()
    }));
  } catch(e){}
}

function clearSession(){
  try { localStorage.removeItem('bm_session'); } catch(e){}
  locStop();
}

function loadSession(){
  try {
    var raw = localStorage.getItem('bm_session');
    if (!raw) return null;
    var s = JSON.parse(raw);
    // A new day means a new route, so make them log in again.
    if (!s || !s.loginName || !s.code || s.day !== todayKey()) { clearSession(); return null; }
    return s;
  } catch(e){ return null; }
}

// Reopens the route the DA was working, without the login screen.
function resumeSession(s){
  state.loginName = s.loginName;
  state.code = s.code;
  state.vehicleNo = s.vehicleNo || '';
  // So the handover prompt below has a code to confirm with - it is
  // the same prompt the manual path uses, and it reads pendingCode.
  state.pendingCode = s.code;
  state.loading = true;
  state.loadingMsg = 'Opening your route\u2026';
  render();

  // Reopening is the one call a DA cannot do anything else during, so
  // it is the one that must not hang. Twenty-five seconds, then the
  // retry screen - which at least has a button on it.
  api('enterCode', { loginName: s.loginName, code: s.code, vehicleNo: s.vehicleNo || '' }, 25000)
    .then(function(res){
      state.loading = false;

      // A call that never reached the server says nothing about the
      // route. Coming back from the camera on a weak signal looks
      // exactly like this, and throwing the DA back to the login
      // screen mid-round - with his code only on a printed sheet he
      // may not still have - was the worst possible reading of it.
      if (!res || res.network) {
        state.reopenError = (res && res.error) || 'No connection.';
        state.view = 'reopen';
        render();
        return;
      }

      // Somebody else has opened this code since - a supervisor
      // checking it, or dispatch. The server will not reopen it
      // without being told to, and that is not a reason to sign the
      // DA out of his own route: he is offered it back, exactly as he
      // would be if he had typed the code in himself.
      if (res.needsHandover) {
        state.modal = {
          title: 'Route already assigned',
          body: 'This code is assigned to ' + res.claimedBy +
                '. Continue anyway? The handover will be recorded.',
          confirmText: 'Continue',
          confirmAction: 'confirm-handover'
        };
        state.view = 'code';
        render();
        return;
      }

      // His own earlier trip is still open. Also a question, not a
      // refusal.
      if (res.blockingTrip) {
        state.modal = {
          title: 'Close your open trip?',
          body: 'Trip ' + res.blockingTrip + ' is still open. Ending it will ' +
                'record any unmarked orders as not delivered.',
          confirmText: 'End that trip',
          confirmAction: 'close-blocking-trip'
        };
        state.blockingTrip = res.blockingTrip;
        state.view = 'code';
        render();
        return;
      }

      // The server answered and refused outright. That is a real
      // answer: the route was cancelled or replaced. Only now is the
      // saved session worth throwing away.
      if (!res.success || !res.orders) {
        clearSession();
        state.loginName = ''; state.code = '';
        state.error = res.error || '';
        state.view = 'login';
        render();
        return;
      }
      state.reopenError = '';
      state.orders = res.orders;
      state.vehicleNo = res.vehicleNo || state.vehicleNo;
      state.isDemo = !!res.isDemo;
      state.podRequired = !!res.podRequired; locStart();
      state.tripClosed = false;
      overlayPending();
      pumpQueue();
      // Back to the stop they were on, unless it is already done.
      var idx = Number(s.orderIndex || 0);
      state.orderIndex = (idx >= 0 && idx < state.orders.length && !state.orders[idx].currentStatus)
        ? idx : firstPendingIndex();
      state.view = 'order';

      // If the page died while he was taking proof of this stop, give
      // him the photos back. He still has to confirm the delivery, but
      // he does not have to open the camera again - which is what got
      // the page killed in the first place.
      var cur = currentOrder();
      var saved = cur ? loadPodProgress(cur.invoiceNo) : null;
      // Only noted here. The photos are reattached when he starts the
      // mark again, because starting it clears the proof state - so
      // putting them in now would simply lose them a second time.
      if (saved && !cur.currentStatus) state.podRestored = (saved.links || []).length;

      render();
    });
}

/******************** BACKGROUND SAVE QUEUE ********************/
// Marks are applied on screen immediately and sent in the background,
// so the DA never waits on the network. The queue is also written to
// the phone, so closing the app or losing signal never loses a mark.
var pumping = false;
var retryTimer = null;

function enqueueMark(payload){
  saveSession();
  // A re-mark of the same order replaces the older unsent one, so the
  // server only ever receives the DA's latest decision.
  state.pending = state.pending.filter(function(j){
    return !(j.payload.code === payload.code && j.payload.invoiceNo === payload.invoiceNo);
  });
  state.pending.push({ payload: payload, attempts: 0 });
  saveQueue();
  syncIndicators();
  pumpQueue();
}

function saveQueue(){
  try {
    // A practice route must leave nothing behind, not even locally.
    if (state.isDemo) return;
    var jobs = state.pending.filter(function(j){ return !isDemoPayload(j.payload); });
    if (!jobs.length) { localStorage.removeItem('bm_queue'); state.storageFull = false; return; }
    localStorage.setItem('bm_queue', JSON.stringify({ jobs: jobs }));
    state.storageFull = false;
  } catch(e){
    // Browser storage is full - usually several marks waiting with
    // photos still on board. The marks are safe in memory, but a crash
    // or a closed tab would lose them, so this cannot stay silent.
    state.storageFull = true;
    try { syncIndicators(); } catch (e2) {}
  }
}

function isDemoPayload(p){
  return String(p && p.code || '').toUpperCase().indexOf('DEMO') === 0;
}

// Called straight after login, before the DA can choose anything.
// Every saved job carries its own DA name and route code, so it is
// always recorded against the person and route it belongs to - even if
// someone else happens to log in on the same phone.
function restoreQueue(){
  try {
    var raw = localStorage.getItem('bm_queue');
    if (!raw) return 0;
    var saved = JSON.parse(raw);
    var jobs = (saved && saved.jobs) || [];
    if (!jobs.length) return 0;

    var have = {};
    state.pending.forEach(function(j){ have[j.payload.code + '|' + j.payload.invoiceNo] = true; });
    jobs.forEach(function(j){
      var k = j.payload.code + '|' + j.payload.invoiceNo;
      if (!have[k]) { state.pending.push({ payload: j.payload, attempts: 0 }); have[k] = true; }
    });
    syncIndicators();
    return state.pending.length;
  } catch(e){ return 0; }
}

function pumpQueue(){
  if (pumping) return;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  var job = state.pending[0];
  if (!job) { state.syncFailed = false; saveQueue(); syncIndicators(); return; }

  pumping = true;

  // If a reply never arrives - which is what weak signal does - the
  // queue must not freeze. Give up waiting and treat it as a failure,
  // so the next attempt still happens.
  var settled = false;
  var watchdog = setTimeout(function(){
    if (settled) return;
    settled = true;
    pumping = false;
    job.attempts++;
    job.lastError = 'No reply from the server.';
    if (job.attempts >= 2) state.syncFailed = true;
    saveQueue();
    syncIndicators();
    reconcileQueue();
    retryTimer = setTimeout(pumpQueue, 3000);
  }, 25000);

  api('markInvoice', job.payload).then(function(res){
    if (settled) return;
    settled = true;
    clearTimeout(watchdog);
    pumping = false;
    if (res && res.success) {
      state.pending.shift();
      state.syncFailed = rejectedJobs().length > 0;
      clearUnsaved(job.payload);
      saveQueue();
      syncIndicators();
      pumpQueue();
      return;
    }
    job.attempts++;
    job.lastError = (res && res.error) || 'Save failed.';

    // The server answered and refused it. Retrying forever will never
    // help, so mark it rather than calling it a signal problem.
    job.rejected = !!(res && res.success === false && res.error && !res.network);

    if (job.rejected || job.attempts >= 3) state.syncFailed = true;

    // Two failures in a row often means the save worked but the reply
    // was lost. Ask the server what it actually has before retrying.
    if (!job.rejected && job.attempts === 2) reconcileQueue();
    saveQueue();
    syncIndicators();

    // A refused job must not block the good ones behind it.
    if (job.rejected && state.pending.length > 1) {
      state.pending.push(state.pending.shift());
      saveQueue();
    }

    var delay = job.rejected ? 20000
      : Math.min(30000, 1500 * Math.pow(2, Math.min(job.attempts - 1, 4)));
    retryTimer = setTimeout(pumpQueue, delay);
  });
}

// Signal back, or the app brought back to the front: try immediately
// instead of waiting out the retry delay.
// Drops anything the server already holds, so a lost reply does not
// leave the DA staring at "not saved" for work that is done.
var reconciling = false;
function reconcileQueue(){
  if (reconciling || !state.pending.length) return;
  var code = state.pending[0].payload.code;
  var invs = state.pending
    .filter(function(j){ return j.payload.code === code; })
    .map(function(j){ return j.payload.invoiceNo; });
  if (!invs.length) return;

  reconciling = true;
  api('checkSaved', { code: code, invoiceNos: invs }).then(function(res){
    reconciling = false;
    if (!res || !res.success || !res.saved || !res.saved.length) return;
    var done = {};
    res.saved.forEach(function(i){ done[i] = true; });
    state.pending = state.pending.filter(function(j){
      if (j.payload.code === code && done[j.payload.invoiceNo]) {
        clearUnsaved(j.payload);
        return false;
      }
      return true;
    });
    state.syncFailed = rejectedJobs().length > 0;
    saveQueue();
    syncIndicators();
    if (state.view === 'stuck' || state.view === 'order') render();
  });
}

function retryNow(){
  if (!state.pending.length) return;
  // Check what the server already has first, then send what is left.
  reconcileQueue();
  state.pending.forEach(function(j){ if (!j.rejected) j.attempts = 0; });
  pumpQueue();
}

function pendingFor(code, invoiceNo){
  for (var i = 0; i < state.pending.length; i++) {
    var p = state.pending[i].payload;
    if (p.code === code && p.invoiceNo === invoiceNo) return state.pending[i];
  }
  return null;
}

function clearUnsaved(payload){
  for (var i = 0; i < state.orders.length; i++) {
    var o = state.orders[i];
    if (state.code === payload.code && o.invoiceNo === payload.invoiceNo) delete o._unsaved;
  }
}

// After a route loads, show anything still waiting to send as already
// marked - otherwise the DA sees it as unmarked and thinks it was lost.
function overlayPending(){
  state.pending.forEach(function(j){
    var p = j.payload;
    if (p.code !== state.code) return;
    for (var i = 0; i < state.orders.length; i++) {
      var o = state.orders[i];
      if (o.invoiceNo !== p.invoiceNo) continue;
      o.currentStatus = {
        'Status': p.status,
        'Reason': p.reason || '',
        'Payment Mode': p.paymentMode || '',
        'Cash Collected': p.cashCollected || 0,
        'UPI Collected': p.upiCollected || 0
      };
      o._unsaved = true;
    }
  });
}

function rejectedJobs(){
  return state.pending.filter(function(j){ return j.rejected; });
}

function unsavedText(){
  var n = state.pending.length;
  if (!n) return '';

  // Storage is full, so these are held in memory only. Closing the tab
  // or a crash loses them, and the DA is the only one who can stop
  // that happening - so it is said plainly rather than buried.
  if (state.storageFull) {
    return n + (n === 1 ? ' update is' : ' updates are') +
      ' waiting and this phone\u2019s storage is full. ' +
      'Do not close the app. Find signal so they send, or close other ' +
      'browser tabs to free space.';
  }

  if (!state.syncFailed) return 'Saving ' + n + (n === 1 ? ' update' : ' updates') + '\u2026';

  var bad = rejectedJobs();
  if (bad.length) {
    // The server answered and refused these. Retrying will not help, so
    // say what it actually said instead of blaming the signal.
    return bad.length + (bad.length === 1 ? ' update was refused' : ' updates were refused') +
      ': ' + bad[0].lastError + ' \u2014 tap here to see them.';
  }
  return n + (n === 1 ? ' update' : ' updates') +
    ' not saved yet \u2014 no connection. Keep the app open; it will send when signal returns.';
}

// Updates the header badge and the banner in place, so a background
// save never re-renders a form the DA is filling in.
function syncIndicators(){
  var el = document.getElementById('sync-badge');
  if (el) {
    var n = state.pending.length;
    el.textContent = n ? (state.syncFailed ? n + ' not saved' : 'Saving ' + n + '\u2026') : '';
    el.style.display = n ? 'inline' : 'none';
    el.style.color = state.syncFailed ? '#FFD4D4' : 'rgba(255,255,255,0.8)';
  }
  var bar = document.getElementById('sync-banner');
  if (bar) {
    var txt = unsavedText();
    bar.textContent = txt;
    bar.style.display = txt ? 'block' : 'none';
    bar.className = 'sync-banner' + ((state.syncFailed || state.storageFull) ? ' bad' : '');
  }
  // Card tags change as saves land; only redraw screens with no inputs.
  if ((state.view === 'order' || state.view === 'summary') && !state.modal && !state.loading) {
    var tags = document.querySelectorAll('[data-unsaved]');
    for (var i = 0; i < tags.length; i++) {
      var inv = tags[i].getAttribute('data-unsaved');
      if (!pendingFor(state.code, inv)) tags[i].style.display = 'none';
    }
  }
}

// Kept so older call sites still work.
function badgeText(){
  var n = state.pending.length;
  if (!n) return '';
  return state.syncFailed ? n + ' not saved' : 'Saving ' + n + '\u2026';
}
function updateBadge(){ syncIndicators(); }

/******************** ACTIONS ********************/
function doLogin(){
  var nameEl = document.getElementById('login-name');
  var pinEl = document.getElementById('login-pin');
  var name = nameEl ? nameEl.value.trim() : '';
  var pin = pinEl ? pinEl.value.trim() : '';
  if (!name || !pin) { state.error = 'Enter your login name and PIN.'; render(); return; }

  state.loading = true; state.loadingMsg = 'Signing in...'; render();
  // login also returns any open trip, so this is a single round trip.
  api('login', loginPayload(name, pin)).then(function(res){
    state.loading = false;
    if (res && res.needCheckIn) { startCheckin(res, name, pin); return; }
    if (!res || !res.success) {
      state.error = (res && res.error) || 'Login failed.';
      render();
      return;
    }
    loginDone(res, name, pin);
  });
}

// The new app says who it is, so the server only asks it - never the
// old link - for a selfie.
function loginPayload(name, pin){
  var p = { loginName: name, pin: pin };
  if (BM_HOSTED) p.client = 'gh';
  if (BM_HOSTED && BM_SELFIE) p.selfieFlow = true;
  return p;
}

function loginDone(res, name, pin){
  state.checkin = null;
  state.loginName = res.loginName || name;
  state.pin = pin;
  state.openTrip = res.openTrip || null;

  // Anything saved on this phone goes out first, before the DA can
  // choose Resume or End - so End can never overwrite a real mark.
  restoreQueue();
  if (state.pending.length) {
    flushThen(afterLogin);
    return;
  }
  afterLogin();
}

function afterLogin(){
  state.view = state.openTrip ? 'resume' : 'code';
  render();
}

// Tries to send everything waiting, showing progress. If signal is too
// weak it says so plainly and lets the DA carry on - End trip will still
// refuse until the queue is empty.
function flushThen(next){
  state.flushNext = next;
  state.view = 'flush';
  state.flushFailed = false;
  render();
  waitForQueue(function(ok){
    if (ok) { var n = state.flushNext; state.flushNext = null; n(); return; }
    state.flushFailed = true;
    render();
  });
}

function doResume(){
  var t = state.openTrip || {};
  state.loading = true; state.loadingMsg = 'Loading your route...'; render();
  api('enterCode', {
    loginName: state.loginName, code: t.code, vehicleNo: t.vehicleNo,
    isResume: true, confirmHandover: true
  }).then(function(res){
    state.loading = false;
    if (res && res.success) {
      state.code = t.code;
      state.vehicleNo = t.vehicleNo || '';
      state.orders = sortOrders(res.orders);
      state.orderIndex = firstPendingIndex();
      state.tripClosed = false;
      state.view = 'order';
      overlayPending();
      pumpQueue();
      saveSession();
    } else {
      state.error = (res && res.error) || 'Could not resume that trip.';
    }
    render();
  });
}

function doEnterCode(confirmHandover){
  var codeEl = document.getElementById('code-input');
  var vehEl = document.getElementById('vehicle-input');
  var code = state.pendingCode;
  var veh = state.vehicleNo;

  if (!confirmHandover) {
    code = codeEl ? codeEl.value.trim().toUpperCase() : '';
    veh = vehEl ? vehEl.value.trim().toUpperCase() : '';
    if (!code) { state.error = 'Enter your manifest code.'; render(); return; }
    state.pendingCode = code;
    state.vehicleNo = veh;
  }

  state.loading = true; state.loadingMsg = 'Loading your route...'; render();
  api('enterCode', {
    loginName: state.loginName, code: code, vehicleNo: veh,
    confirmHandover: confirmHandover === true
  }).then(function(res){
    state.loading = false;
    if (res && res.needsHandover) {
      state.modal = {
        title: 'Route already assigned',
        body: 'This code is assigned to ' + res.claimedBy + '. Continue anyway? The handover will be recorded.',
        confirmText: 'Continue',
        confirmAction: 'confirm-handover'
      };
      render();
      return;
    }
    if (res && res.blockingTrip) {
      state.modal = {
        title: 'Close your open trip?',
        body: 'Trip ' + res.blockingTrip + ' is still open. Ending it will record any unmarked orders as not delivered.',
        confirmText: 'End that trip',
        confirmAction: 'close-blocking-trip'
      };
      state.blockingTrip = res.blockingTrip;
      render();
      return;
    }
    if (res && res.success) {
      state.code = code;
      state.orders = sortOrders(res.orders);
      state.orderIndex = firstPendingIndex();
      state.tripClosed = false;
      state.isDemo = !!res.isDemo;
      state.podRequired = !!res.podRequired; locStart();
      state.view = 'order';
      if (!state.isDemo) { overlayPending(); pumpQueue(); saveSession(); }
    } else {
      state.error = (res && res.error) || 'Could not load that code.';
    }
    render();
  });
}

function doCloseBlockingTrip(){
  state.modal = null;
  var code = state.blockingTrip;

  // Marks still waiting for that trip must reach the server first.
  // Closing over them would record delivered orders as not attempted -
  // which is exactly what End trip itself refuses to do.
  var waiting = state.pending.filter(function(j){ return j.payload.code === code; });
  if (waiting.length) {
    state.loading = true; state.loadingMsg = 'Saving updates from the old trip\u2026'; render();
    reconcileQueue();
    retryNow();
    waitForQueueCode(code, function(ok){
      state.loading = false;
      if (!ok) {
        var stuck = state.pending
          .filter(function(j){ return j.payload.code === code; })
          .map(function(j){ return shortId(j.payload.invoiceNo); });
        state.modal = {
          title: 'Can\u2019t close that trip yet',
          body: stuck.length + (stuck.length === 1 ? ' update from trip ' : ' updates from trip ') + code +
                ' has not reached the server (' + stuck.join(', ') + '). Closing now would record them as ' +
                'not delivered. Move to better signal and try again.',
          confirmText: 'Try again',
          confirmAction: 'close-blocking-trip',
          cancelText: 'Not now'
        };
        render();
        return;
      }
      doCloseBlockingTrip();
    });
    return;
  }

  state.loading = true; state.loadingMsg = 'Closing old trip...'; render();
  api('endTrip', { loginName: state.loginName, code: code }).then(function(res){
    state.loading = false;
    state.blockingTrip = null;
    if (res && res.success) {
      state.error = '';
      doEnterCode(false);
    } else {
      state.error = (res && res.error) || 'Could not close that trip.';
      render();
    }
  });
}

function sortOrders(list){
  var arr = (list || []).slice();
  arr.sort(function(a,b){ return Number(a.sequence) - Number(b.sequence); });
  return arr;
}

function firstPendingIndex(){
  for (var i = 0; i < state.orders.length; i++) {
    if (!state.orders[i].currentStatus) return i;
  }
  return 0;
}

// Everything up to here settles the money. A delivery then stops on
// the proof screen; a failed delivery already has its own photo and
// goes straight through.
function doConfirmMark(){
  var o = currentOrder();
  if (!o) return;

  if (state.markStatus === 'Delivered' && state.podRequired &&
      state.view !== 'pod' && !podDone()) {
    if (!validateMark()) return;
    state.error = '';
    state.view = 'pod';
    render();
    return;
  }

  submitMark();
}

function podDone(){
  return !!(state.podPhotos.length || state.podSigBase64 || state.podSkipReason);
}

// Split out of doConfirmMark so the proof screen can run the same
// checks before it opens, rather than finding a problem afterwards.
function validateMark(){
  var o = currentOrder();
  if (!o) return false;

  // Validate here so the background queue only ever carries good data.
  if (state.issueOpen) {
    if (!state.issueType) { state.error = 'Pick what was wrong.'; render(); return; }
    if (!String(state.issueItems || '').trim()) {
      state.error = 'Say which items and how many.'; render(); return;
    }
  }

  // The server will not accept a UPI or split payment without proof, so
  // stop it here. Queueing it would leave a mark that can never be sent
  // and cash that is never recorded.
  if (state.markStatus === 'Delivered' && isCodOrder(o) &&
      (state.payMode === 'UPI' || state.payMode === 'Split') &&
      !state.screenshotBase64 && !state.screenshotLink) {
    state.error = 'Take the UPI screenshot before confirming.';
    render();
    return;
  }

  if (state.markStatus === 'Delivered' && isCodOrder(o)) {
    var due = collectedDue(o);
    var sum = (Number(state.cashInput)||0) + (Number(state.upiInput)||0);
    if (Math.abs(sum - due) > 0.01) {
      state.error = 'Cash + UPI must equal ' + money(due) + '. Currently ' + money(sum) + '.';
      render();
      return;
    }
  }

  if (state.markStatus === 'Delivered') {
    var pend = (o.returns || []).filter(function(r){ return !r._collected && !r._deferred; });
    if (pend.length) {
      state.error = 'Collect the pending return for this shop first, or mark the order not delivered.';
      render();
      return;
    }
  }

  return true;
}

function submitMark(){
  var o = currentOrder();
  if (!o) return;
  if (!validateMark()) { state.view = 'mark'; render(); return; }

  delete o._saved;

  var payload = {
    loginName: state.loginName,
    code: state.code,
    invoiceNo: o.invoiceNo,
    shopPhone: o.phone,
    shopName: cleanName(o.partyName),
    status: state.markStatus,
    orderType: o.orderType,
    balanceDue: o.balanceDue
  };
  var fix = locForMark();
  if (fix) {
    payload.lat = fix.lat; payload.lng = fix.lng;
    payload.acc = fix.acc; payload.locAt = fix.at;
  }
  // The next stop gets a fresh fix.
  locTick();

  if (state.markStatus === 'Delivered') {
    if (state.issueOpen) {
      payload.issueType = state.issueType;
      payload.issueDetails = state.issueItems.trim() +
        (state.issueNote.trim() ? ' \u2014 ' + state.issueNote.trim() : '');
    }

    if (isCodOrder(o)) {
      payload.paymentMode = state.payMode;
      payload.cashCollected = Number(state.cashInput || 0);
      payload.upiCollected = Number(state.upiInput || 0);
      payload.collectedAmount = collectedDue(o);
      if (state.amountChoice === 'diff') {
        payload.shortReason = state.shortReason +
          (state.shortNote ? ' \u2014 ' + state.shortNote : '');
      }
    }
  } else {
    var rs = document.getElementById('reason-select');
    if (rs) state.reasonInput = rs.value;
    payload.reason = state.reasonInput;
  }

  // Prefer the link from the background upload; fall back to raw data
  // if the upload has not finished yet.
  var anyDeferred = (o.returns || []).some(function(r){ return r._deferred; });
  if (anyDeferred) payload.returnDeferred = true;

  if (state.screenshotLink) {
    payload.screenshotLink = state.screenshotLink;
  } else if (state.screenshotBase64) {
    payload.screenshotBase64 = state.screenshotBase64;
    payload.screenshotMime = state.screenshotMime;
  }

  // Proof of delivery. The link is preferred so a queued mark stays
  // small; the raw image only travels when the upload has not landed.
  if (state.markStatus === 'Delivered') {
    // A link per photo that finished uploading, the raw image for any
    // that did not, so a queued mark stays as small as it can be.
    var links = [], raw = [];
    state.podPhotos.forEach(function(sh){
      if (sh.link) links.push(sh.link);
      else if (sh.base64) raw.push({ base64: sh.base64, mime: sh.mime });
    });
    if (links.length) payload.podPhotoLinks = links;
    if (raw.length) payload.podPhotoShots = raw;
    if (state.podSigBase64) payload.podSignatureBase64 = state.podSigBase64;
    if (state.podSkipReason) {
      payload.podSkipReason = state.podSkipReason +
        (state.podSkipNote.trim() ? ' \u2014 ' + state.podSkipNote.trim() : '');
    }
  }

  // Apply on screen straight away, then send in the background.
  o.currentStatus = {
    'Status': state.markStatus,
    'Reason': payload.reason || '',
    'Payment Mode': payload.paymentMode || '',
    'Cash Collected': payload.cashCollected || 0,
    'UPI Collected': payload.upiCollected || 0
  };

  enqueueMark(payload);

  resetMarkState();
  resetPodState();
  state.view = 'order';
  var next = firstPendingIndex();
  if (state.orders[next] && !state.orders[next].currentStatus) state.orderIndex = next;
  saveSession();
  render();
}

// Polls until the background queue drains. Gives up after ~60s so a
// dead connection doesn't hang the DA on this screen forever.
// Waits only for the marks belonging to one route.
function waitForQueueCode(code, cb){
  var waited = 0;
  pumpQueue();
  var timer = setInterval(function(){
    var left = state.pending.filter(function(j){ return j.payload.code === code; }).length;
    if (!left) { clearInterval(timer); cb(true); return; }
    waited += 1000;
    if (waited >= 12000) { clearInterval(timer); cb(false); }
  }, 1000);
}

function waitForQueue(cb){
  var waited = 0;
  pumpQueue();
  var timer = setInterval(function(){
    if (!state.pending.length) { clearInterval(timer); cb(true); return; }
    waited += 1000;
    // Give up quickly and tell the DA which orders are stuck, rather
    // than leaving them staring at a spinner for a minute.
    if (waited >= 10000) { clearInterval(timer); cb(false); }
  }, 1000);
}

function doCollectReturn(){
  var rq = state.collectingReturn;
  if (!rq) return;
  if (!state.returnPhoto) { state.error = 'Take a photo first.'; render(); return; }

  state.loading = true; state.loadingMsg = 'Saving return...'; render();
  api('collectReturn', {
    loginName: state.loginName,
    code: state.code,
    requestId: rq.requestId,
    screenshotBase64: state.returnPhoto,
    screenshotMime: state.returnPhotoMime
  }).then(function(res){
    state.loading = false;
    if (!res || !res.success) {
      state.error = (res && res.error) || 'Could not save that.';
      render();
      return;
    }
    // The request belongs to the shop, so clear it everywhere it shows.
    for (var i = 0; i < state.orders.length; i++) {
      var list = state.orders[i].returns || [];
      for (var j = 0; j < list.length; j++) {
        if (list[j].requestId === rq.requestId) list[j]._collected = true;
      }
    }
    state.collectingReturn = null;
    state.returnPhoto = null; state.returnPhotoMime = null; state.returnPhotoPreview = null;
    state.view = 'order';
    render();
  });
}

function doDeferReturn(){
  var rq = state.collectingReturn;
  if (!rq) return;
  var el = document.getElementById('defer-reason');
  state.deferReason = el ? el.value.trim() : '';
  if (!state.deferReason) { state.error = 'Give a short reason.'; render(); return; }

  state.loading = true; state.loadingMsg = 'Saving...'; render();
  api('deferReturn', {
    loginName: state.loginName,
    requestId: rq.requestId,
    reason: state.deferReason
  }).then(function(res){
    state.loading = false;
    if (!res || !res.success) {
      state.error = (res && res.error) || 'Could not save that.';
      render();
      return;
    }
    // Stays open for next time, but no longer blocks today's delivery.
    for (var i = 0; i < state.orders.length; i++) {
      var list = state.orders[i].returns || [];
      for (var j = 0; j < list.length; j++) {
        if (list[j].requestId === rq.requestId) list[j]._deferred = true;
      }
    }
    state.deferring = false;
    state.collectingReturn = null;
    state.deferReason = '';
    state.view = 'order';
    render();
  });
}

function doEndTrip(fromResume){
  state.modal = null;

  // Let queued marks land first, so End trip cannot record an order as
  // not attempted while its real status is still in flight.
  if (state.pending.length) {
    state.loading = true; state.loadingMsg = 'Saving your updates\u2026'; render();
    waitForQueue(function(ok){
      state.loading = false;
      if (!ok) {
        // Never end over unsent marks: that would record delivered orders
        // as not attempted. Ending genuinely needs signal, so say so.
        var stuck = state.pending.map(function(j){ return shortId(j.payload.invoiceNo); });
        state.modal = {
          title: 'Can\u2019t end the trip yet',
          body: stuck.length + (stuck.length === 1 ? ' update has' : ' updates have') +
                ' not reached the server (' + stuck.join(', ') + '). They are saved on this phone. ' +
                'Move to better signal and tap Try again.',
          confirmText: 'Try again',
          confirmAction: fromResume ? 'do-end-trip-resume' : 'do-end-trip',
          cancelText: 'Not now'
        };
        render();
        return;
      }
      doEndTrip(fromResume);
    });
    return;
  }

  var code = fromResume ? (state.openTrip ? state.openTrip.code : state.code) : state.code;
  state.endingFromResume = !!fromResume;
  state.closeError = '';
  state.tripNote = '';
  state.closing = true;

  // Show the report screen immediately; the request runs behind it.
  state.view = 'closing';
  render();
  fireCloseRequest(code, '');
}

function fireCloseRequest(code, note){
  state.closing = true;
  api('endTrip', {
    loginName: state.loginName, code: code, tripNote: note || ''
  }).then(function(res){
    state.closing = false;
    if (!res || !res.success) {
      state.closeError = (res && res.error) || 'Could not end the trip.';
      render();
      return;
    }
    state.closeError = '';
    applyTripClosedLocally();
    if (state.view === 'closing') render();
  });
}

function applyTripClosedLocally(){
  if (state.endingFromResume) return;
  for (var i = 0; i < state.orders.length; i++) {
    if (!state.orders[i].currentStatus) {
      state.orders[i].currentStatus = {
        'Status': 'Not Delivered',
        'Reason': 'Trip ended \u2014 not attempted',
        'Cash Collected': 0, 'UPI Collected': 0
      };
    }
  }
  state.tripClosed = true;
}

function finishClose(){
  var code = state.endingFromResume
    ? (state.openTrip ? state.openTrip.code : state.code)
    : state.code;

  // If a note was typed after the close already went through, save it
  // on its own rather than closing twice.
  if (state.tripNote && !state.closing && !state.closeError) {
    api('endTrip', { loginName: state.loginName, code: code, tripNote: state.tripNote });
  }

  if (state.closing) {
    state.loading = true; state.loadingMsg = 'Closing your trip\u2026'; render();
    var tries = 0;
    var t = setInterval(function(){
      tries++;
      if (!state.closing) {
        clearInterval(t);
        state.loading = false;
        if (state.closeError) { render(); return; }
        goAfterClose();
        return;
      }
      if (tries > 20) { clearInterval(t); state.loading = false; render(); }
    }, 500);
    return;
  }

  if (state.closeError) { render(); return; }
  goAfterClose();
}

function goAfterClose(){
  clearSession();
  if (state.endingFromResume) {
    state.openTrip = null;
    state.orders = [];
    state.code = '';
    state.vehicleNo = '';
    state.view = 'code';
  } else {
    state.tripClosed = true;
    state.view = 'summary';
  }
  render();
}

function doReopenTrip(){
  state.loading = true; state.loadingMsg = 'Reopening trip...'; render();
  api('reopenTrip', { loginName: state.loginName, code: state.code }).then(function(res){
    state.loading = false;
    if (!res || !res.success) {
      state.error = (res && res.error) || 'Could not reopen the trip.';
      render();
      return;
    }
    for (var i = 0; i < state.orders.length; i++) {
      var cs = state.orders[i].currentStatus;
      if (cs && cs['Reason'] === 'Trip ended \u2014 not attempted') {
        state.orders[i].currentStatus = null;
      }
    }
    state.tripClosed = false;
    state.orderIndex = firstPendingIndex();
    state.view = 'order';
    render();
  });
}

function doSavePin(){
  var cur = document.getElementById('cur-pin');
  var np = document.getElementById('new-pin');
  var np2 = document.getElementById('new-pin2');
  var curV = cur ? cur.value.trim() : '';
  var newV = np ? np.value.trim() : '';
  var new2V = np2 ? np2.value.trim() : '';

  state.profileMsg = '';
  if (!curV || !newV || !new2V) { state.error = 'Fill in all fields.'; render(); return; }
  if (newV !== new2V) { state.error = 'New PINs do not match.'; render(); return; }
  if (newV.length < 4) { state.error = 'New PIN must be at least 4 characters.'; render(); return; }

  state.loading = true; state.loadingMsg = 'Updating PIN...'; render();
  api('changePin', { loginName: state.loginName, currentPin: curV, newPin: newV }).then(function(res){
    state.loading = false;
    if (res && res.success) {
      state.pin = newV;
      state.profileMsg = 'PIN updated.';
    } else {
      state.error = (res && res.error) || 'Could not update PIN.';
    }
    render();
  });
}

/******************** PWA INSTALL ********************/
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  state.deferredInstall = e;
  render();
});

/******************** BOOT ********************/
function boot(){
  setTheme(getTheme());
  document.addEventListener('click', function(){
    if (state.menuOpen) { state.menuOpen = false; render(); }
  });

  // Signal returned, or the app came back to the front: send now rather
  // than waiting out the retry delay.
  window.addEventListener('online', retryNow);
  // A camera left running in the background holds memory and the
  // light; the photos already taken are kept.
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && cam.el) closeCamera();
    if (!document.hidden) locTick();
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') retryNow();
  });

  // Marks left over from last time start sending as soon as the page
  // opens - each one already carries its own DA name and route.
  if (restoreQueue()) pumpQueue();

  // Back button, closed tab, phone locked - reopen where they were
  // rather than dropping them on the login screen.
  var sess = loadSession();
  if (sess) { resumeSession(sess); return; }

  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
<script>
// A phone showing the app as a tiny column in the middle of a wide page
// is Chrome's "Desktop site" switch: the page is laid out 980px wide and
// shrunk to fit, whatever the page asks for. Only the phone can turn it
// off, so say how.
(function(){
  function check(){
    var phone = Math.min(screen.width, screen.height) <= 600;
    var wide = (document.documentElement.clientWidth || window.innerWidth) >= 900;
    var el = document.getElementById('bm-desktop-mode');
    if (phone && wide) {
      if (el) return;
      el = document.createElement('div');
      el.id = 'bm-desktop-mode';
      el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#B42318;color:#fff;' +
        'font:600 34px/1.35 Arial,sans-serif;padding:26px 30px;text-align:center;';
      el.innerHTML = 'The app looks tiny because <b>Desktop site</b> is on.<br>' +
        'Tap Chrome\u2019s \u22ee menu (top right) and <b>untick \u201cDesktop site\u201d</b>.<br>' +
        '<span style="font-weight:400;">Chrome \u22ee menu \u2192 \u201cDesktop site\u201d hata dein.</span>';
      document.body.appendChild(el);
    } else if (el) { el.remove(); }
  }
  window.addEventListener('load', check);
  window.addEventListener('resize', check);
})();
</script>
<script>
// Keeps the app on the phone. Registered after load so it never
// slows the first screen down.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
