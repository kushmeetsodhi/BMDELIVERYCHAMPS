/******************** THEME ********************/
function getTheme(){
  try { return localStorage.getItem('bm_theme') || 'light'; } catch(e){ return 'light'; }
}
function setTheme(t){
  try { localStorage.setItem('bm_theme', t); } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme(){
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
  render();
}

/******************** API ********************/
// Set by config.js on the GitHub copy of the app; absent inside Apps
// Script. Everything that differs between the two copies keys off it.
var BM_HOSTED = !!(typeof window !== 'undefined' && window.BM_EXEC_URL);

function api(action, payload, timeoutMs){
  return new Promise(function(resolve){
    var data = { action: action };
    for (var k in payload) { if (payload.hasOwnProperty(k)) data[k] = payload[k]; }

    if (!BM_HOSTED &&
        (typeof google === 'undefined' || !google.script || !google.script.run)) {
      resolve({ success:false, network:true,
                error:'Cannot reach the server. Check your connection.' });
      return;
    }

    // google.script.run can simply never call back - a weak signal
    // while the page is reloading does it - and without a clock on it
    // the screen waits for ever. Only callers that pass a timeout get
    // one: a photo upload on a bad connection is slow but working,
    // and cutting it off would throw away the DA's picture.
    var settled = false;
    var watchdog = null;
    var done = function(r){
      if (settled) return;
      settled = true;
      if (watchdog) clearTimeout(watchdog);
      resolve(r);
    };
    if (timeoutMs) {
      watchdog = setTimeout(function(){
        done({ success:false, network:true, timedOut:true,
               error:'The server did not answer.' });
      }, timeoutMs);
    }

    if (BM_HOSTED) {
      // The same doPost the backend has always had. text/plain keeps
      // this a "simple" request, so the browser sends it straight away
      // instead of first asking permission - a question Apps Script
      // cannot answer. No cookies: the DA's PIN is the login, not a
      // Google account, and sending credentials would break CORS.
      fetch(window.BM_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data),
        redirect: 'follow',
        credentials: 'omit',
        cache: 'no-store'
      }).then(function(r){ return r.text(); })
        .then(function(t){
          try { done(JSON.parse(t)); }
          catch(e){
            // A Google sign-in page instead of JSON: the deployment is
            // not open to Anyone. Kept as a network failure so queued
            // marks wait instead of being thrown away.
            done({ success:false, network:true,
                   error:'The server sent a page instead of an answer.' });
          }
        })
        .catch(function(){
          done({ success:false, network:true,
                 error:'Cannot reach the server. Check your connection.' });
        });
      return;
    }

    google.script.run
      .withSuccessHandler(function(res){
        try { done(typeof res === 'string' ? JSON.parse(res) : res); }
        catch(e){ done({ success:false, error:'Malformed server response.' }); }
      })
      .withFailureHandler(function(err){
        // Could not reach the server at all - a real network failure.
        done({ success:false, network:true,
               error: (err && err.message) ? err.message : 'Connection failed.' });
      })
      .apiCall(JSON.stringify(data));
  });
}

/******************** UTILS ********************/
function money(n){
  return '\u20B9' + (Math.round((Number(n)||0)*100)/100).toLocaleString('en-IN');
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
// SO-2026-29883 -> SO-29883 (display only; full value still sent to server)
function shortId(s){
  return String(s == null ? '' : s).replace(/^([A-Za-z]+)-\d{4}-(\d+)$/, '$1-$2');
}
// Party Name arrives as "Kashish Store (SO-2026-30272)" - drop the
// bracketed order id so the shop name reads cleanly.
function cleanName(s){
  return String(s == null ? '' : s).replace(/\s*\([^)]*\)\s*$/, '').trim();
}
// What the DA should actually collect: the invoice, unless they
// recorded a lower amount.
function collectedDue(o){
  if (state.amountChoice === 'diff' && state.collectedInput !== '') {
    return Number(state.collectedInput) || 0;
  }
  return Number(o && o.balanceDue || 0);
}

function isCodOrder(o){
  var t = String(o && o.orderType || '').trim().toLowerCase();
  if (t === 'cod' || t === 'c.o.d' || t === 'c.o.d.' ||
      t.indexOf('cash on delivery') > -1 || t.indexOf('cash') > -1 || t.indexOf('cod') > -1) return true;
  if (t.indexOf('prepaid') > -1 || t.indexOf('paid') > -1 || t.indexOf('advance') > -1 ||
      t.indexOf('upi') > -1 || t.indexOf('online') > -1) return false;
  // Type missing or unrecognised: if money is owed, ask the DA to collect
  // it. Treating it as prepaid is how cash goes uncollected.
  return Number(o && o.balanceDue || 0) > 0;
}

/******************** IMAGE COMPRESSION ********************/
// Shrinks a phone photo (often 3-5 MB) to roughly 150-250 KB before
// upload. Keeps screenshots and proof photos perfectly legible while
// making uploads fast enough to work on patchy mobile data.
/******************** LOCATION ********************/
// GitHub copy only. While the app is open on a route, the phone's
// position goes to the Control Room every few minutes, and the latest
// fix rides along with every stop marked so a delivery marked far from
// the shop stands out. Chrome stops a page reading the location once it
// is in the background, so nothing is sent while the app is closed.
// The switch. Off unless config.js on the GitHub copy turns it on, so
// sharing can be paused without rebuilding the app.
var BM_TRACK = !!(typeof window !== 'undefined' && window.BM_TRACK_LOCATION === true);
// Selfie check-in at the first login of the day, inside the warehouse
// fence. Same switch arrangement: off unless config.js turns it on.
var BM_SELFIE = !!(typeof window !== 'undefined' && window.BM_SELFIE_LOGIN === true);
var LOC_EVERY_MS = 180000;      // how often a position is sent
var LOC_FRESH_MS = 300000;      // a fix older than this is not sent with a mark
var loc = { timer: null, last: null, sentAt: 0, state: '' };   // state: '', 'on', 'off'

function locActive(){
  return BM_HOSTED && BM_TRACK && !!navigator.geolocation && !!state.code && !state.isDemo &&
         ['login', 'checkin', 'code', 'closing', 'reopen'].indexOf(state.view) === -1;
}

function locStart(){
  if (!BM_HOSTED || !BM_TRACK || !navigator.geolocation || loc.timer) return;
  loc.timer = setInterval(function(){ locTick(); }, LOC_EVERY_MS);
  // The route screen is drawn just after this is called; the first read
  // waits for it, or the "not on a route yet" check would skip it.
  setTimeout(locTick, 1500);
}

function locStop(){
  if (loc.timer) clearInterval(loc.timer);
  loc.timer = null;
  loc.last = null;
  loc.sentAt = 0;
}

// Read the position and, unless one went out within the last minute,
// send it. Only when the app is actually on screen and on a route.
function locTick(){
  if (!locActive() || document.hidden) return;
  navigator.geolocation.getCurrentPosition(function(p){
    loc.last = { lat: p.coords.latitude, lng: p.coords.longitude,
                 acc: Math.round(p.coords.accuracy || 0), at: Date.now() };
    locSetState('on');
    if (Date.now() - loc.sentAt < 60000 || !locActive()) return;
    loc.sentAt = Date.now();
    api('ping', { loginName: state.loginName, code: state.code,
                  lat: loc.last.lat, lng: loc.last.lng, acc: loc.last.acc,
                  locAt: loc.last.at }, 15000);
  }, function(err){
    // 1 = the DA said no. Anything else is a moment without a fix.
    if (err && err.code === 1) locSetState('off');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}

function locSetState(s){
  if (loc.state === s) return;
  loc.state = s;
  var el = document.getElementById('loc-flag');
  if (el) { el.textContent = locFlagText(); el.className = 'loc-flag ' + s; }
}
function locFlagText(){
  return loc.state === 'on' ? 'GPS on' : loc.state === 'off' ? 'GPS off' : '';
}

// The fix that goes with a mark, if it is recent enough to mean
// "where the DA was standing".
function locForMark(){
  if (!loc.last || Date.now() - loc.last.at > LOC_FRESH_MS) return null;
  return loc.last;
}

/******************** IN-APP CAMERA ********************/
// The camera app is what gets the page killed: Android hands the phone
// to it and, short of memory, closes Chrome behind it. A viewfinder
// inside the page never leaves it. Apps Script forbids camera access in
// its frame, so this only runs on the hosted copy.
var cam = { stream: null, el: null, taken: 0, mode: 'pod' };   // mode: 'pod' or 'selfie'

function inAppCamera(){
  return BM_HOSTED && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function cameraErrorText(err){
  var n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') {
    return 'The camera is blocked for this app. In Chrome tap the lock icon next to the ' +
           'address, then Permissions → Camera → Allow. Or use Upload from gallery.';
  }
  if (n === 'NotFoundError' || n === 'OverconstrainedError') {
    return 'No camera was found on this phone. Use Upload from gallery.';
  }
  if (n === 'NotReadableError') {
    return 'Another app is using the camera. Close it and try again.';
  }
  return 'The camera could not start' + (n ? ' (' + n + ')' : '') + '. Use Upload from gallery.';
}

function camSet(id, text){
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}
function camCount(){
  camSet('cam-n', cam.mode === 'selfie' ? '' : camList().length + ' / ' + camMax());
}
// The photos the open camera is adding to: a delivery's proof, or the
// return proof being taken at the end of the trip.
function camList(){ return cam.mode === 'ret' && state.rp ? state.rp.photos : state.podPhotos; }
function camMax(){ return cam.mode === 'ret' ? RP_MAX_PHOTOS : POD_MAX_PHOTOS; }

function openCamera(mode){
  mode = mode === 'selfie' ? 'selfie' : mode === 'ret' ? 'ret' : 'pod';
  if (cam.el) return;
  cam.mode = mode;
  if (mode !== 'selfie' && camList().length >= camMax()) return;
  state.error = '';
  var el = document.createElement('div');
  el.id = 'cam';
  el.className = 'cam' + (mode === 'selfie' ? ' selfie' : '');
  // Outside #app on purpose: the app redraws #app wholesale, and a
  // redraw must never tear down a live video stream.
  el.innerHTML =
    '<video id="cam-v" autoplay playsinline muted></video>' +
    '<div class="cam-msg" id="cam-msg">Starting camera…</div>' +
    '<div class="cam-bar">' +
      '<button type="button" class="cam-done" id="cam-done">Done</button>' +
      '<button type="button" class="cam-shoot" id="cam-shoot" aria-label="Take photo"></button>' +
      '<span class="cam-n" id="cam-n"></span>' +
    '</div>';
  document.body.appendChild(el);
  cam.el = el;
  cam.taken = 0;
  camCount();
  document.getElementById('cam-done').addEventListener('click', function(){ closeCamera(); });
  document.getElementById('cam-shoot').addEventListener('click', shootCamera);

  navigator.mediaDevices.getUserMedia({
    audio: false,
    // Back camera, and no bigger than the photo we keep - a 4K stream
    // costs memory the phone does not have.
    video: { facingMode: { ideal: mode === 'selfie' ? 'user' : 'environment' },
             width: { ideal: 1280 }, height: { ideal: 960 } }
  }).then(function(stream){
    if (!cam.el) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    cam.stream = stream;
    var v = document.getElementById('cam-v');
    v.srcObject = stream;
    var pl = v.play && v.play();
    if (pl && pl.catch) pl.catch(function(){});
    camSet('cam-msg', '');
  }).catch(function(err){
    var selfie = cam.mode === 'selfie';
    closeCamera(true);
    state.error = selfie
      ? cameraErrorText(err).replace(/ ?(Or use|Use) Upload from gallery\.?/, '') +
        ' The selfie is needed to check in.'
      : cameraErrorText(err);
    render();
  });
}

function shootCamera(){
  var v = document.getElementById('cam-v');
  if (!cam.stream || !v || !v.videoWidth) return;
  if (cam.mode === 'selfie') { shootSelfie(v); return; }
  var list = camList(), max = camMax();
  if (list.length >= max) { closeCamera(); return; }

  // Same size and quality as a compressed camera-app photo, so the
  // server and the thumbnails see no difference.
  var maxEdge = 1000;
  var w = v.videoWidth, h = v.videoHeight;
  if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
  else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(v, 0, 0, w, h);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.6);
  canvas.width = 1; canvas.height = 1;

  list.push({ base64: dataUrl.split(',')[1], mime: 'image/jpeg',
              link: null, uploading: false });
  cam.taken++;
  camCount();
  // Start sending now; the DA may take several before tapping Done.
  if (cam.mode === 'ret') rpUpload(); else uploadPodPhotos();

  if (cam.el) {
    cam.el.classList.add('flash');
    setTimeout(function(){ if (cam.el) cam.el.classList.remove('flash'); }, 150);
  }
  if (list.length >= max) closeCamera();
}

// One face, small: enough to recognise someone, cheap to send at login.
function shootSelfie(v){
  var maxEdge = 640;
  var w = v.videoWidth, h = v.videoHeight;
  if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
  else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(v, 0, 0, w, h);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  canvas.width = 1; canvas.height = 1;
  if (state.checkin) state.checkin.selfie = dataUrl.split(',')[1];
  closeCamera(true);
  render();
}

// quiet: the caller draws the screen itself (the error path).
function closeCamera(quiet){
  if (cam.stream) {
    cam.stream.getTracks().forEach(function(t){ t.stop(); });
    cam.stream = null;
  }
  if (cam.el && cam.el.parentNode) cam.el.parentNode.removeChild(cam.el);
  cam.el = null;
  var took = cam.taken;
  cam.taken = 0;
  if (!quiet && took) render();
}

/**
 * Why a gallery photo cannot be used, or '' when it can. lastModified is
 * when the phone wrote the file, which for a camera shot is when it was
 * taken. Some pickers hand over a fresh copy stamped "now" - that passes,
 * which is the safe way round to be wrong. A missing stamp also passes:
 * refusing it would lock out a DA whose phone simply does not say.
 */
function podGalleryRefusal(file, nowMs){
  var t = Number(file && file.lastModified) || 0;
  if (!t) return '';
  var ageMin = ((nowMs || Date.now()) - t) / 60000;
  if (ageMin <= POD_GALLERY_MAX_AGE_MIN) return '';
  var d = new Date(t);
  var hh = d.getHours(), mm = d.getMinutes();
  var when = (hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM');
  var sameDay = new Date(nowMs || Date.now()).toDateString() === d.toDateString();
  return 'That photo was taken ' + (sameDay ? 'at ' + when : 'on ' + d.toDateString()) +
         '. Take a fresh photo of the goods at this shop and upload that.';
}

// Camera or gallery, one or several files: each is shrunk, kept as
// base64 only, and sent while the signature is being taken.
function addPodFiles(input, fromGallery){
  var files = [];
  var list = input.files || [];
  for (var i = 0; i < list.length; i++) files.push(list[i]);
  try { input.value = ''; } catch (e) {}   // or picking the same file twice does nothing
  if (!files.length) return;

  state.error = '';
  if (fromGallery) {
    var now = Date.now();
    var refused = [];
    files = files.filter(function(f){
      var why = podGalleryRefusal(f, now);
      if (why) refused.push(why);
      return !why;
    });
    if (refused.length) state.error = refused[0];
  }
  var room = POD_MAX_PHOTOS - state.podPhotos.length;
  if (files.length > room) {
    files = files.slice(0, Math.max(room, 0));
    if (!state.error) state.error = 'Only ' + POD_MAX_PHOTOS + ' photos fit on one delivery.';
  }
  if (!files.length) { render(); return; }

  state.loading = true; state.loadingMsg = 'Preparing photo...'; render();
  (function next(){
    var f = files.shift();
    if (!f) {
      state.loading = false;
      render();
      uploadPodPhotos();
      return;
    }
    compressImage(f, function(out){
      if (state.podPhotos.length < POD_MAX_PHOTOS) {
        state.podPhotos.push({ base64: out.base64, mime: out.mime,
                               link: null, uploading: false });
      }
      next();
    });
  })();
}

function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      // A proof photo has to show the goods and the shop front, not
      // be enlarged. Every pixel here is held in memory twice over
      // until the upload lands, and a phone with the browser already
      // full has little to spare.
      var maxEdge = 1000;
      var w = img.width, h = img.height;
      if (w > h && w > maxEdge) { h = Math.round(h * maxEdge / w); w = maxEdge; }
      else if (h >= w && h > maxEdge) { w = Math.round(w * maxEdge / h); h = maxEdge; }

      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);

      var dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      // The canvas is the largest thing on the heap here. Shrink it to
      // nothing now rather than waiting for the collector.
      canvas.width = 1; canvas.height = 1;
      cb({ dataUrl: dataUrl, mime: 'image/jpeg', base64: dataUrl.split(',')[1] });
    };
    img.onerror = function(){
      cb({ dataUrl: reader.result, mime: file.type || 'image/jpeg', base64: String(reader.result).split(',')[1] });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/******************** RENDER ********************/
function render(){
  var app = document.getElementById('app');
  if(!app) return;
  var inner = state.loading
    ? '<div class="spinner">' + esc(state.loadingMsg) + '</div>'
    : bodyHTML();
  var demoBar = state.isDemo
    ? '<div class="demo-bar">PRACTICE ROUTE \u2014 nothing is saved</div>' : '';
  var ut = unsavedText();
  var syncBar = '<div id="sync-banner" class="sync-banner' + (state.syncFailed ? ' bad' : '') +
    '"' + (state.syncFailed ? ' data-action="show-stuck"' : '') +
    ' style="display:' + (ut ? 'block' : 'none') + ';">' + esc(ut) + '</div>';
  app.innerHTML = topbarHTML() + demoBar + syncBar + '<div class="content">' + inner + '</div>' + modalHTML();
  attachEvents();
}

function topbarHTML(){
  var bits = [];
  if (state.view !== 'login') {
    if (state.loginName) bits.push(esc(state.loginName));
    if (state.code) bits.push(esc(state.code));
    if (state.vehicleNo) bits.push(esc(state.vehicleNo));
    if (BM_HOSTED && BM_TRACK && state.code && loc.state) {
      bits.push('<span id="loc-flag" class="loc-flag ' + loc.state + '">' + locFlagText() + '</span>');
    }
  }
  var sub = bits.join(' \u00b7 ');
  var menu = menuHTML();

  var badge = badgeText();
  var badgeEl = '<span id="sync-badge" class="sync-badge" style="display:' +
    (badge ? 'inline' : 'none') + ';">' + esc(badge) + '</span>';

  return '<div class="topbar">' +
    '<div><div class="brand">BM Delivery Champs</div>' +
    '<div class="sub">' + sub + (sub && badge ? ' \u00b7 ' : '') + badgeEl + '</div>' +
    '</div>' + menu + '</div>';
}

function menuHTML(){
  var drop = '';
  if (state.menuOpen) {
    var dark = getTheme() === 'dark';
    var items = '';
    // Reachable even before logging in, since a stuck queue can outlive
    // a session and the DA must be able to see what it is.
    if (state.pending.length) {
      items += '<div class="menu-item" data-action="menu-stuck">' +
               '<span>Updates not saved</span>' +
               '<span class="tag">' + state.pending.length + '</span></div>';
    }
    if (state.view !== 'login') {
      items += '<div class="menu-item" data-action="open-profile">Profile</div>';
    }
    items += '<div class="menu-item" data-action="toggle-theme">' +
             '<span>Dark mode</span>' +
             '<span class="switch' + (dark ? ' on' : '') + '"><i></i></span></div>';
    if (state.deferredInstall) {
      items += '<div class="menu-item" data-action="install-app">Install app</div>';
    }
    if (state.view === 'order' || state.view === 'summary') {
      items += '<div class="menu-item danger" data-action="ask-end-trip">End trip</div>';
    }
    if (state.view !== 'login') {
      items += '<div class="menu-item" data-action="logout">Log out</div>';
    }
    drop = '<div class="menu-drop">' + items + '</div>';
  }
  return '<div class="menu-wrap"><button class="menu-btn" data-action="toggle-menu">\u22ee</button>' + drop + '</div>';
}

function bodyHTML(){
  if(state.view === 'login')   return loginHTML();
  if(state.view === 'checkin') return checkinHTML();
  if(state.view === 'resume')  return resumeHTML();
  if(state.view === 'reopen')  return reopenHTML();
  if(state.view === 'code')    return codeHTML();
  if(state.view === 'order')   return orderHTML();
  if(state.view === 'mark')    return markHTML();
  if(state.view === 'collect') return collectHTML();
  if(state.view === 'pod')     return podHTML();
  if(state.view === 'closing') return closingHTML();
  if(state.view === 'flush') return flushHTML();
  if(state.view === 'stuck') return stuckHTML();
  if(state.view === 'summary') return summaryHTML();
  if(state.view === 'retproof') return retproofHTML();
  if(state.view === 'profile') return profileHTML();
  return '';
}

function errHTML(){
  return state.error ? '<div class="err">' + esc(state.error) + '</div>' : '';
}

/******************** SELFIE CHECK-IN ********************/
// First login of the day on the new app: a selfie from the front camera
// and the phone's position, checked against the warehouse fence by the
// server. Staff are never asked; the server decides who is.
function startCheckin(res, name, pin){
  var keep = state.checkin && state.checkin.name === name ? state.checkin : null;
  state.checkin = {
    name: res.loginName || name, pin: pin, fence: res.fence || (keep && keep.fence) || null,
    selfie: keep ? keep.selfie : null,
    loc: keep ? keep.loc : null, locBusy: false, locErr: ''
  };
  state.error = res.error || '';
  state.view = 'checkin';
  render();
  // A refused attempt keeps the selfie but always takes a fresh fix.
  if (!res.error || res.reason === 'outside' || res.reason === 'vague' || res.reason === 'nolocation') {
    checkinLocate();
  }
}

function checkinLocate(){
  var c = state.checkin;
  if (!c || c.locBusy) return;
  if (!navigator.geolocation) { c.locErr = 'This phone cannot share its location.'; render(); return; }
  c.locBusy = true; c.locErr = ''; render();
  navigator.geolocation.getCurrentPosition(function(p){
    if (state.checkin !== c) return;
    c.locBusy = false;
    c.loc = { lat: p.coords.latitude, lng: p.coords.longitude,
              acc: Math.round(p.coords.accuracy || 0), at: Date.now() };
    render();
  }, function(err){
    if (state.checkin !== c) return;
    c.locBusy = false;
    c.locErr = err && err.code === 1
      ? 'Location is blocked for this app. In Chrome tap the lock icon next to the address, ' +
        'then Permissions → Location → Allow, and try again.'
      : 'Could not get a GPS fix. Stand near a door or window and tap Find my location.';
    render();
  }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
}

// Metres, for the line under the selfie. The server does its own sum.
function metresBetween(a, b, c, d){
  var R = 6371000, r = Math.PI / 180;
  var x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2);
  var h = x * x + Math.cos(a * r) * Math.cos(c * r) * y * y;
  return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(h))));
}

function checkinWhere(){
  var c = state.checkin || {};
  if (c.locBusy) return { cls: '', text: 'Finding your location…' };
  if (c.locErr) return { cls: 'bad', text: c.locErr };
  if (!c.loc) return { cls: '', text: 'Location not found yet.' };
  var f = c.fence;
  if (!f) return { cls: 'ok', text: 'Location found (±' + c.loc.acc + ' m).' };
  var d = metresBetween(c.loc.lat, c.loc.lng, f.lat, f.lng);
  var far = d >= 1000 ? (d / 1000).toFixed(1) + ' km' : d + ' m';
  if (c.loc.acc > f.vagueM) {
    return { cls: 'bad', text: 'GPS is not accurate enough yet (±' + c.loc.acc + ' m). Stand near a door or window and tap Find my location.' };
  }
  if (d > f.radiusM) return { cls: 'bad', text: far + ' from the warehouse. You can check in within ' + f.radiusM + ' m.' };
  return { cls: 'ok', text: 'At the warehouse: ' + far + ' away (±' + c.loc.acc + ' m).' };
}

function checkinHTML(){
  var c = state.checkin || {};
  var where = checkinWhere();
  var ready = !!(c.selfie && c.loc && !c.locBusy && where.cls === 'ok');
  return '<div class="card">' +
    '<h3 style="margin:0 0 6px; font-size:17px;">Check in for today</h3>' +
    '<p class="hint" style="margin:0 0 12px;">' + esc(c.name || '') + ', take a selfie at the warehouse to start your day. ' +
      'It is saved with the time and where you are.</p>' +
    errHTML() +
    '<div class="selfie-box">' +
      (c.selfie
        ? '<img class="selfie-prev" src="data:image/jpeg;base64,' + c.selfie + '" alt="Your selfie" />' +
          '<button type="button" class="secondary" data-action="checkin-selfie">Retake selfie</button>'
        : '<button type="button" class="file-btn" data-action="checkin-selfie">Take selfie</button>') +
    '</div>' +
    '<div class="checkin-where ' + where.cls + '">' + esc(where.text) + '</div>' +
    (c.locBusy ? '' : '<button type="button" class="secondary" style="margin-top:8px;" data-action="checkin-locate">Find my location</button>') +
    '<div style="margin-top:16px;"><button class="primary" data-action="checkin-submit"' +
      (ready ? '' : ' disabled') + '>Check in</button></div>' +
    '<div style="margin-top:9px;"><button class="secondary" data-action="checkin-back">Back</button></div>' +
    '</div>';
}

function submitCheckin(){
  var c = state.checkin;
  if (!c || !c.selfie || !c.loc) return;
  state.loading = true; state.loadingMsg = 'Checking you in...'; render();
  var p = loginPayload(c.name, c.pin);
  p.selfieBase64 = c.selfie; p.selfieMime = 'image/jpeg';
  p.lat = c.loc.lat; p.lng = c.loc.lng; p.acc = c.loc.acc; p.locAt = c.loc.at;
  api('login', p, 45000).then(function(res){
    state.loading = false;
    if (res && res.success) { loginDone(res, c.name, c.pin); return; }
    if (res && res.needCheckIn) { startCheckin(res, c.name, c.pin); return; }
    state.error = (res && res.error) || 'Could not check in. Try again.';
    render();
  });
}

function loginHTML(){
  return '<div class="card">' +
    '<label>Login name</label>' +
    '<input type="text" id="login-name" value="' + esc(state.loginName) + '" placeholder="Your login name" autocapitalize="none" autocomplete="username" />' +
    '<label>PIN</label>' +
    '<input type="password" id="login-pin" value="" placeholder="Your PIN" inputmode="numeric" autocomplete="current-password" />' +
    errHTML() +
    '<div style="margin-top:17px;"><button class="primary" data-action="do-login">Log in</button></div>' +
    (BM_HOSTED
      ? '<div style="margin-top:9px;"><button class="secondary" data-action="practice">Practice</button></div>' +
        '<p class="hint" style="margin-top:6px; text-align:center;">Practice opens a sample route. No login, and nothing is saved.</p>'
      : '') +
    '</div>';
}

/******************** RESUME OPEN TRIP ********************/
// Shown when the route could not be reopened because the phone could
// not reach the server. The session is still saved, so this is a wait,
// not a logout - and it says so, because a DA who thinks he has been
// logged out will go looking for his code instead of pressing a button.
function reopenHTML(){
  var s = loadSession() || {};
  return '<div class="card">' +
    '<h3 style="margin:0 0 8px; font-size:17px;">Could not open your route</h3>' +
    '<p class="hint" style="margin:0 0 4px;">' + esc(state.reopenError || 'No connection.') + '</p>' +
    '<p class="hint">You are still signed in on code <strong>' + esc(s.code || state.code) +
      '</strong>. Nothing has been lost. Move to where there is signal and try again.</p>' +
    '<div style="margin-top:16px;"><button class="primary" data-action="reopen-retry">' +
      'Try again</button></div>' +
    '<div style="margin-top:9px;"><button class="secondary" data-action="reopen-login" ' +
      'style="width:100%;">Sign in again instead</button></div>' +
    '</div>';
}

function resumeHTML(){
  var t = state.openTrip || {};
  var dayNote = t.isToday ? 'started today' : 'started ' + esc(t.startedAt);
  return '<div class="card">' +
    '<h3 style="margin:0 0 8px; font-size:17px;">You have an open trip</h3>' +
    '<p class="hint" style="margin:0 0 4px;">Code <strong>' + esc(t.code) + '</strong>' +
    (t.vehicleNo ? ' \u00b7 ' + esc(t.vehicleNo) : '') + ', ' + dayNote + '.</p>' +
    '<p class="hint">Resume it to carry on, or end it to close the day and start a new route.</p>' +
    errHTML() +
    '<div style="margin-top:16px;"><button class="primary" data-action="resume-trip">Resume this trip</button></div>' +
    '<div style="margin-top:9px;"><button class="secondary" data-action="ask-end-trip-resume" style="width:100%;">End this trip</button></div>' +
    '</div>';
}

/******************** CODE ENTRY ********************/
function codeHTML(){
  return '<div class="card">' +
    '<label>Today\'s manifest code</label>' +
    '<input type="text" id="code-input" value="' + esc(state.code) + '" placeholder="e.g. XH4T2K" autocapitalize="characters" style="text-transform:uppercase; letter-spacing:2px; font-weight:600;" />' +
    '<label>Vehicle number</label>' +
    '<input type="text" id="vehicle-input" value="' + esc(state.vehicleNo) + '" placeholder="e.g. DL1CAA1111" autocapitalize="characters" style="text-transform:uppercase;" />' +
    errHTML() +
    '<div style="margin-top:17px;"><button class="primary" data-action="do-enter-code">Load my route</button></div>' +
    '<div class="hint">Find the code on your printed loading sheet, next to Vehicle no.</div>' +
    '<div class="hint">Practising? Enter <strong>DEMO</strong> for a sample route that saves nothing.</div>' +
    '</div>';
}

/******************** PROFILE ********************/
function profileHTML(){

    '</div>' +
    '<div class="card">' +
    '<h3 style="margin:0 0 6px; font-size:15px;">Change PIN</h3>' +

    '<input type="password" id="cur-pin" placeholder="Current PIN" inputmode="numeric" />' +

    '<input type="password" id="new-pin" placeholder="At least 4 characters" inputmode="numeric" />' +

    '<input type="password" id="new-pin2" placeholder="Repeat new PIN" inputmode="numeric" />' +

}

/******************** ORDER SCREEN ********************/
function currentOrder(){ return state.orders[state.orderIndex]; }

function orderHTML(){
  var o = currentOrder();
  if(!o) return '<div class="card">No orders on this route.</div>';

  var total = state.orders.length;
  var done = 0;
  for (var i = 0; i < state.orders.length; i++) {
    if (state.orders[i].currentStatus) done++;
  }

  var cod = isCodOrder(o);
  var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + o.lat + ',' + o.lng;

  // He photographed this stop, the page reloaded, and the photos came
  // back with it. Saying so is the difference between carrying on and
  // opening the camera again.
  var restored = '';
  if (state.podRestored && !o.currentStatus) {
    restored = '<div class="ok-note" style="margin-bottom:10px;">' +
      state.podRestored + (state.podRestored === 1 ? ' photo' : ' photos') +
      ' you took for this shop are still saved. Carry on from here.</div>';
  }

  var statusBlock = '';
  if (o.currentStatus) {
    var st = o.currentStatus['Status'];
    var cls = (st === 'Delivered') ? 'delivered' : 'notdelivered';
    var detail = '';
    if (st === 'Delivered') {
      detail = 'Cash ' + money(o.currentStatus['Cash Collected']) +
               ' \u00b7 UPI ' + money(o.currentStatus['UPI Collected']);
    } else {
      detail = esc(o.currentStatus['Reason'] || '');
    }
    statusBlock =
      '<div style="margin:15px 0 10px;">' +
        '<span class="badge ' + cls + '">' + esc(st) + '</span>' +
        (pendingFor(state.code, o.invoiceNo)
          ? '<span class="unsaved-tag" data-unsaved="' + esc(o.invoiceNo) + '">Not saved yet</span>' : '') +
        '<div class="hint">' + detail + '</div>' +
      '</div>' +
      '<button class="secondary small" data-action="remark">Change this status</button>';
  } else {
    statusBlock = restored +
      '<div class="action-grid">' +
        '<button class="action-btn delivered" data-action="start-mark" data-status="Delivered">Delivered</button>' +
        '<button class="action-btn notdelivered" data-action="start-mark" data-status="Not Delivered">Not delivered</button>' +
      '</div>';
  }

  var instr = o.instructions
    ? '<div class="field-row"><span class="l">Instructions</span><span class="v">' + esc(o.instructions) + '</span></div>'
    : '';

  // Return requests are raised by support against the shop, often
  // weeks earlier, and surface on whichever delivery comes next.
  var retBlock = '';
  var rets = o.returns || [];
  for (var k = 0; k < rets.length; k++) {
    var rq = rets[k];
    var collected = !!rq._collected;
    var deferred = !collected && !!rq._deferred;
    retBlock += '<div class="ret-box' + (collected ? ' ret-done' : '') +
      (deferred ? ' ret-defer' : '') + '">' +
      '<div class="ret-head">' + (collected ? 'RETURN COLLECTED'
        : (deferred ? 'RETURN PENDING \u2014 NEXT TIME' : 'RETURN REQUEST')) + '</div>' +
      '<div class="ret-detail">' + esc(rq.details) + '</div>' +
      '<div class="ret-meta">Raised by ' + esc(rq.raisedBy) + ' on ' + esc(rq.raisedAt) + '</div>' +
      ((collected || deferred)
        ? ''
        : '<div style="margin-top:10px;"><button class="secondary small" data-action="start-collect" data-rid="' +
          esc(rq.requestId) + '">Collect return</button></div>') +
      '</div>';
  }
  var codStr = cod ? ' \u00b7 ' + money(o.balanceDue) : '';
  var pct = total ? (done / total * 100) : 0;
  var finishBtn = (done === total && total > 0)
    ? '<div style="margin-top:13px;"><button class="primary" data-action="go-summary">Finish day</button></div>'
    : '';

  var prevDis = (state.orderIndex === 0) ? 'disabled' : '';
  var nextDis = (state.orderIndex === total - 1) ? 'disabled' : '';

  return '' +
    '<div class="progress-wrap">' +
      '<div style="display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft);">' +
        '<span>Stop ' + esc(o.sequence) + ' of ' + total + '</span>' +
        '<span>' + done + '/' + total + ' closed</span>' +
      '</div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="order-head">' +
        '<div class="stopnum">' + esc(o.sequence) + '</div>' +
        '<div class="name">' + esc(cleanName(o.partyName)) +
        ' <span class="name-id">(' + esc(shortId(o.invoiceNo)) + ')</span></div>' +
      '</div>' +
      '<div class="field-row"><span class="l">Shop Number</span><span class="v">' + esc(o.phone) + '</span></div>' +
      '<div class="field-row"><span class="l">SO name</span><span class="v">' + esc(o.soName) + '</span></div>' +
      '<div class="field-row"><span class="l">SO number</span><span class="v">' + esc(o.soNumber) + '</span></div>' +
      '<div class="field-row"><span class="l">Order type</span><span class="v">' + esc(o.orderType) + codStr + '</span></div>' +
      '<div class="field-row"><span class="l">Location</span><span class="v">' +
        '<a class="maps-link" href="' + mapUrl + '" target="_blank" rel="noopener">Open in Maps</a></span></div>' +
      instr +
      retBlock +
      statusBlock +
    '</div>' +
    '<div class="nav-row">' +
      '<button class="secondary" data-action="prev-order" ' + prevDis + '>Back</button>' +
      '<button class="secondary" data-action="next-order" ' + nextDis + '>Next</button>' +
    '</div>' +
    finishBtn;
}

// A bill revised after the route was loaded. The DA has to be told,
// not just handed a different number - the shopkeeper is holding the
// new invoice and will argue about the old one.
function revisedNote(o){
  if (!o || !o.dueChanged) return '';
  var was = Number(o.dueWas || 0), now = Number(o.balanceDue || 0);
  var dir = now < was ? 'reduced' : 'increased';
  return '<p class="hint" style="margin:6px 0 0; color:var(--warn, #9a6b00); font-weight:600;">' +
    'Bill ' + dir + ' after loading — was ' + money(was) + ', now ' + money(now) + '.' +
    '<br/>Collect ' + money(now) + '. The shop’s invoice shows this.</p>';
}

/******************** MARK SCREEN ********************/
function markHTML(){
  var o = currentOrder();
  if(!o) return '<div class="card">Order not found.</div>';
  var cod = isCodOrder(o);
  var balanceDue = Number(o.balanceDue || 0);

  if (state.markStatus === 'Delivered' && !cod) {

    // The shop has already paid, but the goods can still be wrong. One
    // tap closes a clean delivery; Report issue records what was wrong.
    if (!state.issueOpen) {
      return '<div class="card">' +
        '<p style="font-weight:600; margin:0 0 6px; font-size:15px;">Confirm delivery</p>' +
        '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
        '<p class="hint">Prepaid order \u2014 nothing to collect.</p>' +
        errHTML() +
        '<div class="action-grid" style="grid-template-columns:1fr 1fr; margin-top:14px;">' +
          '<button class="action-btn delivered" data-action="confirm-mark">Confirm</button>' +
          '<button class="action-btn notdelivered" data-action="issue-open">Report issue</button>' +
        '</div>' +
        '<div style="margin-top:12px;"><button class="secondary" data-action="cancel-mark" style="width:100%;">Back</button></div>' +
        '</div>';
    }

    var iopts = '<option value="">What was wrong?</option>';
    for (var ii = 0; ii < DELIVERY_ISSUES.length; ii++) {
      iopts += '<option value="' + DELIVERY_ISSUES[ii] + '"' +
        (state.issueType === DELIVERY_ISSUES[ii] ? ' selected' : '') + '>' +
        DELIVERY_ISSUES[ii] + '</option>';
    }
    var iimg = state.screenshotPreview
      ? '<img class="thumb" src="' + state.screenshotPreview + '" alt="" />' : '';
    var ibtn = state.screenshotPreview ? 'Change photo' : 'Add a photo (optional)';
    var iready = state.issueType && String(state.issueItems || '').trim();

    return '<div class="card">' +
      '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Report an issue</p>' +
      '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
      '<p class="hint">The order is still marked delivered. This tells the office what was wrong.</p>' +
      '<label>Issue</label>' +
      '<select id="issue-type">' + iopts + '</select>' +
      '<label>Which items, and how many</label>' +
      '<input type="text" id="issue-items" value="' + esc(state.issueItems) + '" placeholder="e.g. 2 cartons Maaza short" />' +
      '<label>Note (optional)</label>' +
      '<input type="text" id="issue-note" value="' + esc(state.issueNote) + '" placeholder="Anything else worth saying" />' +
      '<label>Photo (optional)</label>' + iimg +
      '<label class="file-btn">' + ibtn +
        '<input type="file" accept="image/*" id="screenshot-input" style="display:none;" /></label>' +
      errHTML() +
      '<div class="nav-row">' +
        '<button class="secondary" data-action="issue-cancel">Back</button>' +
        '<button class="primary" data-action="confirm-mark" ' + (iready ? '' : 'disabled') + '>Confirm delivery</button>' +
      '</div></div>';
  }

  if (state.markStatus === 'Delivered' && cod) {

    // Step 1 of a COD delivery: is the shop paying the full invoice?
    if (!state.amountChoice) {
      return '<div class="card">' +
        '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Mark delivered</p>' +
        '<p class="hint" style="margin:0 0 12px;">' + esc(cleanName(o.partyName)) + '</p>' +
        revisedNote(o) +
        '<div class="action-grid" style="grid-template-columns:1fr; margin-top:' +
          (o.dueChanged ? '12px' : '0') + ';">' +
          '<button class="action-btn delivered" data-action="amt-full">' +
            'Full amount ' + money(balanceDue) + '</button>' +
          '<button class="action-btn notdelivered" data-action="amt-diff">' +
            'Different amount</button>' +
        '</div>' +
        errHTML() +
        '<div style="margin-top:12px;"><button class="secondary" data-action="cancel-mark" style="width:100%;">Back</button></div>' +
        '</div>';
    }

    // Step 2, only when it is not the full amount: how much, why, proof.
    if (state.amountChoice === 'diff' && !state.amountDone) {
      var sopts = '<option value="">Select a reason</option>';
      for (var si = 0; si < SHORT_REASONS.length; si++) {
        sopts += '<option value="' + SHORT_REASONS[si] + '"' +
          (state.shortReason === SHORT_REASONS[si] ? ' selected' : '') + '>' +
          SHORT_REASONS[si] + '</option>';
      }
      var simg = state.screenshotPreview
        ? '<img class="thumb" src="' + state.screenshotPreview + '" alt="" />' : '';
      var sbtn = state.screenshotPreview ? 'Change photo' : 'Take photo';
      var sready = state.collectedInput !== '' && state.shortReason && state.screenshotBase64;

      return '<div class="card">' +
        '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Amount collected</p>' +
        '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
        '<p class="hint" style="font-weight:600; color:var(--ink);">Invoice: ' + money(balanceDue) + '</p>' +
        revisedNote(o) +
        '<label>Amount actually collected</label>' +
        '<input type="number" inputmode="decimal" id="collected-input" value="' + esc(state.collectedInput) + '" placeholder="0" />' +
        '<label>Why less than the invoice</label>' +
        '<select id="short-reason">' + sopts + '</select>' +
        '<label>Note (optional)</label>' +
        '<input type="text" id="short-note" value="' + esc(state.shortNote) + '" placeholder="Extra detail" />' +
        '<label>Photo (required)</label>' + simg +
        '<label class="file-btn">' + sbtn +
          '<input type="file" accept="image/*" id="screenshot-input" style="display:none;" /></label>' +
        errHTML() +
        '<div class="nav-row">' +
          '<button class="secondary" data-action="amt-back">Back</button>' +
          '<button class="primary" data-action="amt-next" ' + (sready ? '' : 'disabled') + '>Continue</button>' +
        '</div>' +
        '</div>';
    }

    // Step 3: how the money was paid. Validated against what was
    // actually collected, not the invoice.
    var due = collectedDue(o);
    var amountFields = '';
    if (state.payMode === 'Split') {
      var splitTotal = (Number(state.cashInput)||0) + (Number(state.upiInput)||0);
      amountFields =
        '<label>Cash amount</label>' +
        '<input type="number" inputmode="decimal" id="cash-input" value="' + esc(state.cashInput) + '" />' +
        '<label>UPI amount</label>' +
        '<input type="number" inputmode="decimal" id="upi-input" value="' + esc(state.upiInput) + '" />' +
        '<div class="hint" id="split-hint">Must add up to ' + money(due) +
        '. Currently ' + money(splitTotal) + '.</div>';
    }

    var needsShot = state.payMode === 'UPI' || state.payMode === 'Split';
    var shotHTML = '';
    if (needsShot) {
      var img = state.screenshotPreview
        ? '<img class="thumb" src="' + state.screenshotPreview + '" alt="" />' : '';
      var btnTxt = state.screenshotPreview ? 'Change screenshot' : 'Upload or take a photo';
      shotHTML =
        '<label>Payment screenshot</label>' + img +
        '<label class="file-btn">' + btnTxt +
        '<input type="file" accept="image/*" id="screenshot-input" style="display:none;" /></label>';
    }

    var shotMissing = (state.payMode === 'UPI' || state.payMode === 'Split') &&
                      !state.screenshotBase64 && !state.screenshotLink;
    var confirmDis = (state.payMode && !shotMissing) ? '' : 'disabled';
    var shortLine = (state.amountChoice === 'diff')
      ? '<p class="hint" style="color:var(--amber); font-weight:600;">Short by ' +
        money(balanceDue - due) + ' \u2014 ' + esc(state.shortReason) + '</p>'
      : '';

    return '<div class="card">' +
      '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Payment</p>' +
      '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
      '<p class="hint" style="font-weight:600; color:var(--ink);">To collect: ' + money(due) + '</p>' +
      shortLine +
      '<div class="pay-grid">' +
        '<div class="pay-opt' + (state.payMode==='Cash'?' active':'') + '" data-action="pick-pay" data-mode="Cash">Cash</div>' +
        '<div class="pay-opt' + (state.payMode==='UPI'?' active':'') + '" data-action="pick-pay" data-mode="UPI">UPI</div>' +
        '<div class="pay-opt' + (state.payMode==='Split'?' active':'') + '" data-action="pick-pay" data-mode="Split">Split</div>' +
      '</div>' +
      amountFields + shotHTML +
      (shotMissing ? '<div class="hint" style="color:var(--amber); font-weight:600;">' +
        'Add the screenshot to continue \u2014 the office cannot accept a UPI payment without it.</div>' : '') +
      errHTML() +
      '<div class="nav-row">' +
        '<button class="secondary" data-action="pay-back">Back</button>' +
        '<button class="primary" data-action="confirm-mark" ' + confirmDis + '>Confirm</button>' +
      '</div></div>';
  }

  // Not delivered
  var opts = '<option value="">Select a reason</option>';
  for (var i = 0; i < REASONS.length; i++) {
    var sel = (state.reasonInput === REASONS[i]) ? ' selected' : '';
    opts += '<option value="' + REASONS[i] + '"' + sel + '>' + REASONS[i] + '</option>';
  }

  var img2 = state.screenshotPreview
    ? '<img class="thumb" src="' + state.screenshotPreview + '" alt="" />' : '';
  var btnTxt2 = state.screenshotPreview ? 'Change photo' : 'Take proof picture';
  var ndDis = (state.reasonInput && state.screenshotBase64) ? '' : 'disabled';

  return '<div class="card">' +
    '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Mark not delivered</p>' +
    '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
    '<label>Reason</label>' +
    '<select id="reason-select">' + opts + '</select>' +
    '<label>Proof picture (required)</label>' + img2 +
    '<label class="file-btn">' + btnTxt2 +
    '<input type="file" accept="image/*" id="screenshot-input" style="display:none;" /></label>' +
    errHTML() +
    '<div class="nav-row">' +
      '<button class="secondary" data-action="cancel-mark">Back</button>' +
      '<button class="primary" data-action="confirm-mark" ' + ndDis + '>Confirm</button>' +
    '</div></div>';
}

/******************** COLLECT RETURN ********************/
// Proof of delivery: a photo of the goods at the shop and the
// shopkeeper's signature. Shown after the money is settled, so the DA
// is not holding up the shop while he draws.
//
// A DA who genuinely cannot capture proof - no camera, no signal, a
// shopkeeper who will not sign - says why and the delivery still goes
// through. Blocking him would strand the stop; recording the reason
// keeps "no proof" visible instead of invisible.
function podHTML(){
  var o = currentOrder();
  if(!o) return '<div class="card">Order not found.</div>';

  if (state.podSkipOpen) {
    var sopts = '<option value="">Why is there no proof?</option>';
    for (var k = 0; k < POD_SKIP_REASONS.length; k++) {
      sopts += '<option value="' + POD_SKIP_REASONS[k] + '"' +
        (state.podSkipReason === POD_SKIP_REASONS[k] ? ' selected' : '') + '>' +
        POD_SKIP_REASONS[k] + '</option>';
    }
    return '<div class="card">' +
      '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">No proof for this delivery</p>' +
      '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
      '<p class="hint">The delivery is still recorded. The office will see that no proof was taken.</p>' +
      errHTML() +
      '<label>Reason</label>' +
      '<select id="pod-skip-reason">' + sopts + '</select>' +
      '<label>Note (optional)</label>' +
      '<input type="text" id="pod-skip-note" value="' + esc(state.podSkipNote) + '" placeholder="Anything worth saying" />' +
      '<div style="margin-top:14px;">' +
        '<button class="primary" data-action="pod-skip-confirm" ' +
          (state.podSkipReason ? '' : 'disabled') + ' style="width:100%;">Mark delivered without proof</button>' +
      '</div>' +
      '<div style="margin-top:10px;">' +
        '<button class="secondary" data-action="pod-skip-close" style="width:100%;">Back</button>' +
      '</div>' +
      '</div>';
  }

  var shots = state.podPhotos || [];
  var full = shots.length >= POD_MAX_PHOTOS;
  var pimg = shots.length
    ? '<div class="shot-row">' + shots.map(function(sh, i){
        return '<div class="shot">' +
          '<img src="' + podThumbSrc(sh) + '" alt="Photo ' + (i + 1) + '" />' +
          '<button type="button" class="shot-x" data-action="pod-photo-remove" ' +
            'data-i="' + i + '" aria-label="Remove photo ' + (i + 1) + '">&times;</button>' +
          (sh.uploading ? '<span class="shot-up">\u2191</span>' : '') +
          '</div>';
      }).join('') + '</div>'
    : '';
  var pbtn = shots.length ? 'Add another photo' : 'Take photo of the goods';
  var ready = shots.length && state.podSigBase64;

  return '<div class="card">' +
    '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Proof of delivery</p>' +
    '<p class="hint" style="margin:0 0 2px;">' + esc(cleanName(o.partyName)) + '</p>' +
    '<p class="hint">A photo and a signature, so a later dispute can be answered.</p>' +
    errHTML() +

    '<label>Goods at the shop' +
      (shots.length ? ' <span class="hint">(' + shots.length + ' of ' + POD_MAX_PHOTOS + ')</span>' : '') +
    '</label>' + pimg +
    (full
      ? '<p class="hint" style="margin-top:6px;">That is the most this delivery can carry. ' +
        'Remove one to take another.</p>'
      : '<div class="pod-btns">' +
          (inAppCamera()
            ? '<button type="button" class="file-btn" data-action="pod-camera-open">' + pbtn + '</button>'
            : '<label class="file-btn">' + pbtn +
              '<input type="file" accept="image/*" capture="environment" id="pod-photo-input" style="display:none;" /></label>') +
          '<label class="file-btn alt">Upload from gallery' +
            '<input type="file" accept="image/*" multiple id="pod-gallery-input" style="display:none;" /></label>' +
        '</div>' +
        (inAppCamera()
          ? '<label class="hint" style="display:block; margin-top:6px; text-decoration:underline;">' +
              'Camera not starting? Use the phone camera app' +
              '<input type="file" accept="image/*" capture="environment" id="pod-photo-input" style="display:none;" /></label>'
          : '<p class="hint" style="margin-top:6px;">App logging out when the camera opens? ' +
              'Take the photo with the phone camera first, then tap <b>Upload from gallery</b>. ' +
              'It must be taken in the last ' + POD_GALLERY_MAX_AGE_MIN + ' minutes.</p>')) +

    '<label style="margin-top:14px;">Shopkeeper\u2019s signature</label>' +

    // The sentence the signature is against. Without it a signature
    // only proves somebody signed; with it, and the invoice number in
    // it, a later "items were short" claim has something to answer.
    // It also works at the stop: a shopkeeper who is genuinely short
    // will refuse to sign this, which sends the DA to Report issue or
    // the short-payment flow, where he should have gone anyway.
    '<div class="declaration">' +
      'I have received all the goods on invoice <b>' + esc(o.invoiceNo) + '</b>, ' +
      'complete and in good condition.' +
      '<div class="declaration-hi">\u092E\u0948\u0902\u0928\u0947 \u0907\u0938 \u092C\u093F\u0932 \u0915\u093E \u0938\u093E\u0930\u093E \u0938\u093E\u092E\u093E\u0928 \u092A\u0942\u0930\u093E \u0914\u0930 \u0938\u0939\u0940 \u0939\u093E\u0932\u0924 \u092E\u0947\u0902 \u092A\u094D\u0930\u093E\u092A\u094D\u0924 \u0915\u0930 \u0932\u093F\u092F\u093E \u0939\u0948\u0964</div>' +
    '</div>' +

    '<canvas id="pod-sig" class="sigpad"></canvas>' +
    '<div class="row" style="margin-top:6px;">' +
      '<span class="hint grow" id="pod-sig-hint">' +
        (state.podSigBase64 ? 'Signed' : 'Ask them to sign above') + '</span>' +

function collectHTML(){

}

/******************** UPDATES THE SERVER REFUSED ********************/
// Something the server will not accept never fixes itself. Show the DA
// exactly which orders, what the server said, and let them re-do or
// remove each one.
function stuckHTML(){
  var jobs = state.pending.slice();
  if (!jobs.length) {
    return '<div class="card"><p style="font-weight:600; margin:0 0 6px;">All updates saved</p>' +
      '<p class="hint" style="margin:0;">Nothing is waiting.</p>' +
      '<div class="nav-row"><button class="primary" data-action="stuck-back" style="width:100%;">Back</button></div></div>';
  }

  var rows = jobs.map(function(j, i){
    var p = j.payload;
    var o = null;
    for (var k = 0; k < state.orders.length; k++) {
      if (state.orders[k].invoiceNo === p.invoiceNo) o = state.orders[k];
    }
    return '<div class="card" style="margin-bottom:10px;">' +
      '<p style="font-weight:600; margin:0 0 2px; font-size:14.5px;">' +
        esc(o ? cleanName(o.partyName) : shortId(p.invoiceNo)) + '</p>' +
      '<p class="hint" style="margin:0 0 6px;">' + esc(shortId(p.invoiceNo)) + ' \u00b7 ' + esc(p.status || '') +
        (p.cashCollected ? ' \u00b7 Cash ' + money(p.cashCollected) : '') +
        (p.upiCollected ? ' \u00b7 UPI ' + money(p.upiCollected) : '') + '</p>' +
      (j.rejected
        ? '<div class="err" style="margin:0 0 8px;">Server refused it: ' + esc(j.lastError || '') + '</div>'
        : '<p class="hint" style="margin:0 0 8px;">Waiting to send\u2026 (' + (j.attempts || 0) + ' tries)</p>') +
      (j.rejected
        ? '<button class="secondary" data-action="stuck-drop" data-idx="' + i + '" style="width:100%;">' +
          'Remove this update</button>'
        : '') +
      '</div>';
  }).join('');

  return '<div class="card">' +
      '<p style="font-weight:600; margin:0 0 4px; font-size:15px;">Updates not saved</p>' +
      '<p class="hint" style="margin:0;">Tap Try again once you have signal. If the server keeps refusing one, ' +
      'remove it here and tell the office \u2014 then mark that order again.</p>' +
      '<div class="nav-row">' +
        '<button class="secondary" data-action="stuck-back">Back</button>' +
        '<button class="primary" data-action="stuck-retry">Try again</button>' +
      '</div>' +
    '</div>' + rows;
}

/******************** SENDING SAVED UPDATES ********************/
function flushHTML(){
  var n = state.pending.length;
  if (!state.flushFailed) {
    return '<div class="card" style="text-align:center;">' +
      '<p style="font-weight:600; margin:0 0 6px; font-size:15px;">Sending saved updates\u2026</p>' +
      '<p class="hint" style="margin:0;">' + n + (n === 1 ? ' update' : ' updates') +
      ' from earlier ' + (n === 1 ? 'was' : 'were') + ' saved on this phone. Sending them now.</p>' +
      '</div>';
  }
  var bad = rejectedJobs();
  var why = bad.length
    ? '<p class="hint" style="margin:0 0 4px;">' + bad.length +
      (bad.length === 1 ? ' update was refused' : ' updates were refused') + ' by the office: ' +
      esc(bad[0].lastError) + '</p>' +
      '<p class="hint">Retrying will not help. Open \u201cUpdates not saved\u201d from the menu to see them, ' +
      'remove the one that was refused, and mark that order again.</p>'
    : '<p class="hint" style="margin:0 0 4px;">' + n + (n === 1 ? ' update' : ' updates') +
      ' from earlier could not be sent \u2014 no connection. They are safe on this phone and will keep trying.</p>' +
      '<p class="hint">You can carry on working. Ending a trip will wait until they have been sent.</p>';

  return '<div class="card">' +
    '<p style="font-weight:600; margin:0 0 6px; font-size:15px;">Some updates are still waiting</p>' +
    why +
    '<div class="nav-row">' +
      '<button class="secondary" data-action="flush-continue">Continue</button>' +
      '<button class="primary" data-action="flush-retry">Try again</button>' +
    '</div></div>';
}

/******************** TRIP CLOSE ********************/
// The close request is already running in the background while this

/******************** SUMMARY ********************/
function summaryHTML(){
  var total = state.orders.length;
  var delivered = 0, notDelivered = 0, cashTotal = 0;
  for (var i = 0; i < state.orders.length; i++) {
    var cs = state.orders[i].currentStatus;

    if (cs['Status'] === 'Delivered') delivered++;
    else notDelivered++;
    cashTotal += Number(cs['Cash Collected'] || 0);

  var stats =
    '<div class="stat"><span class="l">Delivered</span><span class="n">' + delivered + '/' + total + '</span></div>' +
    '<div class="stat"><span class="l">Not delivered</span><span class="n">' + notDelivered + '</span></div>';

    '<div class="card cash-card">' +
      '<p class="hint" style="margin:0 0 5px;">Cash to deposit</p>' +
      '<p class="cash-amt">' + money(cashTotal) + '</p>' +
    '</div>';

  if (state.tripClosed) {
    return '' +
      '<div class="card" style="text-align:center;">' +
        '<p style="font-size:18px; font-weight:700; margin:0 0 5px;">Day closed</p>' +
        '<p class="hint" style="margin:0;">Trip end time recorded. Thanks for the run today.</p>' +
      '</div>' +
      stats + cashCard +

        ? '<p class="hint" style="margin:-4px 2px 12px;">Return proofs saved: ' + state.rp.list.length + '</p>' : '') +
      errHTML() +
      '<div style="margin-top:4px;"><button class="secondary" data-action="reopen-trip" style="width:100%;">Reopen this trip</button></div>' +
      '<div style="margin-top:10px;"><button class="primary" data-action="logout">Log out</button></div>';
  }

  return '' + stats + cashCard + errHTML() +
    '<button class="primary" data-action="ask-end-trip">End trip</button>' +
    '<div style="margin-top:10px;"><button class="secondary" data-action="back-to-orders" style="width:100%;">Back to orders</button></div>';
}

/******************** RETURN PROOFS (end of trip, new app only) ********************/
// Before ending the trip the DA types the SO number of each order he is
// bringing back and photographs the goods, one order at a time. Accounts
// see the photos in the collection report. The old Apps Script link
// keeps its old End trip; this runs only on the GitHub app.
var RP_MAX_PHOTOS = 4;

function rpEnabled(){ return BM_HOSTED && !!state.code && !state.tripClosed; }

function rpBlank(){ return { q: '', match: null, photos: [] }; }

function openReturnProofs(){
  state.menuOpen = false;
  // A different route (or a new login) starts its own list.
  if (!state.rp || state.rp.code !== state.code) state.rp = { list: [], loaded: false, code: state.code };
  var keep = state.rp;
  state.rp = Object.assign(keep, rpBlank());
  state.view = 'retproof';
  render();
  if (!keep.loaded && !state.isDemo) {
    api('listReturnProofs', { code: state.code }).then(function(res){
      if (res && res.success) {
        state.rp.list = res.items || [];
        state.rp.loaded = true;
        if (state.view === 'retproof' && !rpTyping()) render();
      }
    });
  }
}

// The order on this route whose number ends in what was typed. An exact
// number wins; otherwise only a single order ending in it counts.
function rpMatch(q){
  q = String(q || '').replace(/\D/g, '');
  if (q.length < 3) return null;
  var exact = null, ends = [];
  for (var i = 0; i < state.orders.length; i++) {
    var o = state.orders[i];
    var runs = String(o.invoiceNo || '').match(/\d+/g);
    var tail = runs ? runs[runs.length - 1] : '';
    if (tail === q) exact = o;
    else if (tail.slice(-q.length) === q) ends.push(o);
  }
  return exact || (ends.length === 1 ? ends[0] : null);
}

function rpCash(){
  var total = 0;
  for (var i = 0; i < state.orders.length; i++) {
    var cs = state.orders[i].currentStatus;
    if (cs) total += Number(cs['Cash Collected'] || 0);
  }
  return total;
}

function rpTyping(){
  var a = document.activeElement;
  return !!(a && a.id === 'rp-q');
}

function rpThumb(sh){
  if (sh.base64) return 'data:' + (sh.mime || 'image/jpeg') + ';base64,' + sh.base64;
  return sh.link ? thumbFor(sh.link) : '';
}

function retproofHTML(){
  var r = state.rp || rpBlank();
  var m = r.match;
  var shots = r.photos || [];
  var full = shots.length >= RP_MAX_PHOTOS;
  var rows = shots.length
    ? '<div class="shot-row">' + shots.map(function(sh, i){
        return '<div class="shot">' +
          '<img src="' + rpThumb(sh) + '" alt="Photo ' + (i + 1) + '" />' +
          '<button type="button" class="shot-x" data-action="rp-photo-remove" data-i="' + i + '" ' +
            'aria-label="Remove photo ' + (i + 1) + '">&times;</button>' +
          (sh.uploading ? '<span class="shot-up">↑</span>' : '') +
          (sh.failed ? '<span class="shot-up" style="background:#B42318;">!</span>' : '') +
          '</div>';
      }).join('') + '</div>'
    : '';
  var camBtn = full ? '' : (inAppCamera()
    ? '<button type="button" class="file-btn" id="rp-cam" data-action="rp-cam"' + (m ? '' : ' disabled') + '>' +
        (shots.length ? 'Add another photo' : 'Take photo of the goods') + '</button>'
    : '<label class="file-btn">' + (shots.length ? 'Add another photo' : 'Take photo of the goods') +
        '<input type="file" accept="image/*" capture="environment" id="rp-file" style="display:none;"' +
        (m ? '' : ' disabled') + ' /></label>');

  var list = (r.list || []).map(function(x){
    return '<div class="card" style="padding:11px 13px; margin-bottom:8px;"><div style="display:flex; align-items:center; gap:10px;">' +
      '<div style="flex:1; min-width:0;">' +
        '<div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' +
          esc(cleanName(x.partyName) || x.invoiceNo) + '</div>' +
        '<div class="hint" style="margin:0;">SO ' + esc(x.soNo) + ' · ' + x.photos.length +
          ' photo' + (x.photos.length === 1 ? '' : 's') + (x.at ? ' · ' + esc(x.at) : '') + '</div>' +
      '</div>' +
      '<button type="button" class="secondary" style="width:auto; padding:6px 12px;" data-action="rp-del" ' +
        'data-inv="' + esc(x.invoiceNo) + '">Remove</button>' +
    '</div></div>';
  }).join('');

  var busy = r.saving || r.waitSave;
  return '<div class="card">' +
      '<p style="font-weight:600; margin:0 0 3px; font-size:15px;">Return proofs</p>' +
      '<p class="hint">For each order you are bringing back: type its SO number, take a photo of the goods, ' +
        'then tap Save. When all are done, tap <b>End day</b>.</p>' +
      errHTML() +
      '<label>SO number</label>' +
      '<input type="text" id="rp-q" inputmode="numeric" autocomplete="off" placeholder="Last digits, e.g. 38307" value="' +
        esc(r.q) + '" />' +
      '<p class="hint" id="rp-match" style="margin:6px 0 0;">' + rpMatchText(r) + '</p>' +
      '<label style="margin-top:12px;">Photos' +
        (shots.length ? ' <span class="hint">(' + shots.length + ' of ' + RP_MAX_PHOTOS + ')</span>' : '') +
      '</label>' + rows +
      (camBtn ? '<div class="pod-btns">' + camBtn + '</div>' : '') +
      '<div style="margin-top:14px;"><button class="primary" data-action="rp-save" style="width:100%;"' +
        (busy ? ' disabled' : '') + '>' +
        (r.waitSave ? 'Waiting for the photo to upload…' : r.saving ? 'Saving…' : 'Save & next SO') +
      '</button></div>' +
    '</div>' +
    (list ? '<p class="hint" style="margin:14px 2px 6px;"><b>Saved (' + r.list.length + ')</b></p>' + list
          : '<p class="hint" style="margin:14px 2px 6px;">No return proofs saved yet.</p>') +
    '<div class="card cash-card">' +
      '<p class="hint" style="margin:0 0 5px;">Cash to hand over</p>' +
      '<p class="cash-amt">' + money(rpCash()) + '</p>' +
    '</div>' +
    '<button class="primary" data-action="ask-end-trip"' + (busy ? ' disabled' : '') + '>End day</button>' +
    '<div style="margin-top:10px;"><button class="secondary" data-action="back-to-orders" style="width:100%;">Back to orders</button></div>';
}

function rpMatchText(r){
  var q = String(r.q || '').replace(/\D/g, '');
  if (!q) return '';
  if (r.match) return '✔ ' + esc(cleanName(r.match.partyName)) + ' · ' + esc(shortId(r.match.invoiceNo));
  return q.length < 3 ? 'Keep typing…' : 'Not on this route. Check the number.';
}

function rpOnType(el){
  var r = state.rp; if (!r) return;
  r.q = el.value;
  var was = r.match;
  r.match = rpMatch(r.q);
  // A new order means the photos were of something else.
  if (was && r.match !== was) r.photos = [];
  var t = document.getElementById('rp-match');
  if (t) t.innerHTML = rpMatchText(r);
  var b = document.getElementById('rp-cam');
  if (b) b.disabled = !r.match;
  var f = document.getElementById('rp-file');
  if (f) f.disabled = !r.match;
}

function rpUpload(){
  var r = state.rp; if (!r || !r.match) return;
  var inv = r.match.invoiceNo;
  r.photos.forEach(function(sh){
    if (sh.link || sh.uploading) return;
    if (state.isDemo) { sh.link = 'demo'; return; }
    sh.uploading = true; sh.failed = false;
    api('uploadPhoto', { code: state.code, invoiceNo: inv, kind: 'ret',
                         screenshotBase64: sh.base64, screenshotMime: sh.mime }).then(function(res){
      sh.uploading = false;
      if (res && res.success && res.link) { sh.link = res.link; sh.base64 = null; }
      else sh.failed = true;
      if (r.waitSave) { rpSave(); return; }
      if (state.view === 'retproof' && !rpTyping()) render();
    });
  });
}

function rpSave(){
  var r = state.rp; if (!r) return;
  var el = document.getElementById('rp-q'); if (el) rpOnType(el);
  if (!r.match) { r.waitSave = false; state.error = 'Type the SO number of an order on this route.'; render(); return; }
  if (!r.photos.length) { r.waitSave = false; state.error = 'Take a photo of the goods first.'; render(); return; }
  if (r.photos.some(function(p){ return p.failed; })) {
    r.waitSave = false;
    state.error = 'A photo did not upload. Remove it (×) and take it again.'; render(); return;
  }
  if (r.photos.some(function(p){ return p.uploading || !p.link; })) {
    r.waitSave = true; render(); rpUpload(); return;
  }
  r.waitSave = false;
  var o = r.match;
  var links = r.photos.map(function(p){ return p.link; });
  var done = function(item){
    r.list = r.list.filter(function(x){ return x.invoiceNo !== item.invoiceNo; }).concat([item]);
    var keepList = r.list, loaded = r.loaded;
    state.rp = Object.assign(rpBlank(), { list: keepList, loaded: loaded, code: r.code });
    state.note = '';
    render();
    var q = document.getElementById('rp-q'); if (q) q.focus();
  };
  var local = { invoiceNo: o.invoiceNo, soNo: shortId(o.invoiceNo).replace(/\D/g, '') || shortId(o.invoiceNo),
                partyName: o.partyName, photos: links, at: '' };
  if (state.isDemo) { done(local); return; }
  r.saving = true; render();
  api('saveReturnProof', { loginName: state.loginName, code: state.code, invoiceNo: o.invoiceNo, photos: links })
    .then(function(res){
      r.saving = false;
      if (res && res.success) { done(res.item || local); return; }
      state.error = (res && res.error) || 'Could not save. Check signal and tap Save again.';
      render();
    });
}

function rpDelete(inv){
  var r = state.rp; if (!r) return;
  if (!confirm('Remove this return proof?')) return;
  var drop = function(){ r.list = r.list.filter(function(x){ return x.invoiceNo !== inv; }); render(); };
  if (state.isDemo) { drop(); return; }
  api('deleteReturnProof', { code: state.code, invoiceNo: inv }).then(function(res){
    if (res && res.success) drop();
    else { state.error = (res && res.error) || 'Could not remove it.'; render(); }
  });
}

function rpAddFile(input){
  var f = input.files && input.files[0];
  try { input.value = ''; } catch (e) {}
  if (!f || !state.rp) return;
  compressImage(f, function(out){
    if (state.rp.photos.length < RP_MAX_PHOTOS) {
      state.rp.photos.push({ base64: out.base64, mime: out.mime, link: null, uploading: false });
    }
    render();
    rpUpload();
  });
}
